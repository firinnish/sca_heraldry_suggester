<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What are you searching for?</title>
<style>
  :root { --ink: #2b2620; --paper: #faf6ee; --line: #d8cfba; --accent: #5b4b8a; --muted: #6b6252; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px 16px 60px; font-family: Georgia, 'Iowan Old Style', serif; background: var(--paper); color: var(--ink); }
  main { max-width: 1180px; margin: 0 auto; }
  h1 { font-size: 1.6rem; margin: 0 0 18px; }
  h2 { font-size: 1.1rem; margin: 0 0 12px; }

  /* Questions on the left (two thirds), the current shield on the right (one third). */
  .layout { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 18px; align-items: start; }
  .current { position: sticky; top: 16px; }
  @media (max-width: 760px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    .current { position: static; }
  }

  .panel { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin-bottom: 18px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .row + .row { margin-top: 12px; }
  .row-label { font-size: 0.8rem; color: var(--muted); margin: 14px 0 6px; }

  button { font-family: inherit; color: var(--ink); cursor: pointer; }
  .swatch, .card {
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    background: #fff; border: 2px solid var(--line); border-radius: 8px; padding: 8px 6px; font-size: 0.82rem;
  }
  .swatch { width: 92px; }
  .swatch svg { width: 44px; height: 44px; }
  .swatch.small { width: 62px; padding: 6px 4px; font-size: 0.72rem; }
  .swatch.small svg { width: 30px; height: 30px; }
  .swatch small, .card small { color: var(--muted); font-size: 0.74rem; text-align: center; }
  .swatch .tick { height: 1em; font-size: 0.9rem; line-height: 1; color: var(--accent); }
  .card { width: 112px; }
  .card svg { width: 76px; height: auto; }
  [aria-pressed="true"] { border-color: var(--accent); background: #f3f0fa; font-weight: bold; }
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .plain-btn { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; font-size: 0.85rem; margin-bottom: 12px; }
  .complex-card { justify-content: center; min-height: 128px; font-style: italic; }
  .name-btn { background: #fff; border: 2px solid var(--line); border-radius: 16px; padding: 4px 11px; font-size: 0.82rem; }

  .builder { display: grid; gap: 10px; }
  .builder label, .inline { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 0.9rem; }
  select, input[type="search"] { font-family: inherit; font-size: 0.9rem; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); max-width: 100%; }
  input[type="search"] { width: 100%; margin-bottom: 12px; }

  .current svg { display: block; width: 100%; max-width: 300px; height: auto; margin: 0 auto 14px; }
  .blazon { font-size: 1.1rem; font-style: italic; margin: 0 0 14px; text-align: center; overflow-wrap: anywhere; }
  .search-link { display: block; text-align: center; background: var(--accent); color: #fff; text-decoration: none; padding: 10px 14px; border-radius: 6px; font-size: 0.95rem; }
  .search-link:hover { background: #453a6b; }
  .note { font-size: 0.85rem; color: var(--muted); margin: 10px 0 0; }
  details { margin-top: 12px; font-size: 0.82rem; color: var(--muted); }
  code { display: block; white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 6px; color: var(--ink); }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <div class="layout">
    <div class="questions">
      <section class="panel">
        <h2 id="coloursHeading"></h2>
        <div class="row" id="mainSwatches"></div>
        <div class="row-label" id="fursLabel"></div>
        <div class="row" id="furSwatches"></div>
      </section>
      <section class="panel" id="divisionPanel" hidden></section>
      <section class="panel" id="chargePanel" hidden></section>
    </div>
    <aside class="panel current" id="currentPanel" aria-live="polite"></aside>
  </div>
</main>

<script type="module">
import { TINCTURES, DIVISIONS, ORDINARIES, COLOUR_ORDER, METAL_ORDER, FUR_ORDER, divisionsWithParts } from '../../core/catalog.js';
import { plain, divided, tincturesIn, blazon, ordinaryGroup, chargeGroupFromLibrary } from '../../core/shield.js';
import { shieldSVG, swatchSVG } from '../../core/draw.js';
import { shieldPatterns, complexSearchURL } from '../../core/oanda.js';
import { loadLibrary } from '../../core/art.js';

// ---------------------------------------------------------------------------
// ALL THE WORDS ON THE PAGE live here, so they can be rewritten in one place.
// Lines marked DRAFT were placeholders written while building: please rewrite.
// ---------------------------------------------------------------------------
const TEXT = {
  title: 'What are you searching for?',
  coloursHeading: 'What colours are in the background (on the field)?',
  fursLabel: 'Furs',                                                    // DRAFT
  plainBackground: colour => `Plain ${colour} Background`,
  dividedHeading: 'How is the background divided?',
  complexOption: 'more complex background',
  swap: 'Swap the two colours',                                         // DRAFT
  builderDivision: 'The background is divided',                         // DRAFT
  builderPart: n => `Part ${n} is`,                                     // DRAFT
  builderAnd: 'and',                                                    // DRAFT
  chargeHeading: 'What is the primary charge?',
  chargeSearch: 'Type to find a charge',                                // DRAFT
  chargeNone: 'no charge',                                              // DRAFT
  chargeNoPicture: 'Charges we have no picture of yet (shown as a blob)', // DRAFT
  chargeMore: n => `…and ${n} more. Type to narrow the list.`,          // DRAFT
  chargeNoMatch: 'No charge matches that.',                             // DRAFT
  chargeNumber: 'How many?',                                            // DRAFT
  chargeColour: 'What colour is it?',                                   // DRAFT
  currentEmpty: 'Your shield will appear here.',                        // DRAFT
  searchLink: 'Search the Ordinary & Armorial for this',               // DRAFT
  tincturesNotIndexed: 'The Ordinary & Armorial does not record which colours a three-part background uses, so this search finds every background divided this way.', // DRAFT
  patternsSummary: 'What gets filled in on the Complex Search Form',   // DRAFT
};

const MAX_NAMES_SHOWN = 40;
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const $ = id => document.getElementById(id);

// ---- State -----------------------------------------------------------------
const state = {
  picked: [],        // field tincture ids, in the order they were ticked
  order: [],         // the same tinctures in the order used for the pictures
  choice: null,      // { division, order } | 'complex' | null
  builder: null,     // the "more complex background" form
  charge: null,      // { kind: 'ordinary', id } | { kind: 'charge', id, file } | null
  chargeNumber: 1,
  chargeTincture: null,
  chargeFilter: '',
};
let library = { charges: [], pictures: [] };   // filled in once charges/ has loaded

function resetChoice() {
  state.order = [...state.picked];
  state.choice = state.picked.length >= 4 ? 'complex' : null;
  state.builder = null;
}

// ---- Working out the shield from the state ---------------------------------
function currentField() {
  const n = state.picked.length;
  if (n === 0) return null;
  if (n === 1) return plain(state.picked[0]);
  if (state.choice === 'complex') return builderField();
  if (state.choice) return divided(state.choice.division, state.choice.order.map(plain));
  return null;
}

function defaultBuilder() {
  const t = state.picked;
  const part = i => ({ kind: 'plain', tincture: t[i % t.length], a: t[0], b: t[1 % t.length] });
  return { division: 'perPale', parts: [part(0), part(1), part(2)] };
}

function builderField() {
  const b = state.builder || (state.builder = defaultBuilder());
  const parts = b.parts.slice(0, DIVISIONS[b.division].parts).map(p =>
    p.kind === 'plain' ? plain(p.tincture) : divided(p.kind, [plain(p.a), plain(p.b)]));
  return divided(b.division, parts);
}

// A charge colour that shows up on this field: a metal on colours, a colour on metals.
function contrastingTincture(field) {
  const used = tincturesIn(field);
  const tones = new Set(used.map(t => TINCTURES[t].tone));
  const wanted = tones.has('dark') ? ['or', 'argent'] : ['sable', 'gules', 'azure', 'vert', 'purpure'];
  return wanted.find(t => !used.includes(t)) || wanted[0];
}

// Build a charge group for a choice ({kind, id, file}) in a given tincture and number.
function groupFor(choice, tincture, number) {
  if (choice.kind === 'ordinary') return ordinaryGroup(choice.id, tincture);
  const charge = library.charges.find(c => c.id === choice.id);
  const picture = choice.file ? library.pictures.find(p => p.file === choice.file) : null;
  return chargeGroupFromLibrary(charge, picture, { tincture, number });
}

function currentGroups(field) {
  if (!state.charge) return [];
  const tincture = state.chargeTincture || contrastingTincture(field);
  const number = state.charge.kind === 'ordinary' ? 1 : state.chargeNumber;
  return [groupFor(state.charge, tincture, number)];
}

function permutations(list) {
  if (list.length <= 1) return [list];
  return list.flatMap((x, i) => permutations([...list.slice(0, i), ...list.slice(i + 1)]).map(p => [x, ...p]));
}

// ---- Drawing the page ------------------------------------------------------
function swatchButton(id, on, attr, small) {
  const t = TINCTURES[id];
  const label = t.kind === 'fur' ? `<span>${esc(t.name)}</span>${small ? '' : `<small>${esc(t.plain)}</small>`}`
                                 : `<span>${esc(t.plain)}</span><small>${esc(t.name)}</small>`;
  return `<button class="swatch${small ? ' small' : ''}" type="button" ${attr}="${id}" aria-pressed="${on}">` +
    `${swatchSVG(id)}${label}${small ? '' : `<span class="tick" aria-hidden="true">${on ? '✓' : ''}</span>`}</button>`;
}

function renderSwatches() {
  const make = id => swatchButton(id, state.picked.includes(id), 'data-tincture', false);
  $('mainSwatches').innerHTML = [...COLOUR_ORDER, ...METAL_ORDER].map(make).join('');
  $('furSwatches').innerHTML = FUR_ORDER.map(make).join('');
}

function divisionCard(division, order) {
  const field = divided(division, order.map(plain));
  const on = state.choice && state.choice !== 'complex' &&
    state.choice.division === division && state.choice.order.join() === order.join();
  return `<button class="card" type="button" data-division="${division}" data-order="${order.join(',')}" aria-pressed="${!!on}">` +
    `${shieldSVG(field, { title: blazon(field) })}<span>${esc(DIVISIONS[division].name)}</span></button>`;
}

function renderDivisionPanel() {
  const panel = $('divisionPanel');
  const n = state.picked.length;
  panel.hidden = n === 0;
  if (n === 0) { panel.innerHTML = ''; return; }

  if (n === 1) {
    const t = TINCTURES[state.picked[0]];
    const word = t.kind === 'fur' ? t.name : cap(t.plain);
    panel.innerHTML = `<h2>${esc(TEXT.plainBackground(word))}</h2>`;
    return;
  }

  let html = `<h2>${esc(TEXT.dividedHeading)}</h2>`;
  const complexCard = `<button class="card complex-card" type="button" data-complex aria-pressed="${state.choice === 'complex'}">${esc(TEXT.complexOption)}</button>`;

  if (n === 2) {
    html += `<button class="plain-btn" type="button" data-swap>⇄ ${esc(TEXT.swap)}</button>`;
    html += `<div class="row">${divisionsWithParts(2).map(d => divisionCard(d, state.order)).join('')}${complexCard}</div>`;
  } else if (n === 3) {
    const cards = divisionsWithParts(3).flatMap(d => permutations(state.picked).map(o => divisionCard(d, o)));
    html += `<div class="row">${cards.join('')}${complexCard}</div>`;
  }
  if (state.choice === 'complex') html += renderBuilder();
  panel.innerHTML = html;
}

function renderBuilder() {
  const b = state.builder || (state.builder = defaultBuilder());
  const tinctureOptions = sel => state.picked.map(id =>
    `<option value="${id}"${id === sel ? ' selected' : ''}>${esc(TINCTURES[id].plain)} (${esc(TINCTURES[id].name)})</option>`).join('');
  const divisionOptions = (ids, sel) => ids.map(id =>
    `<option value="${id}"${id === sel ? ' selected' : ''}>${esc(DIVISIONS[id].name)}</option>`).join('');

  let html = `<div class="builder" style="margin-top:16px">`;
  html += `<label>${esc(TEXT.builderDivision)} <select data-b="division">${divisionOptions(Object.keys(DIVISIONS), b.division)}</select></label>`;
  for (let i = 0; i < DIVISIONS[b.division].parts; i++) {
    const p = b.parts[i];
    const kindOptions =
      state.picked.map(id => `<option value="plain:${id}"${p.kind === 'plain' && p.tincture === id ? ' selected' : ''}>${esc(TINCTURES[id].plain)} (${esc(TINCTURES[id].name)})</option>`).join('') +
      divisionsWithParts(2).map(id => `<option value="${id}"${p.kind === id ? ' selected' : ''}>${esc(DIVISIONS[id].name)}…</option>`).join('');
    html += `<label>${esc(TEXT.builderPart(i + 1))} <select data-b="kind" data-i="${i}">${kindOptions}</select>`;
    if (p.kind !== 'plain') {
      html += `<select data-b="a" data-i="${i}">${tinctureOptions(p.a)}</select> ${esc(TEXT.builderAnd)} ` +
              `<select data-b="b" data-i="${i}">${tinctureOptions(p.b)}</select>`;
    }
    html += `</label>`;
  }
  return html + `</div>`;
}

// One card in the charge picker: the current field with that charge on it.
function chargeCard(field, choice, label, tincture) {
  const on = state.charge && state.charge.kind === choice.kind && state.charge.id === choice.id &&
    (state.charge.file || '') === (choice.file || '');
  const group = groupFor(choice, tincture, 1);
  return `<button class="card" type="button" data-charge="${choice.kind}:${esc(choice.id)}:${esc(choice.file || '')}" aria-pressed="${!!on}">` +
    `${shieldSVG(field, { charges: [group], title: blazon(field, [group]) })}<span>${esc(label)}</span></button>`;
}

function renderChargePanel() {
  const panel = $('chargePanel');
  const field = currentField();
  panel.hidden = !field;
  if (!field) { panel.innerHTML = ''; return; }

  const tincture = state.chargeTincture || contrastingTincture(field);
  const q = state.chargeFilter.trim().toLowerCase();
  const matches = name => !q || name.toLowerCase().includes(q);

  // Charges we can draw: ordinaries, then every picture in the library.
  const cards = [];
  for (const [id, o] of Object.entries(ORDINARIES)) {
    if (matches(o.name)) cards.push(chargeCard(field, { kind: 'ordinary', id }, o.name, tincture));
  }
  const withPicture = new Set();
  for (const p of library.pictures) {
    withPicture.add(p.charge_id);
    const label = [p.charge.name.toLowerCase(), p.posture].filter(Boolean).join(' ');
    if (matches(label)) cards.push(chargeCard(field, { kind: 'charge', id: p.charge_id, file: p.file }, label, tincture));
  }
  // Charges with no picture yet: a list of names (drawn as blobs once chosen).
  const ordinaryNames = new Set(Object.values(ORDINARIES).map(o => o.name));
  const names = library.charges.filter(c =>
    !withPicture.has(c.id) && !ordinaryNames.has(c.name.toLowerCase()) && matches(c.name));
  const shown = names.slice(0, MAX_NAMES_SHOWN);

  const noneOn = !state.charge;
  let html = `<h2>${esc(TEXT.chargeHeading)}</h2>` +
    `<input type="search" id="chargeFilter" value="${esc(state.chargeFilter)}" placeholder="${esc(TEXT.chargeSearch)}" aria-label="${esc(TEXT.chargeSearch)}">` +
    `<div class="row"><button class="card complex-card" type="button" data-charge="none" aria-pressed="${noneOn}">${esc(TEXT.chargeNone)}</button>${cards.join('')}</div>`;
  if (shown.length) {
    html += `<div class="row-label">${esc(TEXT.chargeNoPicture)}</div><div class="row">` +
      shown.map(c => {
        const on = state.charge && state.charge.kind === 'charge' && state.charge.id === c.id && !state.charge.file;
        return `<button class="name-btn" type="button" data-charge="charge:${esc(c.id)}:" aria-pressed="${!!on}">${esc(c.name.toLowerCase())}</button>`;
      }).join('') + `</div>`;
    if (names.length > shown.length) html += `<p class="note">${esc(TEXT.chargeMore(names.length - shown.length))}</p>`;
  }
  if (!cards.length && !shown.length) html += `<p class="note">${esc(TEXT.chargeNoMatch)}</p>`;

  if (state.charge) {
    if (state.charge.kind === 'charge') {
      html += `<div class="row-label">${esc(TEXT.chargeNumber)}</div><div class="row">` +
        [1, 2, 3].map(n => `<button class="name-btn" type="button" data-number="${n}" aria-pressed="${state.chargeNumber === n}">${n}</button>`).join('') + `</div>`;
    }
    html += `<div class="row-label">${esc(TEXT.chargeColour)}</div><div class="row">` +
      [...COLOUR_ORDER, ...METAL_ORDER, ...FUR_ORDER].map(id => swatchButton(id, id === tincture, 'data-charge-tincture', true)).join('') + `</div>`;
  }
  panel.innerHTML = html;
}

function renderCurrent() {
  const panel = $('currentPanel');
  const field = currentField();
  if (!field) { panel.innerHTML = `<p class="note" style="margin:0">${esc(TEXT.currentEmpty)}</p>`; return; }
  const groups = currentGroups(field);
  const text = blazon(field, groups);
  const patterns = shieldPatterns(field, groups);
  const noTinctures = field.type === 'divided' && DIVISIONS[field.division].tincturesIndexed === false;
  panel.innerHTML =
    shieldSVG(field, { charges: groups, title: text }) +
    `<p class="blazon">${esc(text)}</p>` +
    `<a class="search-link" href="${esc(complexSearchURL(patterns))}" target="_blank" rel="noopener">${esc(TEXT.searchLink)} →</a>` +
    (noTinctures ? `<p class="note">${esc(TEXT.tincturesNotIndexed)}</p>` : '') +
    `<details><summary>${esc(TEXT.patternsSummary)}</summary><code>${esc(patterns.join('\n'))}</code></details>`;
}

function render() {
  renderSwatches();
  renderDivisionPanel();
  renderChargePanel();
  renderCurrent();
}

// ---- Reacting to clicks and typing ------------------------------------------
document.addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  const d = btn.dataset;
  let refocus = null;
  if (d.tincture) {
    state.picked = state.picked.includes(d.tincture) ? state.picked.filter(x => x !== d.tincture) : [...state.picked, d.tincture];
    resetChoice();
    refocus = `[data-tincture="${d.tincture}"]`;
  } else if (d.division) {
    state.choice = { division: d.division, order: d.order.split(',') };
    refocus = `[data-division="${d.division}"][data-order="${d.order}"]`;
  } else if ('complex' in d) {
    state.choice = 'complex';
    refocus = '[data-complex]';
  } else if ('swap' in d) {
    state.order.reverse();
    if (state.choice && state.choice !== 'complex') state.choice.order = [...state.order];
    refocus = '[data-swap]';
  } else if (d.charge) {
    if (d.charge === 'none') state.charge = null;
    else {
      const [kind, id, file] = d.charge.split(':');
      state.charge = { kind, id, file: file || null };
    }
    refocus = `[data-charge="${d.charge}"]`;
  } else if (d.number) {
    state.chargeNumber = Number(d.number);
    refocus = `[data-number="${d.number}"]`;
  } else if (d.chargeTincture) {
    state.chargeTincture = d.chargeTincture;
    refocus = `[data-charge-tincture="${d.chargeTincture}"]`;
  } else return;
  render();
  // preventScroll: keep the page where it is instead of jumping to the button.
  if (refocus) document.querySelector(refocus)?.focus({ preventScroll: true });
});

document.addEventListener('change', e => {
  const sel = e.target.closest('select[data-b]');
  if (!sel) return;
  const b = state.builder, i = Number(sel.dataset.i);
  if (sel.dataset.b === 'division') b.division = sel.value;
  else if (sel.dataset.b === 'kind') {
    if (sel.value.startsWith('plain:')) { b.parts[i].kind = 'plain'; b.parts[i].tincture = sel.value.slice(6); }
    else b.parts[i].kind = sel.value;
  } else b.parts[i][sel.dataset.b] = sel.value;
  const key = `select[data-b="${sel.dataset.b}"]` + (sel.dataset.i ? `[data-i="${sel.dataset.i}"]` : '');
  render();
  document.querySelector(key)?.focus({ preventScroll: true });
});

// Typing in the charge search box: redraw the list, keep the cursor in place.
document.addEventListener('input', e => {
  if (e.target.id !== 'chargeFilter') return;
  state.chargeFilter = e.target.value;
  const at = e.target.selectionStart;
  renderChargePanel();
  const box = $('chargeFilter');
  box.focus({ preventScroll: true });
  box.setSelectionRange(at, at);
});

$('title').textContent = TEXT.title;
$('coloursHeading').textContent = TEXT.coloursHeading;
$('fursLabel').textContent = TEXT.fursLabel;
render();

// The charge library loads in the background; the page works before it arrives
// (ordinaries need no pictures) and fills in the rest when it does.
loadLibrary().then(loaded => { library = loaded; render(); }).catch(err => console.error(err));
</script>
</body>
</html>
