<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What are you searching for?</title>
<style>
  :root { --ink: #2b2620; --paper: #faf6ee; --line: #d8cfba; --accent: #5b4b8a; --muted: #6b6252; --warn: #8a3b2a; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font-family: Georgia, 'Iowan Old Style', serif; background: var(--paper); color: var(--ink); }

  /* Three areas: questions (top left, scrolls), the shield being built (top
     right), and a row of suggestions along the bottom. */
  .app { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; height: 100vh; max-width: 1400px; margin: 0 auto; padding: 12px 16px; }
  .app > * { min-width: 0; }   /* lets the suggestion row scroll sideways instead of widening the page */
  .top { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; min-height: 0; }
  .questions, .current { overflow-y: auto; min-height: 0; }
  .questions { padding-right: 6px; }
  /* On a narrow or short screen everything simply stacks and the page scrolls. */
  @media (max-width: 760px), (max-height: 640px) {
    html, body { height: auto; }
    .app { display: block; height: auto; }
    .top { display: block; }
    .questions, .current { overflow: visible; }
    .current, .suggestions { margin-bottom: 16px; }
  }

  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 20px; }
  h1 { font-size: 1.45rem; margin: 0; }
  h2 { font-size: 1.05rem; margin: 0 0 12px; }
  .herald { font-size: 0.85rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }

  .panel { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
  .current.panel, .suggestions.panel { margin-bottom: 0; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .row-label { font-size: 0.8rem; color: var(--muted); margin: 12px 0 6px; }
  .sets { display: flex; flex-wrap: wrap; gap: 10px 26px; }
  .set { border-left: 3px solid var(--line); padding-left: 12px; }
  .set .row-label { margin-top: 0; }

  button { font-family: inherit; color: var(--ink); cursor: pointer; }
  .swatch, .card {
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    background: #fff; border: 2px solid var(--line); border-radius: 8px; padding: 8px 6px; font-size: 0.82rem;
  }
  /* The slim colour menu (question 1): small squares with their names beside them. */
  .slim-sets { display: flex; flex-wrap: wrap; gap: 8px 16px; }
  .slim-label { font-size: 0.72rem; font-weight: bold; margin: 0 0 3px 6px; }
  .slim-row { display: flex; flex-wrap: wrap; gap: 2px 4px; border: 1.5px solid var(--muted); border-radius: 16px; padding: 3px 8px; }
  .slim { display: flex; align-items: center; gap: 6px; background: none; border: 2px solid transparent; border-radius: 8px; padding: 3px 6px; font-size: 0.82rem; text-align: center; }
  .slim svg { width: 28px; height: 28px; flex: none; }
  .slim span { display: flex; flex-direction: column; line-height: 1.15; }
  .slim small { font-size: 0.68rem; color: var(--muted); font-weight: normal; }
  .slim[aria-pressed="true"] { border-color: var(--accent); background: #f3f0fa; }
  .swatch { width: 88px; }
  .swatch svg { width: 42px; height: 42px; }
  .swatch.small { width: 66px; padding: 6px 4px; font-size: 0.72rem; }
  .swatch.small svg { width: 30px; height: 30px; }
  .swatch small, .card small { color: var(--muted); font-size: 0.72rem; text-align: center; }
  .swatch .tick { height: 1em; font-size: 0.9rem; line-height: 1; color: var(--accent); }
  .card { width: 108px; }
  .card svg { width: 72px; height: auto; }
  [aria-pressed="true"] { border-color: var(--accent); background: #f3f0fa; font-weight: bold; }
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .plain-btn { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 5px 11px; font-size: 0.82rem; }
  .text-card { justify-content: center; min-height: 118px; font-style: italic; }
  .name-btn { background: #fff; border: 2px solid var(--line); border-radius: 16px; padding: 4px 11px; font-size: 0.82rem; }

  /* An option the rules do not allow: shown, but greyed, with the reason. */
  .waiting svg { opacity: 0.35; }
  .greyed svg { opacity: 0.3; filter: grayscale(0.7); }
  .greyed { color: var(--muted); }
  .greyed[aria-disabled="true"] { cursor: not-allowed; }
  .why { color: var(--warn); font-size: 0.68rem; font-style: normal; font-weight: normal; text-align: center; line-height: 1.2; }

  /* One block per charge chosen: its name, how many, what colour. */
  .slot { border-left: 3px solid var(--accent); padding: 2px 0 2px 12px; margin: 0 0 14px; }
  .slot-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; font-size: 0.95rem; }
  .slot .row-label:first-child { margin-top: 0; }
  .roles { display: grid; gap: 8px; margin-top: 14px; }
  .roles label { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 0.9rem; }

  .builder { display: grid; gap: 10px; margin-top: 14px; }
  .builder label { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 0.9rem; }
  select, input[type="search"] { font-family: inherit; font-size: 0.9rem; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); max-width: 100%; }
  input[type="search"] { width: 100%; margin: 12px 0; }

  .current svg { display: block; width: 100%; max-width: 250px; height: auto; margin: 0 auto 12px; }
  .blazon { font-size: 1.05rem; font-style: italic; margin: 0 0 12px; text-align: center; overflow-wrap: anywhere; }
  .search-link { display: block; text-align: center; background: var(--accent); color: #fff; text-decoration: none; padding: 10px 14px; border-radius: 6px; font-size: 0.95rem; }
  .search-link:hover { background: #453a6b; }
  .note { font-size: 0.82rem; color: var(--muted); margin: 10px 0 0; }
  .palette-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-top: 14px; font-size: 0.95rem; }
  .chips { display: inline-flex; align-items: center; gap: 3px; }
  .chip { display: inline-block; width: 16px; height: 16px; border: 1px solid #3a3226; border-radius: 2px; }
  .chip-gap { display: inline-block; width: 1px; height: 18px; background: #3a3226; margin: 0 4px; }
  .palette-source { font-size: 0.82rem; color: var(--accent); }
  .link-btn { background: none; border: none; padding: 2px 0; color: var(--accent); text-decoration: underline; cursor: pointer; font: inherit; font-size: 0.92rem; text-align: left; }
  .palette-list { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; }
  .palette-option { display: inline-flex; align-items: center; gap: 8px; }
  .collapse-btn { margin-left: 10px; background: none; border: 1px solid var(--line); border-radius: 5px; padding: 1px 8px; font: inherit; font-size: 0.75rem; font-weight: normal; color: var(--muted); cursor: pointer; vertical-align: middle; }
  .panel.collapsed > :not(h2):not(.suggestions-head) { display: none; }
  .panel.collapsed .suggestions-head > :not(h2) { display: none; }
  .help { font-size: 0.88rem; color: var(--muted); margin: -4px 0 12px; }
  .problems { margin: 0 0 12px; padding: 8px 10px 8px 26px; border: 1px solid #e3c4b8; background: #fbf1ec; border-radius: 6px; color: var(--warn); font-size: 0.82rem; }
  details { margin-top: 12px; font-size: 0.8rem; color: var(--muted); }
  code { display: block; white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 6px; color: var(--ink); }

  .suggestions { padding-bottom: 8px; }
  .suggestions-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 8px; }
  .suggestions-head h2 { margin: 0; }
  .suggestion-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; }
  .suggestion-row.waiting { opacity: 0.4; pointer-events: none; }
  .suggestion { flex: none; width: 132px; display: flex; flex-direction: column; align-items: center; gap: 4px; border: 2px solid var(--line); border-radius: 8px; padding: 6px; background: #fff; }
  .suggestion.pinned { border-color: var(--accent); background: #f3f0fa; }
  .suggestion svg { width: 70px; height: auto; }
  /* (The whole blazon shows, however long: its last words are the colours.) */
  .suggestion p { margin: 0; font-size: 0.66rem; font-style: italic; text-align: center; line-height: 1.2; min-height: 3.6em; }
  .suggestion button { width: 100%; background: #fff; border: 1px solid var(--line); border-radius: 5px; padding: 3px 4px; font-size: 0.68rem; }
  .suggestion p + button { margin-top: auto; }
</style>
</head>
<body>
<main class="app">
  <header>
    <h1 id="title"></h1>
    <label class="herald"><input type="checkbox" id="herald"> <span id="heraldLabel"></span></label>
  </header>
  <div class="top">
    <div class="questions">
      <section class="panel" id="shieldColoursPanel"></section>
      <section class="panel" id="fieldColoursPanel"></section>
      <section class="panel" id="divisionPanel"></section>
      <section class="panel" id="chargePanel"></section>
      <section class="panel" id="arrangePanel"></section>
    </div>
    <aside class="panel current" id="currentPanel" aria-live="polite"></aside>
  </div>
  <section class="panel suggestions" id="suggestionsPanel"></section>
</main>

<script type="module">
import { TINCTURES, DIVISIONS, ORDINARIES, COLOUR_ORDER, METAL_ORDER, FUR_ORDER, familyOf,
         ARRANGEMENTS, USUAL_ARRANGEMENT, SEMY, arrangementsFor } from '../../core/catalog.js';
import { plain, divided, isComplete, isNested, leafTinctures, shieldTinctures, blazon, ordinaryGroup,
         chargeGroupFromLibrary, COUNTERCHANGED } from '../../core/shield.js';
import { shieldSVG, swatchSVG, counterchangedSwatchSVG } from '../../core/draw.js';
import { shieldPatterns, complexSearchURL } from '../../core/oanda.js';
import { loadLibrary } from '../../core/art.js';
import { PALETTES, DEFAULT_PALETTE, usePalette, paletteById } from '../../core/palettes.js';
import { checkShield, checkArrangement, paletteLacks } from '../../core/rules.js';
import { randomShield, randomShields, whyNot, whichWork, randomFrom, shuffled } from '../../core/generate.js';
import { arrangements, arrange, unarrange, sameArrangement } from '../../core/arrange.js';

// ---------------------------------------------------------------------------
// ALL THE WORDS ON THE PAGE live here, so they can be rewritten in one place.
// Lines marked DRAFT were placeholders written while building: please rewrite.
// ---------------------------------------------------------------------------
const TEXT = {
  title: 'What are you searching for?',
  herald: "I'm a herald and I know what I'm doing. Enter options manually",
  shieldColours: 'What colours are used in the shield?',
  // The colour scheme chooser under question 1 (palette names are in core/palettes.js).
  paletteLabel: 'palette:',
  morePalettes: 'see more palettes',
  fewerPalettes: 'hide other palettes',                                   // DRAFT
  paletteSource: 'source',
  dontSpecify: "don't specify",
  collapse: 'collapse',
  expand: 'expand',
  shieldColoursHelp: 'Pick all the colours you want to be considered in suggestions, to narrow down the options in the future questions',
  coloursLabel: 'colours',      // (these three as in the maintainer's sketch of the colour menu)
  metalsLabel: 'metals',
  fursLabel: 'furs',
  fieldColours: 'What colours are used in the background?',
  fieldColoursHelp: "If you're not sure what counts as background (field) in heraldry, use the question above to select colours and scroll down for more questions",
  dividedHeading: 'How is the background divided?',
  plainBackground: colour => `Plain ${colour} Background`,
  plainBackgroundAny: 'Plain Background',                               // DRAFT
  complexOption: 'more complex background',
  swap: 'Swap the two colours',                                         // DRAFT
  builderDivision: 'The background is divided',                         // DRAFT
  builderPart: n => `Part ${n} is`,                                     // DRAFT
  builderAnd: 'and',                                                    // DRAFT
  chargeHeading: 'What charges are on the field?',
  chargeHelp: 'Pick up to three. Pick one again to take it off.',       // DRAFT
  chargeFull: 'Three charges are chosen already',                       // DRAFT
  chargeRemove: 'remove',                                               // DRAFT
  chargeNumber: 'How many?',                                            // DRAFT
  chargeColour: 'What colour is it?',                                   // DRAFT
  semy: 'semy',
  // "How are they arranged?": shown once two or more charges are chosen.
  arrangeHeading: 'How are they arranged?',                             // DRAFT
  arrangeNothing: 'One charge on its own sits in the middle of the shield. Choose two or more of it, or another charge, to see the ways they can be arranged.', // DRAFT
  arrangeSemy: 'Semy charges are spread evenly over the whole background, so there is nothing to arrange.', // DRAFT
  arrangeTogether: 'How the different charges go together',             // DRAFT
  arrangedUsual: 'the usual way',                                       // DRAFT
  arrangeNone: 'The tools cannot yet put these together on one shield.', // DRAFT
  // The words under each arrangement picture: (a, b) are the two charges' names.
  arrAround: (a, b) => `${a} around the ${b}`,                          // DRAFT
  arrOn: (a, b) => `${a} on the ${b}`,                                  // DRAFT
  arrChief: (a, b) => `${a} above the ${b}`,                            // DRAFT
  arrBase: (a, b) => `${a} below the ${b}`,                             // DRAFT
  arrWith: (a, b) => `${a} with a ${b}`,                                // DRAFT
  // "I'm a herald": saying directly what each charge is.
  rolesLabel: name => `The ${name} is`,                                 // DRAFT
  roleUnset: 'not chosen',                                              // DRAFT
  rolePrimary: 'the primary charge',                                    // DRAFT
  roleAround: 'secondary, around the primary charge',                   // DRAFT
  roleChief: 'secondary, in chief',                                     // DRAFT
  roleBase: 'secondary, in base',                                       // DRAFT
  roleOn: name => `tertiary, on the ${name}`,                           // DRAFT
  roleEdge: 'a peripheral ordinary',                                    // DRAFT
  counterchanged: 'counterchanged',
  chargeSearch: 'Type to find a charge',                                // DRAFT
  chargeNone: 'no charge',                                              // DRAFT
  chargeOrdinaries: 'Ordinaries',                                       // DRAFT
  chargePictures: 'Charges',                                            // DRAFT
  chargeNoPicture: 'Charges we have no picture of yet (shown as a blob)', // DRAFT
  chargeMore: n => `…and ${n} more. Type to narrow the list.`,          // DRAFT
  chargeNoMatch: 'No charge matches that.',                             // DRAFT
  suggestions: 'Suggestions',                                           // DRAFT
  reroll: 'Show different suggestions',                                 // DRAFT
  pin: 'pin suggestion',
  unpin: 'unpin',                                                       // DRAFT
  select: 'select this shield',
  // When few suggestions can be made, the most likely reason:
  fewMoreColours: 'Few shields are possible - please pick some more colours',
  fewNeedMetal: 'Few shields are possible - please pick a metal',       // DRAFT
  fewNeedColour: 'Few shields are possible - please pick a colour',     // DRAFT
  fewSuggestions: 'Few shields are possible with these choices.',       // DRAFT
  noSuggestions: 'No shield is possible with these choices.',           // DRAFT
  searchLink: 'Search the Ordinary & Armorial for this',               // DRAFT
  tincturesNotIndexed: 'The Ordinary & Armorial does not record which colours a three-part background uses, so this search finds every background divided this way.', // DRAFT
  patternsSummary: 'What gets filled in on the Complex Search Form',   // DRAFT
  // Words used in the blazon for things not chosen yet.                 // DRAFT (all four)
  placeholders: { tincture: '(any colour)', field: '(any background)', number: '(any number of)', arrangement: '(arranged any way)' },

  // Why an option is greyed out, or what is wrong with the current shield.
  lowContrastMetal: 'Low contrast - please choose a metal',
  lowContrastColour: 'Low contrast - please choose a colour',           // DRAFT
  rules: {                                                              // DRAFT (all of these)
    'same-base': 'Two parts next to each other are too alike to tell apart',
    'four-part-nested': 'A quarter can only be divided into a pattern like checky',
    'charge-shares-tincture': 'The charge is the same colour as the background behind it',
    'counterchange-field': 'Counterchanged needs a background divided into two colours',
    'counterchange-many': 'Counterchanging over this many pieces needs period evidence',
    'parallel-peripheral': 'A chief or base cannot go with a per fess background',
    'single-tincture': 'One plain colour with nothing on it cannot be registered',
    'complexity': 'Too many colours and charges',
    'house-too-deep': 'Too complex: a part of a part cannot be divided again',
    'house-same-division': 'A part cannot be divided the same way as the whole',
    'same-charge-twice': 'The same charge cannot be in two different groups on the field',
    'ordinary-is-primary': 'With an ordinary across the middle, the ordinary is the primary charge',
    'too-many-groups': 'Three or more groups of charges on the field need period evidence, apart from a few patterns',
    'quaternary': 'A charge cannot go on a charge that is itself on another charge',
    'arrangement-unsupported': 'The tools cannot draw this arrangement yet',
    'no-room': 'There is not enough room to draw this clearly',
    'arrangement-unity': 'With another charge above or below, charges in a line may be taken for one group with two arrangements',
    'not-possible': 'Not possible with the colours chosen',
  },
};

const SUGGESTION_COUNT = 12;   // how many suggestions along the bottom
const MAX_CARDS = 18;          // most option pictures in one group (3 rows of 6)
const MAX_NAMES_SHOWN = 40;
const ALL_TINCTURES = [...COLOUR_ORDER, ...METAL_ORDER, ...FUR_ORDER];
const TWO_TINCTURE = Object.keys(DIVISIONS).filter(d => DIVISIONS[d].parts === 2);
const THREE_TINCTURE = Object.keys(DIVISIONS).filter(d => DIVISIONS[d].parts === 3);
// A fresh starting point for the random pictures each time the page is opened.
const SEED = String(Math.floor(Math.random() * 1e9));

const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const $ = id => document.getElementById(id);
const toggle = (list, x) => (list.includes(x) ? list.filter(y => y !== x) : [...list, x]);
const words = TEXT.placeholders;
// The charge colour "don't specify": search without a colour, and assume none.
const UNSPECIFIED = 'unspecified';
const tinctureOf = item => (item.tincture === UNSPECIFIED ? null : item.tincture);
const MAX_ITEMS = 3;           // how many different charges can be chosen
const NUMBERS = [1, 2, 3, 4, 5, 6, SEMY];  // the "How many?" buttons

// ---- What the user has chosen ------------------------------------------------
// Anything left empty is "not chosen yet": the shield on the right shows it in
// grey, and the suggestions fill it in at random.
const state = {
  herald: false,
  shieldColours: [],     // question 1: tinctures that may be used anywhere
  fieldColours: [],      // question 2: the background's tinctures, in order
  division: null,        // null | 'plain' | a division id | 'complex'
  builder: null,         // the "more complex background" form
  // What is on the field: one entry per charge chosen (up to MAX_ITEMS).
  // The first entry is always there, so "how many" and "what colour" can be
  // answered before a charge is picked.
  //   choice:   null | { kind: 'ordinary', id } | { kind: 'charge', id, file }
  //   number:   null | 1, 2, 3...
  //   tincture: null | a tincture id | COUNTERCHANGED | UNSPECIFIED
  //   arranged: how its own charges are set out: undefined or null (not
  //             chosen) | 'usual' | an id from ARRANGEMENTS in core/catalog.js
  items: [{ choice: null, number: null, tincture: null }],
  noCharge: false,       // "no charge" chosen
  arrangement: null,     // how the chosen charges go together (core/arrange.js), or null
  arrangementUnspecified: false,   // "don't specify" ticked for the arrangement
  chargeFilter: '',
  pinned: [],            // suggestions the user has pinned
  epoch: 0,
  palette: DEFAULT_PALETTE, // the colour scheme shields are drawn in
  showPalettes: false,
  fieldUnspecified: false,  // "don't specify" ticked for the background's colours
  collapsed: new Set(),     // ids of question sections the user has collapsed      // is the list of other palettes open?              // goes up when the user asks for different suggestions
};
let library = { charges: [], pictures: [] };   // filled in once charges/ has loaded
let shown = [];                                // the suggestions on screen, by position
let shownArrangements = [];                    // the arrangement pictures on screen, by position

// Question 1 says which tinctures may be used. With two or more ticked, only
// those are used. With just one ticked it must appear, but others may too
// (otherwise the only possible shield would be one plain colour).
const palette = () => (state.shieldColours.length >= 2 ? state.shieldColours : null);
const mustInclude = () => (state.shieldColours.length === 1 ? state.shieldColours[0] : null);
const offered = () => palette() || ALL_TINCTURES;

// Keep the answers consistent with each other after any change.
function tidy() {
  // A colour used for the background or the charge is used in the shield
  // (once any shield colour is ticked: then they are all in the palette).
  if (state.shieldColours.length >= 1) {
    for (const t of [...state.fieldColours, ...state.items.map(tinctureOf)]) {
      if (t && t !== COUNTERCHANGED && !state.shieldColours.includes(t)) state.shieldColours.push(t);
    }
  }
  // How a charge's own charges are set out only lasts while it suits how many there are.
  // (It may be chosen before how many: then any number that suits it is offered.)
  for (const item of state.items) {
    const fits = item.number === null || (item.arranged === 'usual' ? !!USUAL_ARRANGEMENT[item.number] : arrangementsFor(item.number).includes(item.arranged));
    if (item.arranged && !fits) item.arranged = null;
  }
  // An arrangement only lasts while it suits the charges chosen.
  if (state.arrangement) {
    const groups = chosen().map(x => x.group);
    if (!arrangements(groups).some(a => sameArrangement(a, state.arrangement)) && !state.herald) state.arrangement = null;
    else if (state.arrangement.length !== groups.length) state.arrangement = null;
  }
  // With a "more complex background", the background's colours are whatever
  // the form uses.
  if (state.division === 'complex') state.fieldColours = [...new Set(leafTinctures(builderField()))];
  // A division that cannot hold this many background colours is dropped.
  const d = state.division, k = state.fieldColours.length;
  if (d === 'plain' && k > 1) state.division = null;
  else if (d && d !== 'plain' && d !== 'complex' && k > DIVISIONS[d].parts) state.division = null;
}

// ---- The shield described so far (parts not chosen are null) -----------------
function currentField() {
  const fc = state.fieldColours, d = state.division;
  if (d === 'complex') return builderField();
  if (d === 'plain') return plain(fc[0] ?? null);
  if (d) return divided(d, Array.from({ length: DIVISIONS[d].parts }, (_, i) => plain(fc[i] ?? null)));
  if (fc.length === 1) return plain(fc[0]);     // one background colour and no division: plain
  return null;
}

function groupFor(choice, tincture, number, arranged = null) {
  if (choice.kind === 'ordinary') return ordinaryGroup(choice.id, tincture);
  const charge = library.charges.find(c => c.id === choice.id);
  if (!charge) return null;
  const picture = choice.file ? library.pictures.find(p => p.file === choice.file) : null;
  return chargeGroupFromLibrary(charge, picture || null, { tincture, number, arranged: arranged === 'usual' ? null : arranged || null });
}

// The charges chosen so far that can be drawn (a charge from the library has
// to wait for the library to load): [{ item, group }], in the order chosen.
function chosen() {
  return state.items.filter(item => item.choice)
    .map(item => ({ item, group: groupFor(item.choice, tinctureOf(item), item.number, item.arranged) }))
    .filter(x => x.group);
}

// The arrangement chosen, if it still fits the charges.
const chosenArrangement = count => (state.arrangement && state.arrangement.length === count ? state.arrangement : null);
// Charge groups put together: as arranged, or (nothing chosen) side by side
// for the core to guess at (shield.js: roles).
const together = (groups, arrangement) => (arrangement ? arrange(groups, arrangement) : groups);

function currentShield() {
  const groups = chosen().map(x => x.group);
  return { field: currentField(), groups: together(groups, chosenArrangement(groups.length)), noCharge: state.noCharge };
}

// The shield shown top right: as chosen, but where what has been chosen
// leaves only ONE legal possibility for something not yet chosen (a part of
// the background, a charge's colour, how the charges are arranged), that one
// is assumed. The user can still choose otherwise, or tick "don't specify"
// to keep it open.
function shownShield() {
  const p = palette();
  let field = currentField();
  if (p && field && !state.fieldUnspecified && !isComplete(field)) field = onlyWay(field, p) || field;
  const picked = chosen();
  let groups = picked.map(x => x.group);
  let arrangement = chosenArrangement(groups.length);
  const legal = (gs, a) => !checkShield({ field, groups: together(gs, a) }).length;
  if (!arrangement && groups.length >= 2 && !state.arrangementUnspecified) {
    const ways = arrangements(groups).filter(a => legal(groups, a));
    if (ways.length === 1) arrangement = ways[0];
  }
  if (p && field && isComplete(field)) {
    picked.forEach(({ item }, i) => {
      if (item.tincture !== null) return;            // chosen, or "don't specify"
      const withTincture = t => groups.map((g, k) => (k === i ? { ...g, tincture: t } : g));
      const ok = [...p, COUNTERCHANGED].filter(t => legal(withTincture(t), arrangement));
      if (ok.length === 1) groups = withTincture(ok[0]);
    });
  }
  return { field, groups: together(groups, arrangement), noCharge: state.noCharge };
}

// The one way to fill a field's unchosen colours from `palette` that the
// rules allow, or null if there are none or several.
function onlyWay(field, palette) {
  let slots = 0;
  const count = f => { if (f.type === 'plain') slots += f.tincture === null ? 1 : 0; else f.parts.forEach(count); };
  count(field);
  if (!slots || slots > 3) return null;
  const fill = (f, values) => f.type === 'plain'
    ? (f.tincture === null ? plain(values.shift()) : f)
    : { ...f, parts: f.parts.map(part => fill(part, values)) };
  let found = null;
  const tryAll = (chosen) => {
    if (chosen.length === slots) {
      const f = fill(field, [...chosen]);
      if (!checkShield({ field: f }).length) { if (found) throw 'several'; found = f; }
      return;
    }
    for (const t of palette) tryAll([...chosen, t]);
  };
  try { tryAll([]); } catch (e) { return null; }
  return found;
}

// The charges chosen, in the form generate.js wants: 'none', null (nothing
// chosen about them) or a list. `change` (optional) alters one entry: used to
// ask "what if this charge were this colour?".
function wantedItems(change = null) {
  if (state.noCharge && !change) return 'none';
  const { list, at } = itemList(change ? change.slot : -1);
  if (change) Object.assign(list[at[change.slot]], change.set);
  return list.length ? list : null;
}

// The entries of state.items that say something, as a list for generate.js,
// and where each ended up in it (`at`). Left out: a charge whose library has
// not loaded yet, and a first entry with nothing chosen. `keep` names an
// entry to include whatever it holds.
function itemList(keep = -1) {
  const live = item => !!item.choice && (item.choice.kind === 'ordinary' || library.charges.some(c => c.id === item.choice.id));
  const list = [], at = [];
  state.items.forEach((item, i) => {
    if (!(live(item) || i === keep || (!item.choice && (item.number || tinctureOf(item) || item.arranged)))) return;
    at[i] = list.length;
    list.push({ charge: live(item) ? item.choice : null, number: item.number, tincture: tinctureOf(item), arranged: item.arranged || null });
  });
  return { list, at };
}

// What is fixed, in the form generate.js wants.
function constraints() {
  const field = currentField();
  const items = wantedItems();
  return {
    palette: palette(),
    mustInclude: mustInclude(),
    fieldTinctures: state.fieldColours.length ? state.fieldColours : null,
    division: state.division === 'complex' ? null : state.division,
    field: isComplete(field) ? field : undefined,
    items,
    arrangement: Array.isArray(items) ? chosenArrangement(items.filter(x => x.charge).length) : null,
  };
}

// ---- Random options that stay put --------------------------------------------
// Every random picture is worked out from the page's seed plus exactly what it
// depends on, and remembered, so pictures only change when a relevant choice does.
const remembered = new Map();
function remember(key, make) {
  if (remembered.size > 4000) remembered.clear();
  if (!remembered.has(key)) remembered.set(key, make());
  return remembered.get(key);
}

// An option to show: a random legal shield fitting `c`, or, if there is none,
// an illegal example with the reason. Returns { shield, problems } or null.
const optionKey = (tag, c) => `${SEED}|${tag}|${library.pictures.length}|${JSON.stringify(c)}`;
function option(tag, c) {
  const key = optionKey(tag, c);
  return remember(key, () => {
    const shield = randomShield(c, key, library);
    return shield ? { shield, problems: [] } : whyNot(c, key, library);
  });
}

// ---- Pictures that take a moment -----------------------------------------------
// Working out an option's picture can take a while the first time (several
// charges have to be fitted around each other). So that a click is answered
// at once, a picture not worked out before is first shown as an empty shield
// and filled in a moment later, one at a time, without holding the page up.
let later = [];          // [{ panel, run }] what is still to be worked out, for the page as it stands
let laterTimer = null;
let waitingCards = 0;    // gives each empty card a name of its own
function fillLater() {
  clearTimeout(laterTimer);
  const step = () => {
    const start = performance.now();
    while (later.length && performance.now() - start < 30) later.shift().run();
    if (later.length) laterTimer = setTimeout(step, 0);
  };
  if (later.length) laterTimer = setTimeout(step, 0);
}
// Forget what was waiting for one panel (it is about to be drawn afresh).
const forgetLater = panel => { later = later.filter(x => x.panel !== panel); };

// An option card that may be filled in later. `args(found)` gives what card()
// needs; `found` is what option() returns, or undefined while waiting.
function lazyCard(panel, tag, c, args) {
  const key = optionKey(tag, c);
  if (remembered.has(key)) return card(args(remembered.get(key)));
  const id = `w${waitingCards++}`;
  later.push({ panel, run: () => {
    const waiting = document.querySelector(`[data-waiting="${id}"]`);
    if (!waiting) return;
    const holder = document.createElement('div');
    holder.innerHTML = card(args(option(tag, c)));
    const fresh = holder.firstElementChild, focused = document.activeElement === waiting;
    waiting.replaceWith(fresh);
    if (focused) fresh.focus({ preventScroll: true });
  } });
  return card({ ...args(undefined), waiting: id });
}

// ---- Explaining the rules -----------------------------------------------------
function ruleText(problem) {
  if (!problem) return TEXT.rules['not-possible'];
  if (problem.hint) return problem.hint === 'metal' ? TEXT.lowContrastMetal : TEXT.lowContrastColour;
  return TEXT.rules[problem.id] || problem.id;
}
// In herald mode nothing is blocked; the reason is still shown.
const blocked = problems => problems.length > 0 && !state.herald;

// ---- Drawing the page ---------------------------------------------------------
function swatchButton(id, { on, attr, small = false, why = '' }) {
  const counter = id === COUNTERCHANGED;
  const t = counter ? null : TINCTURES[id];
  const label = counter ? `<span>${esc(TEXT.counterchanged)}</span>`
    : t.kind === 'fur' ? `<span>${esc(t.name)}</span>${small ? '' : `<small>${esc(t.plain)}</small>`}`
    : `<span>${esc(t.plain)}</span><small>${esc(t.name)}</small>`;
  const greyed = why ? ` greyed" aria-disabled="${!state.herald}` : '';
  return `<button class="swatch${small ? ' small' : ''}${greyed}" type="button" ${attr}="${id}" aria-pressed="${on}">` +
    `${counter ? counterchangedSwatchSVG() : swatchSVG(id)}${label}` +
    (why ? `<span class="why">${esc(why)}</span>` : small ? '' : `<span class="tick" aria-hidden="true">${on ? '✓' : ''}</span>`) +
    `</button>`;
}

// Colours and metals as two visibly separate sets, then furs.
function swatchSets(ids, make) {
  const set = (label, order) => {
    const list = order.filter(id => ids.includes(id));
    return list.length ? `<div class="set"><div class="row-label">${esc(label)}</div><div class="row">${list.map(make).join('')}</div></div>` : '';
  };
  return `<div class="sets">${set(TEXT.coloursLabel, COLOUR_ORDER)}${set(TEXT.metalsLabel, METAL_ORDER)}${set(TEXT.fursLabel, FUR_ORDER)}</div>`;
}

// "palette: <name>" with little colour chips, and a list of the others.
const CHIP_METALS = ['argent', 'or'];
const CHIP_COLOURS = ['gules', 'vert', 'azure', 'purpure', 'sable'];
function paletteChips(p) {
  const chip = t => `<span class="chip" style="background:${p.colours[t]}"></span>`;
  return `<span class="chips">${CHIP_METALS.map(chip).join('')}<span class="chip-gap"></span>${CHIP_COLOURS.map(chip).join('')}</span>`;
}
function paletteChooser() {
  const current = paletteById(state.palette);
  let html = `<div class="palette-row"><span>${esc(TEXT.paletteLabel)} <strong>${esc(current.name)}</strong></span>${paletteChips(current)}` +
    `<a class="palette-source" href="${esc(current.source)}" target="_blank" rel="noopener">${esc(TEXT.paletteSource)}</a></div>` +
    `<button class="link-btn" type="button" data-palettes aria-expanded="${state.showPalettes}">${esc(state.showPalettes ? TEXT.fewerPalettes : TEXT.morePalettes)}</button>`;
  if (state.showPalettes) {
    html += `<div class="palette-list">` + PALETTES.filter(p => p.id !== current.id).map(p =>
      `<button class="link-btn palette-option" type="button" data-palette="${p.id}">${esc(p.name)} ${paletteChips(p)}</button>`).join('') + `</div>`;
  }
  return html;
}

// The slim colour menu for question 1 (the maintainer's sketch, November
// 2026): a small square of each colour with its heraldic name beside it and
// the everyday word underneath in brackets, each set inside its own outline.
function slimSets() {
  const one = id => {
    const t = TINCTURES[id];
    return `<button class="slim" type="button" data-q1="${id}" aria-pressed="${state.shieldColours.includes(id)}">${swatchSVG(id)}` +
      `<span><b>${esc(t.name)}</b>${t.kind === 'fur' ? '' : `<small>(${esc(t.plain)})</small>`}</span></button>`;
  };
  const set = (label, order) => `<div class="slim-set"><div class="slim-label">${esc(label)}</div><div class="slim-row">${order.map(one).join('')}</div></div>`;
  return `<div class="slim-sets">${set(TEXT.coloursLabel, COLOUR_ORDER)}${set(TEXT.metalsLabel, METAL_ORDER)}${set(TEXT.fursLabel, FUR_ORDER)}</div>`;
}

function renderColourPanels() {
  $('shieldColoursPanel').innerHTML = `<h2>${esc(TEXT.shieldColours)}</h2><p class="help">${esc(TEXT.shieldColoursHelp)}</p>` +
    slimSets() + paletteChooser();
  $('fieldColoursPanel').innerHTML = `<h2>${esc(TEXT.fieldColours)}</h2><p class="help">${esc(TEXT.fieldColoursHelp)}</p>` +
    swatchSets(offered(), id => swatchButton(id, { on: state.fieldColours.includes(id), attr: 'data-q2', small: true })) +
    `<div class="row" style="margin-top:10px"><button class="name-btn" type="button" data-field-unspecified aria-pressed="${state.fieldUnspecified}">${esc(TEXT.dontSpecify)}</button></div>`;
}

// `waiting`: the card's picture is still being worked out (see lazyCard); it
// is shown as an empty shield for now.
function card({ attrs, shield, label, on, problems = [], why = null, waiting = null }) {
  const reason = why || (problems.length ? ruleText(problems[0]) : '');
  const greyed = reason ? ` greyed" aria-disabled="${!state.herald}` : '';
  const title = shield ? blazon(shield.field, shield.groups, words) : '';
  return `<button class="card${waiting ? ' waiting' : ''}${greyed}" type="button" ${attrs}${waiting ? ` data-waiting="${waiting}"` : ''} aria-pressed="${!!on}">` +
    (shield ? shieldSVG(shield.field, { charges: shield.groups, title }) : waiting ? shieldSVG(null) : '') +
    `<span>${esc(label)}</span>${reason ? `<span class="why">${esc(reason)}</span>` : ''}</button>`;
}

function permutations(list) {
  if (list.length <= 1) return [list];
  return list.flatMap((x, i) => permutations([...list.slice(0, i), ...list.slice(i + 1)]).map(p => [x, ...p]));
}

// "How is the background divided?": one picture per division. When the
// background's colours are not all chosen, the colours shown are random ones
// that the rules allow.
function renderDivisionPanel() {
  const fc = state.fieldColours, k = fc.length;
  const base = { palette: palette(), mustInclude: mustInclude(), charge: 'none', allowBare: true };
  const cards = [];

  const randomCard = id => {
    const found = option('division', { ...base, division: id, fieldTinctures: k ? fc : null });
    const label = id === 'plain' ? (k ? plainLabel(fc[0]) : TEXT.plainBackgroundAny) : DIVISIONS[id].name;
    const on = state.division === id || (id === 'plain' && !state.division && k === 1);
    return card({ attrs: `data-division="${id}"`, shield: found && found.shield, label, on,
                  problems: found ? found.problems : [], why: found ? null : TEXT.rules['not-possible'] });
  };
  const exactCard = (id, order) => {
    const field = divided(id, order.map(plain));
    const problems = checkShield({ field, groups: [] });
    const on = state.division === id && fc.join() === order.join();
    return card({ attrs: `data-division="${id}" data-order="${order.join(',')}"`, shield: { field, groups: [] },
                  label: DIVISIONS[id].name, on, problems });
  };

  if (k <= 1) {
    cards.push(randomCard('plain'), ...TWO_TINCTURE.map(randomCard), ...THREE_TINCTURE.map(randomCard));
  } else if (k === 2) {
    cards.push(...TWO_TINCTURE.map(id => exactCard(id, fc)));
  } else if (k === 3) {
    cards.push(...THREE_TINCTURE.flatMap(id => permutations(fc).map(order => exactCard(id, order))));
  }
  cards.push(`<button class="card text-card" type="button" data-complex aria-pressed="${state.division === 'complex'}">${esc(TEXT.complexOption)}</button>`);

  $('divisionPanel').innerHTML = `<h2>${esc(TEXT.dividedHeading)}</h2>` +
    (k === 2 ? `<p style="margin:0 0 12px"><button class="plain-btn" type="button" data-swap>⇄ ${esc(TEXT.swap)}</button></p>` : '') +
    `<div class="row">${cards.join('')}</div>` +
    (state.division === 'complex' ? renderBuilder() : '');
}

function plainLabel(tincture) {
  const t = TINCTURES[tincture];
  return TEXT.plainBackground(t.kind === 'fur' ? t.name : cap(t.plain));
}

// ---- The "more complex background" form ---------------------------------------
function builderToField(b) {
  const parts = b.parts.slice(0, DIVISIONS[b.division].parts).map(p =>
    p.kind === 'plain' ? plain(p.tincture) : divided(p.kind, [plain(p.a), plain(p.b)]));
  return divided(b.division, parts);
}

function builderFromField(field) {
  const parts = field.parts.map(p => (p.type === 'plain'
    ? { kind: 'plain', tincture: p.tincture, a: p.tincture, b: p.tincture }
    : { kind: p.division, tincture: p.parts[0].tincture, a: p.parts[0].tincture, b: p.parts[1].tincture }));
  while (parts.length < 3) parts.push({ ...parts[0] });
  return { division: field.division, parts };
}

// Any tincture allowed in the shield can be used in the form; whatever the
// form ends up using becomes the answer to "colours used in the background".
const builderTinctures = offered;

// Start the form on a random background the rules allow, using the
// background colours already chosen (and adding others if more are needed).
function defaultBuilder() {
  const chosen = [...state.fieldColours];
  const pool = offered().filter(t => !chosen.includes(t) && TINCTURES[t].kind !== 'fur');
  for (let i = 0; i < 40; i++) {
    const key = `${SEED}|builder|${i}|${chosen.join()}`;
    const extra = shuffled(randomFrom(key), pool);
    const set = [...chosen, ...extra].slice(0, Math.max(3, Math.min(chosen.length, 4)));
    const found = set.length >= 3 && randomShield({ fieldTinctures: set, charge: 'none', allowBare: true }, key, library);
    if (found && isNested(found.field)) return builderFromField(found.field);
  }
  const t = [...chosen, ...pool, ...ALL_TINCTURES];
  return builderFromField(divided('perPale', [plain(t[0]), divided('checky', [plain(t[1]), plain(t[2])])]));
}

function builderField() {
  return builderToField(state.builder || (state.builder = defaultBuilder()));
}

function renderBuilder() {
  const b = state.builder || (state.builder = defaultBuilder());
  const parts = DIVISIONS[b.division].parts;
  // Would this change leave a background the rules allow?
  const allowed = change => {
    if (state.herald) return true;
    const trial = { division: b.division, parts: b.parts.map(p => ({ ...p })) };
    change(trial);
    return checkShield({ field: builderToField(trial), groups: [] }).length === 0;
  };
  const opt = (value, label, selected, ok) =>
    `<option value="${value}"${selected ? ' selected' : ''}${ok || selected ? '' : ' disabled'}>${esc(label)}</option>`;
  const tinctureLabel = id => `${TINCTURES[id].plain} (${TINCTURES[id].name})`;

  // Every division may be the first choice: SENA allows a pattern of many
  // pieces with a divided part ("Barry azure and checky gules and argent").
  const tops = Object.keys(DIVISIONS);
  let html = `<div class="builder"><label>${esc(TEXT.builderDivision)} <select data-b="division">` +
    tops.map(id => opt(id, DIVISIONS[id].name, id === b.division, allowed(t => { t.division = id; }))).join('') + `</select></label>`;
  for (let i = 0; i < parts; i++) {
    const p = b.parts[i];
    const kinds =
      builderTinctures().map(id => opt('plain:' + id, tinctureLabel(id), p.kind === 'plain' && p.tincture === id,
        allowed(t => { t.parts[i].kind = 'plain'; t.parts[i].tincture = id; }))).join('') +
      TWO_TINCTURE.map(id => opt(id, DIVISIONS[id].name + '…', p.kind === id, allowed(t => { t.parts[i].kind = id; }))).join('');
    html += `<label>${esc(TEXT.builderPart(i + 1))} <select data-b="kind" data-i="${i}">${kinds}</select>`;
    if (p.kind !== 'plain') {
      const side = which => `<select data-b="${which}" data-i="${i}">` + builderTinctures().map(id =>
        opt(id, tinctureLabel(id), p[which] === id, allowed(t => { t.parts[i][which] = id; }))).join('') + `</select>`;
      html += `${side('a')} ${esc(TEXT.builderAnd)} ${side('b')}`;
    }
    html += `</label>`;
  }
  return html + `</div>`;
}

// ---- "What charges are on the field?" ------------------------------------------
const sameCharge = (a, b) => !!a && !!b && a.kind === b.kind && a.id === b.id;
const samePicture = (a, b) => sameCharge(a, b) && (a.file || '') === (b.file || '');
// A charge's name in plain words, for labels: "lion rampant", "chevron".
function choiceName(choice, plural = false) {
  if (choice.kind === 'ordinary') return ORDINARIES[choice.id].name + (plural ? 's' : '');
  const charge = library.charges.find(c => c.id === choice.id);
  const picture = choice.file ? library.pictures.find(p => p.file === choice.file) : null;
  const name = charge ? (plural ? (charge.plural || charge.name + 's') : charge.name).toLowerCase() : choice.id;
  return [name, picture && picture.posture].filter(Boolean).join(' ');
}

// One chosen charge's block: its name, how many, how they are set out, and
// what colour. A number or colour is greyed if no shield fitting the other
// choices could have it. Finding that out takes a moment, so it is done
// after the click has been answered (see "Pictures that take a moment");
// until then the block shows what was greyed before.
const lastTried = new Map();
function slotBlock(slot, c) {
  const item = state.items[slot];
  const { list, at } = itemList(slot);
  const jobs = [];
  const tried = (key, values) => {
    // (A number is judged with the charges set out any way: choosing
    // another number drops a way of setting them out that no longer fits.)
    const items = key === 'number' ? list.map((x, k) => (k === at[slot] ? { ...x, arranged: null } : x)) : list;
    const about = { ...c, items, arrangement: chosenArrangement(list.filter(x => x.charge).length) };
    const memo = `${SEED}|${key}|${at[slot]}|${library.pictures.length}|${JSON.stringify(about)}`;
    const work = () => { lastTried.set(`${slot}|${key}`, remember(memo, () => whichWork(about, at[slot], key, values, memo, library))); };
    if (remembered.has(memo)) work(); else jobs.push(work);
    return lastTried.get(`${slot}|${key}`) || new Map();
  };
  const numbers = tried('number', NUMBERS), colours = tried('tincture', [...offered(), COUNTERCHANGED]);
  if (jobs.length) {
    later.push({ panel: 'charge', run: () => {
      jobs.forEach(job => job());
      const block = document.querySelector(`[data-block="${slot}"]`);
      if (!block) return;
      // redraw the block, keeping the keyboard's place in it
      const focused = [...block.querySelectorAll('button')].indexOf(document.activeElement);
      block.innerHTML = slotBlock(slot, c);
      if (focused >= 0) block.querySelectorAll('button')[focused]?.focus({ preventScroll: true });
    } });
  }
  const possible = set => {
    const faults = 'number' in set ? numbers.get(set.number) : colours.get(set.tincture);
    return faults ? ruleText(faults[0]) : '';
  };
  const numberButton = n => {
    const why = possible({ number: n });
    return `<button class="name-btn${why ? ` greyed" aria-disabled="${!state.herald}" title="${esc(why)}` : ''}" type="button" ` +
      `data-number="${n}" data-slot="${slot}" aria-pressed="${item.number === n}">${n === SEMY ? esc(TEXT.semy) : n}</button>`;
  };
  const colourButton = id => swatchButton(id, { on: item.tincture === id, attr: `data-slot="${slot}" data-charge-tincture`, small: true, why: possible({ tincture: id }) });
  let html = '';
  if (item.choice) {
    html += `<div class="slot-head"><strong>${esc(choiceName(item.choice))}</strong>` +
      `<button class="link-btn" type="button" data-remove="${slot}">${esc(TEXT.chargeRemove)}</button></div>`;
  }
  if (!item.choice || item.choice.kind === 'charge') {
    html += `<div class="row-label">${esc(TEXT.chargeNumber)}</div><div class="row">${NUMBERS.map(numberButton).join('')}</div>`;
  }
  return html + `<div class="row-label">${esc(TEXT.chargeColour)}</div>` +
    swatchSets(offered(), colourButton) + `<div class="row" style="margin-top:10px">${colourButton(COUNTERCHANGED)}` +
    `<button class="name-btn" type="button" data-slot="${slot}" data-charge-tincture="${UNSPECIFIED}" aria-pressed="${item.tincture === UNSPECIFIED}">${esc(TEXT.dontSpecify)}</button></div>`;
}

function renderChargePanel() {
  forgetLater('charge');
  const c = constraints();
  const q = state.chargeFilter.trim().toLowerCase();
  const matches = name => !q || name.toLowerCase().includes(q);
  const first = state.items[0];
  const count = state.items.filter(item => item.choice).length;
  const isPicked = choice => state.items.some(item => samePicture(item.choice, choice));

  // Each option is drawn on a shield that fits everything else chosen so far:
  // with the charges already chosen, if it would be added to them.
  const chargeCard = (choice, label) => {
    const attrs = `data-charge="${choice.kind}:${esc(choice.id)}:${esc(choice.file || '')}"`;
    const mine = state.items.findIndex(item => sameCharge(item.choice, choice));
    let items;
    if (mine >= 0) items = wantedItems({ slot: mine, set: { charge: choice } });      // chosen (perhaps as another picture)
    else if (!first.choice) items = [{ charge: choice, number: choice.kind === 'ordinary' ? null : (first.number || 1), tincture: tinctureOf(first) }];
    else if (count >= MAX_ITEMS) return card({ attrs, shield: null, label, on: false, why: TEXT.chargeFull });
    else items = [...(wantedItems() || []), { charge: choice, number: null, tincture: null }];
    return lazyCard('charge', 'charge', { ...c, items, arrangement: mine >= 0 ? c.arrangement : chosenArrangement(items.length - 1) },
      found => ({ attrs, shield: found && found.shield, label, on: isPicked(choice), problems: found ? found.problems : [],
                  why: found === null ? TEXT.rules['not-possible'] : null }));
  };

  const ordinaries = Object.entries(ORDINARIES).filter(([, o]) => matches(o.name))
    .map(([id, o]) => chargeCard({ kind: 'ordinary', id }, o.name));
  const withPicture = new Set(library.pictures.map(p => p.charge_id));
  const pictures = library.pictures
    .map(p => ({ p, label: [p.charge.name.toLowerCase(), p.posture].filter(Boolean).join(' ') }))
    .filter(x => matches(x.label));
  const pictureCards = pictures.slice(0, MAX_CARDS)
    .map(x => chargeCard({ kind: 'charge', id: x.p.charge_id, file: x.p.file }, x.label));
  const ordinaryNames = new Set(Object.values(ORDINARIES).map(o => o.name));
  const names = library.charges.filter(ch =>
    !withPicture.has(ch.id) && !ordinaryNames.has(ch.name.toLowerCase()) && matches(ch.name));
  const namesShown = names.slice(0, MAX_NAMES_SHOWN);

  let html = `<h2>${esc(TEXT.chargeHeading)}</h2><p class="help">${esc(TEXT.chargeHelp)}</p>`;

  // For each charge chosen: how many, and what colour. Asked first so they
  // are not missed below the list (and, for the first, before any is chosen).
  if (!state.noCharge) {
    state.items.forEach((item, slot) => { html += `<div class="slot" data-block="${slot}">${slotBlock(slot, c)}</div>`; });
  }

  html += `<input type="search" id="chargeFilter" value="${esc(state.chargeFilter)}" placeholder="${esc(TEXT.chargeSearch)}" aria-label="${esc(TEXT.chargeSearch)}">`;
  html += `<div class="row"><button class="card text-card" type="button" data-charge="none" aria-pressed="${state.noCharge}">${esc(TEXT.chargeNone)}</button></div>`;
  if (ordinaries.length) html += `<div class="row-label">${esc(TEXT.chargeOrdinaries)}</div><div class="row">${ordinaries.join('')}</div>`;
  if (pictureCards.length) {
    html += `<div class="row-label">${esc(TEXT.chargePictures)}</div><div class="row">${pictureCards.join('')}</div>`;
    if (pictures.length > MAX_CARDS) html += `<p class="note">${esc(TEXT.chargeMore(pictures.length - MAX_CARDS))}</p>`;
  }
  if (namesShown.length) {
    html += `<div class="row-label">${esc(TEXT.chargeNoPicture)}</div><div class="row">` +
      namesShown.map(ch => `<button class="name-btn" type="button" data-charge="charge:${esc(ch.id)}:" ` +
        `aria-pressed="${isPicked({ kind: 'charge', id: ch.id })}">${esc(ch.name.toLowerCase())}</button>`).join('') + `</div>`;
    if (names.length > namesShown.length) html += `<p class="note">${esc(TEXT.chargeMore(names.length - namesShown.length))}</p>`;
  }
  if (!ordinaries.length && !pictureCards.length && !namesShown.length) html += `<p class="note">${esc(TEXT.chargeNoMatch)}</p>`;
  $('chargePanel').innerHTML = html;
}

// ---- "How are they arranged?" ----------------------------------------------------
// Two things, both as pictures, with the ways the rules forbid greyed and the
// reason given:
//   * how each charge's own charges are arranged (in pale, in bend...), which
//     needs only one kind of charge;
//   * with two or more kinds, every way they can go together, so that nobody
//     needs to know the words "primary", "secondary" and "tertiary".

// A row of pictures for each charge whose own charges can be arranged: the
// usual way for that many, then each named arrangement. Only charges that can
// be in the middle of the shield have a choice so far (ROADMAP item 7), and a
// single charge, or charges strewn (semy), have none. With nothing picked
// yet the row shows charges at random.
function arrangedRows(c, current) {
  if (state.noCharge) return '';
  const picked = state.items.filter(item => item.choice);
  if (picked.some(item => item.choice.kind === 'ordinary' && !ORDINARIES[item.choice.id].peripheral)) return '';
  const main = current ? current.findIndex(x => x.as === 'primary') : -1;
  // (Once one charge has been given an arrangement, only that one has a row:
  // it is the one in the middle, and the others have no choice yet.)
  const already = state.items.some(item => item.arranged);
  const slots = state.items.map((item, slot) => ({ item, slot })).filter(({ item, slot }) => {
    if (item.number === 1 || item.number === SEMY) return false;
    if (!item.choice) return slot === 0 && state.items.length === 1;
    if (already && !item.arranged) return false;
    return item.choice.kind === 'charge' && (!current || picked.indexOf(item) === main);
  }).slice(0, 2);
  return slots.map(({ item, slot }) => {
    const ways = ['usual', ...(item.number ? arrangementsFor(item.number) : Object.keys(ARRANGEMENTS))];
    return (picked.length > 1 ? `<div class="row-label">${esc(choiceName(item.choice, true))}</div>` : '') +
      `<div class="row">` + ways.map(id => {
        // (the usual way is shown with three if how many has not been chosen)
        const set = id === 'usual' ? { arranged: id, number: item.number || 3 } : { arranged: id };
        return lazyCard('arrange', 'charge-arranged', { ...c, items: wantedItems({ slot, set }) }, found => ({
          attrs: `data-slot="${slot}" data-arranged="${id}"`, shield: found && found.shield,
          label: id !== 'usual' ? ARRANGEMENTS[id].name : (USUAL_ARRANGEMENT[item.number] || TEXT.arrangedUsual), on: item.arranged === id,
          problems: found ? found.problems : [], why: found === null ? TEXT.rules['not-possible'] : null,
        }));
      }).join('') + `</div>`;
  }).join('');
}

function renderArrangePanel() {
  forgetLater('arrange');
  const c = constraints();
  const picked = chosen();
  const groups = picked.map(x => x.group);
  let html = `<h2>${esc(TEXT.arrangeHeading)}</h2>`;
  shownArrangements = [];
  const current = chosenArrangement(groups.length);
  const several = groups.length >= 2;
  // How each charge's own charges are arranged ("in pale", "in bend"...).
  const own = arrangedRows(c, current);
  if (!several && !own) {
    const strewn = state.items.some(item => item.number === SEMY);
    $('arrangePanel').innerHTML = html + `<p class="note" style="margin:0">${esc(strewn ? TEXT.arrangeSemy : TEXT.arrangeNothing)}</p>`;
    return;
  }
  // How different charges go together (with two or more kinds of charge).
  const ways = several ? arrangements(groups) : [];
  if (several && own) html += `<div class="row-label" style="margin-top:0">${esc(TEXT.arrangeTogether)}</div>`;
  if (several && !ways.length) html += `<p class="note" style="margin:0">${esc(TEXT.arrangeNone)}</p>`;
  else if (several) {
    // What goes under a picture: "lions around the chevron; mullets on the chief".
    const label = (way, example) => {
      const drawn = example ? unarrange(example.groups).groups : [];
      const several = i => {
        const choice = picked[i].item.choice;
        const g = drawn.find(x => (x.kind === 'ordinary' ? x.ordinary : x.charge) === choice.id && x.kind === choice.kind);
        return !!g && g.kind === 'charge' && g.number !== 1;
      };
      const name = (i, as) => choiceName(picked[i].item.choice, as === 'around' || several(i));
      const main = way.findIndex(x => x.as === 'primary');
      const bits = way.map((x, i) =>
        x.as === 'around' ? TEXT.arrAround(name(i, x.as), name(main)) : x.as === 'chief' ? TEXT.arrChief(name(i), name(main))
        : x.as === 'base' ? TEXT.arrBase(name(i), name(main)) : x.as === 'on' ? TEXT.arrOn(name(i), name(x.on))
        : x.as === 'edge' && main >= 0 && way.length === 2 ? TEXT.arrWith(name(main), name(i)) : null).filter(Boolean);
      return bits.join('; ') || picked.map((x, i) => name(i)).join(', ');
    };
    // The ways the rules have nothing against come first (as far as can be
    // told before the colours are looked at); no more than fit in three rows.
    const sound = way => !checkArrangement(arrange(groups, way)).length;
    shownArrangements = [...ways.filter(sound), ...ways.filter(way => !sound(way))].slice(0, MAX_CARDS);
    html += `<div class="row">` + shownArrangements.map((way, k) =>
      lazyCard('arrange', 'arrangement', { ...c, arrangement: way }, found => ({
        attrs: `data-arrangement="${k}"`, shield: found && found.shield, label: label(way, found && found.shield),
        on: sameArrangement(way, current), problems: found ? found.problems : [], why: found === null ? TEXT.rules['not-possible'] : null,
      }))).join('') + `</div>`;
  }
  if (several) {
    html += `<div class="row" style="margin-top:10px"><button class="name-btn" type="button" data-arrangement-unspecified ` +
      `aria-pressed="${state.arrangementUnspecified}">${esc(TEXT.dontSpecify)}</button></div>`;
  }
  html += own;

  // "I'm a herald": say directly what each charge is.
  if (state.herald && several) {
    const opt = (value, text, selected) => `<option value="${value}"${selected ? ' selected' : ''}>${esc(text)}</option>`;
    html += `<div class="roles">` + picked.map(({ item, group }, i) => {
      const now = current ? current[i] : null;
      const is = (as, on = null) => !!now && now.as === as && (now.on ?? null) === on;
      const edge = group.kind === 'ordinary' && ORDINARIES[group.ordinary].peripheral;
      const options = edge ? opt('edge', TEXT.roleEdge, true)
        : opt('', TEXT.roleUnset, !now) + opt('primary', TEXT.rolePrimary, is('primary')) + opt('around', TEXT.roleAround, is('around')) +
          opt('chief', TEXT.roleChief, is('chief')) + opt('base', TEXT.roleBase, is('base')) +
          picked.map((other, j) => (j === i ? '' : opt('on:' + j, TEXT.roleOn(choiceName(other.item.choice)), is('on', j)))).join('');
      return `<label>${esc(TEXT.rolesLabel(choiceName(item.choice)))} <select data-role="${i}"${edge ? ' disabled' : ''}>${options}</select></label>`;
    }).join('') + `</div>`;
  }
  $('arrangePanel').innerHTML = html;
}

// ---- The shield being built (top right) ----------------------------------------
function renderCurrent() {
  const shield = shownShield();
  const text = blazon(shield.field, shield.groups, words);
  const patterns = shieldPatterns(shield.field, shield.groups, { noCharge: shield.noCharge });
  const problems = checkShield(shield);
  const f = shield.field;
  const noTinctures = f && f.type === 'divided' && DIVISIONS[f.division].tincturesIndexed === false;
  $('currentPanel').innerHTML =
    shieldSVG(f, { charges: shield.groups, title: text }) +
    `<p class="blazon">${esc(text)}</p>` +
    (problems.length ? `<ul class="problems">${problems.map(p =>
      `<li>${esc(ruleText(p))}${p.sena ? ` (SENA ${esc(p.sena)})` : ''}</li>`).join('')}</ul>` : '') +
    (patterns.length ? `<a class="search-link" href="${esc(complexSearchURL(patterns))}" target="_blank" rel="noopener">${esc(TEXT.searchLink)} →</a>` : '') +
    (noTinctures ? `<p class="note">${esc(TEXT.tincturesNotIndexed)}</p>` : '') +
    (patterns.length ? `<details><summary>${esc(TEXT.patternsSummary)}</summary><code>${esc(patterns.join('\n'))}</code></details>` : '');
}

// ---- Suggestions (along the bottom) ---------------------------------------------
function renderSuggestions() {
  // Suggestions may add a charge or two that was not asked for (a bordure,
  // charges around an ordinary...): they are ideas, not only what was chosen.
  const c = { ...constraints(), extras: true };
  const key = `${SEED}|suggest|${state.epoch}|${library.pictures.length}|${JSON.stringify(c)}`;
  // New suggestions are worked out a moment later (see "Pictures that take a
  // moment"); until then the ones on screen stay, dimmed.
  forgetLater('suggestions');
  if (!remembered.has(key)) {
    later.push({ panel: 'suggestions', run: () => {
      remember(key, () => randomShields(c, key, library, SUGGESTION_COUNT + state.pinned.length));
      renderSuggestions();
      addCollapseButtons();
    } });
    const row = $('suggestionsPanel').querySelector('.suggestion-row');
    if (row) { row.classList.add('waiting'); return; }
  }
  const pinnedText = new Set(state.pinned.map(s => blazon(s.field, s.groups)));
  const fresh = (remembered.get(key) || [])
    .filter(s => !pinnedText.has(blazon(s.field, s.groups))).slice(0, SUGGESTION_COUNT);
  shown = [...state.pinned, ...fresh];

  const suggestion = (s, i) => {
    const text = blazon(s.field, s.groups);
    const pinned = i < state.pinned.length;
    return `<div class="suggestion${pinned ? ' pinned' : ''}">${shieldSVG(s.field, { charges: s.groups, title: text })}` +
      `<p title="${esc(text)}">${esc(text)}</p>` +
      `<button type="button" data-select="${i}">${esc(TEXT.select)}</button>` +
      `<button type="button" data-pin="${i}">${esc(pinned ? TEXT.unpin : TEXT.pin)}</button></div>`;
  };
  const note = !remembered.has(key) ? '' : !fresh.length ? TEXT.noSuggestions
    : fresh.length < SUGGESTION_COUNT / 2 || (palette() && paletteLacks(palette())) ? fewReason() : '';
  $('suggestionsPanel').innerHTML =
    `<div class="suggestions-head"><h2>${esc(TEXT.suggestions)}</h2>` +
    `<button class="plain-btn" type="button" data-reroll>↻ ${esc(TEXT.reroll)}</button>` +
    (note ? `<span class="note" style="margin:0">${esc(note)}</span>` : '') + `</div>` +
    `<div class="suggestion-row">${shown.map(suggestion).join('')}</div>`;
}

// Why only a few suggestions can be made: the most useful thing to change.
function fewReason() {
  const p = palette();
  if (p) {
    const lacks = paletteLacks(p);
    if (lacks === 'metal') return TEXT.fewNeedMetal;
    if (lacks === 'colour') return TEXT.fewNeedColour;
    if (p.length <= 3) return TEXT.fewMoreColours;
  }
  return TEXT.fewSuggestions;
}

function render() {
  // How long each part took, in milliseconds, is kept in window.renderTimes
  // (for whoever next needs to find out why the page feels slow).
  const times = {};
  for (const part of [renderColourPanels, renderDivisionPanel, renderChargePanel, renderArrangePanel, renderCurrent, renderSuggestions]) {
    const start = performance.now();
    part();
    times[part.name] = Math.round(performance.now() - start);
  }
  window.renderTimes = times;
  addCollapseButtons();
  fillLater();
}

// A "collapse" / "expand" button beside each section's heading.
const COLLAPSIBLE = ['shieldColoursPanel', 'fieldColoursPanel', 'divisionPanel', 'chargePanel', 'arrangePanel', 'suggestionsPanel'];
function addCollapseButtons() {
  for (const id of COLLAPSIBLE) {
    const panel = $(id), heading = panel.querySelector('h2');
    if (!heading) continue;
    const closed = state.collapsed.has(id);
    panel.classList.toggle('collapsed', closed);
    heading.querySelector('.collapse-btn')?.remove();     // (a panel may not have been redrawn)
    heading.insertAdjacentHTML('beforeend',
      ` <button class="collapse-btn" type="button" data-collapse="${id}" aria-expanded="${!closed}">${esc(closed ? TEXT.expand : TEXT.collapse)}</button>`);
  }
}

// ---- "select this shield": copy a suggestion into the questions ------------------
function adopt(shield) {
  const { field, groups } = shield;
  state.fieldColours = [...new Set(leafTinctures(field))];
  if (field.type === 'plain') { state.division = 'plain'; state.builder = null; }
  else if (isNested(field)) { state.division = 'complex'; state.builder = builderFromField(field); }
  else { state.division = field.division; state.builder = null; state.fieldColours = leafTinctures(field); }
  // The charges, one entry each, and how they go together.
  const made = unarrange(groups);
  state.items = made.groups.map(g => ({
    choice: g.kind === 'ordinary' ? { kind: 'ordinary', id: g.ordinary, file: null } : { kind: 'charge', id: g.charge, file: g.art },
    number: g.kind === 'ordinary' ? null : g.number,
    arranged: g.arranged || (g.kind !== 'ordinary' && USUAL_ARRANGEMENT[g.number] ? 'usual' : null),
    tincture: g.tincture,
  }));
  state.noCharge = !state.items.length;
  if (state.noCharge) state.items = [{ choice: null, number: null, tincture: null }];
  state.arrangement = made.groups.length > 1 ? made.arrangement : null;
  state.arrangementUnspecified = false;
  // Every colour the shield uses is ticked in the first question too.
  state.shieldColours = [...new Set([...state.shieldColours, ...shieldTinctures(field, groups)])];
}

// Take a charge off the shield. The first entry stays, emptied, with its
// number and colour (as it was before a charge was picked).
function removeItem(at) {
  // The arrangement chosen for the others is kept if it still makes sense
  // without this one (nothing lay on it, and it was not what they were around).
  const was = chosenArrangement(state.items.filter(item => item.choice).length);
  const needed = was && was.some((x, i) => i !== at && (x.on === at || (was[at].as === 'primary' && x.as !== 'edge' && x.as !== 'on')));
  state.arrangement = was && !needed && was.length > 2
    ? was.filter((x, i) => i !== at).map(x => (x.as === 'on' && x.on > at ? { ...x, on: x.on - 1 } : x)) : null;
  if (state.items.length === 1) state.items[0].choice = null;
  else state.items.splice(at, 1);
}

// Put another charge on the shield. A chief, bordure, orle or base has only
// one place it can go, so an arrangement already chosen still stands.
function addItem(choice) {
  const was = chosenArrangement(state.items.filter(item => item.choice).length);
  state.items.push({ choice, number: null, tincture: null });
  state.arrangement = was && choice.kind === 'ordinary' && ORDINARIES[choice.id].peripheral ? [...was, { as: 'edge' }] : null;
}

// ---- Reacting to clicks and typing -------------------------------------------------
document.addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  // Greyed options do nothing unless "I'm a herald" is ticked.
  if (btn.getAttribute('aria-disabled') === 'true') return;
  const d = btn.dataset;
  let refocus = null;
  if (d.q1) {
    const removing = state.shieldColours.includes(d.q1);
    state.shieldColours = toggle(state.shieldColours, d.q1);
    if (removing) {
      // A colour no longer used in the shield cannot be in the background or on the charge.
      state.fieldColours = state.fieldColours.filter(t => t !== d.q1);
      for (const item of state.items) if (item.tincture === d.q1) item.tincture = null;
      state.builder = null;
    }
    refocus = `[data-q1="${d.q1}"]`;
  } else if ('fieldUnspecified' in d) {
    state.fieldUnspecified = !state.fieldUnspecified;
    refocus = '[data-field-unspecified]';
  } else if ('collapse' in d) {
    if (state.collapsed.has(d.collapse)) state.collapsed.delete(d.collapse); else state.collapsed.add(d.collapse);
    refocus = `[data-collapse="${d.collapse}"]`;
  } else if (d.q2) {
    state.fieldUnspecified = false;
    state.fieldColours = toggle(state.fieldColours, d.q2);
    state.builder = null;
    refocus = `[data-q2="${d.q2}"]`;
  } else if (d.division) {
    // Clicking the chosen division again un-chooses it.
    const order = d.order ? d.order.split(',') : null;
    const same = state.division === d.division && (!order || order.join() === state.fieldColours.join());
    state.division = same ? null : d.division;
    if (order && !same) state.fieldColours = order;
    refocus = `[data-division="${d.division}"]` + (d.order ? `[data-order="${d.order}"]` : '');
  } else if ('complex' in d) {
    state.division = state.division === 'complex' ? null : 'complex';
    refocus = '[data-complex]';
  } else if ('swap' in d) {
    state.fieldColours = [...state.fieldColours].reverse();
    refocus = '[data-swap]';
  } else if (d.charge) {
    if (d.charge === 'none') {
      // "no charge": everything chosen about charges is dropped, except the
      // first entry's number and colour (as before a charge was picked).
      state.noCharge = !state.noCharge;
      if (state.noCharge) { state.items = [{ ...state.items[0], choice: null }]; state.arrangement = null; }
    } else {
      const [kind, id, file] = d.charge.split(':');
      const choice = { kind, id, file: file || null };
      const at = state.items.findIndex(item => sameCharge(item.choice, choice));
      state.noCharge = false;
      if (at >= 0 && samePicture(state.items[at].choice, choice)) removeItem(at);   // picked again: taken off
      else if (at >= 0) state.items[at].choice = choice;                            // another picture of the same charge
      else if (!state.items[0].choice) state.items[0].choice = choice;
      else if (state.items.length < MAX_ITEMS) addItem(choice);
    }
    refocus = `[data-charge="${d.charge}"]`;
  } else if (d.remove) {
    removeItem(Number(d.remove));
  } else if (d.number) {
    const n = d.number === SEMY ? SEMY : Number(d.number), item = state.items[Number(d.slot)];
    item.number = item.number === n ? null : n;
    refocus = `[data-number="${d.number}"][data-slot="${d.slot}"]`;
  } else if (d.chargeTincture) {
    const item = state.items[Number(d.slot)];
    item.tincture = item.tincture === d.chargeTincture ? null : d.chargeTincture;
    refocus = `[data-charge-tincture="${d.chargeTincture}"][data-slot="${d.slot}"]`;
  } else if (d.arranged) {
    const item = state.items[Number(d.slot)];
    item.arranged = item.arranged === d.arranged ? null : d.arranged;
    refocus = `[data-arranged="${d.arranged}"][data-slot="${d.slot}"]`;
  } else if (d.arrangement) {
    // Clicking the chosen arrangement again un-chooses it.
    const way = shownArrangements[Number(d.arrangement)];
    state.arrangement = sameArrangement(way, state.arrangement) ? null : way;
    state.arrangementUnspecified = false;
    refocus = `[data-arrangement="${d.arrangement}"]`;
  } else if ('arrangementUnspecified' in d) {
    state.arrangementUnspecified = !state.arrangementUnspecified;
    if (state.arrangementUnspecified) state.arrangement = null;
    refocus = '[data-arrangement-unspecified]';
  } else if (d.select) {
    adopt(shown[Number(d.select)]);
  } else if (d.pin) {
    const i = Number(d.pin);
    if (i < state.pinned.length) state.pinned.splice(i, 1);
    else state.pinned.push(shown[i]);
  } else if ('palettes' in d) {
    state.showPalettes = !state.showPalettes;
    refocus = '[data-palettes]';
  } else if (d.palette) {
    choosePalette(d.palette);
    state.showPalettes = false;
    refocus = '[data-palettes]';
  } else if ('reroll' in d) {
    state.epoch++;
    refocus = '[data-reroll]';
  } else return;
  tidy();
  render();
  // preventScroll: keep the page where it is instead of jumping to the button.
  if (refocus) document.querySelector(refocus)?.focus({ preventScroll: true });
});

document.addEventListener('change', e => {
  if (e.target.id === 'herald') { state.herald = e.target.checked; render(); return; }
  // "I'm a herald": one charge's place in the design, said directly. The
  // others keep the places they have (as chosen, or as drawn).
  const role = e.target.closest('select[data-role]');
  if (role) {
    const groups = chosen().map(x => x.group), i = Number(role.dataset.role);
    const base = chosenArrangement(groups.length) || unarrange(groups).drawn;
    if (role.value === '') state.arrangement = null;
    else {
      const [as, on] = role.value.split(':');
      state.arrangement = base.map((x, k) => (k === i ? (as === 'on' ? { as, on: Number(on) } : { as }) : x));
      state.arrangementUnspecified = false;
    }
    tidy();
    render();
    document.querySelector(`select[data-role="${i}"]`)?.focus({ preventScroll: true });
    return;
  }
  const sel = e.target.closest('select[data-b]');
  if (!sel) return;
  const b = state.builder, i = Number(sel.dataset.i);
  if (sel.dataset.b === 'division') b.division = sel.value;
  else if (sel.dataset.b === 'kind') {
    if (sel.value.startsWith('plain:')) { b.parts[i].kind = 'plain'; b.parts[i].tincture = sel.value.slice(6); }
    else b.parts[i].kind = sel.value;
  } else b.parts[i][sel.dataset.b] = sel.value;
  const key = `select[data-b="${sel.dataset.b}"]` + (sel.dataset.i ? `[data-i="${sel.dataset.i}"]` : '');
  tidy();
  render();
  document.querySelector(key)?.focus({ preventScroll: true });
});

// Typing in the charge search box: redraw the list, keep the cursor in place.
document.addEventListener('input', e => {
  if (e.target.id !== 'chargeFilter') return;
  state.chargeFilter = e.target.value;
  const at = e.target.selectionStart;
  renderChargePanel();
  addCollapseButtons();
  fillLater();
  const box = $('chargeFilter');
  box.focus({ preventScroll: true });
  box.setSelectionRange(at, at);
});

// The chosen palette is remembered in this browser for next time.
function choosePalette(id) {
  state.palette = usePalette(id).id;
  try { localStorage.setItem('heraldryPalette', state.palette); } catch (e) { /* private window: just not remembered */ }
}
let saved = null;
try { saved = localStorage.getItem('heraldryPalette'); } catch (e) { /* ignore */ }
choosePalette(saved || DEFAULT_PALETTE);

$('title').textContent = TEXT.title;
$('heraldLabel').textContent = TEXT.herald;
render();

// The charge library loads in the background; the page works before it arrives
// (ordinaries need no pictures) and fills in the rest when it does.
loadLibrary().then(loaded => { library = loaded; render(); }).catch(err => console.error(err));
</script>
</body>
</html>
