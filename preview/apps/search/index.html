<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forannán's Shieldpainter 1.0</title>
<style>
  :root { --ink: #2b2620; --paper: #faf6ee; --line: #d8cfba; --accent: #5b4b8a; --muted: #6b6252; --warn: #8a3b2a; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font-family: Georgia, 'Iowan Old Style', serif; background: var(--paper); color: var(--ink); }

  /* Three areas: questions (top left, scrolls), the shield being built (top
     right), and a row of suggestions along the bottom. */
  .app { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; height: 100vh; max-width: 1400px; margin: 0 auto; padding: 12px 16px; }
  .app > * { min-width: 0; }   /* lets the suggestion row scroll sideways instead of widening the page */
  .top { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; min-height: 0; }
  .questions, .current { overflow-y: auto; min-height: 0; }
  .questions { padding-right: 6px; }
  /* On a narrow or short screen everything simply stacks and the page scrolls. */
  @media (max-width: 760px), (max-height: 640px) {
    html, body { height: auto; }
    .app { display: block; height: auto; }
    .top { display: block; }
    .questions, .current { overflow: visible; }
    .current, .suggestions { margin-bottom: 16px; }
  }

  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 20px; }
  h1 { font-size: 1.45rem; margin: 0; }
  h2 { font-size: 1.05rem; margin: 0 0 12px; }
  .herald { font-size: 0.85rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .head-right { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 18px; }
  .mode-link { font-size: 0.8rem; color: var(--accent); }
  /* An option's picture with "make suggestion" under it. */
  .opt { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .opt .card { flex: 1; }
  .opt .link-btn { font-size: 0.68rem; padding: 0; color: var(--muted); }
  .show-row { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 10px 0 0; }
  .ai-link { font-size: 0.75rem; color: var(--muted); }
  /* What "AI disclosure" opens: a box over the page, with an X to shut it. */
  .ai-box { max-width: min(520px, 92vw); border: 1.5px solid var(--ink); border-radius: 10px; padding: 18px 22px; background: #fff; color: var(--ink); font-size: 0.95rem; line-height: 1.45; }
  .ai-box::backdrop { background: rgba(43, 38, 32, 0.45); }
  .ai-box h2 { margin: 0 30px 10px 0; }
  .ai-box p { margin: 0 0 10px; }
  .ai-box p:last-child { margin-bottom: 0; }
  .ai-box a { color: var(--accent); }
  .ai-close { position: absolute; top: 8px; right: 10px; background: none; border: none; font-size: 1.5rem; line-height: 1; padding: 2px 8px; }

  .panel { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
  .current.panel, .suggestions.panel { margin-bottom: 0; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .row-label { font-size: 0.8rem; color: var(--muted); margin: 12px 0 6px; }

  button { font-family: inherit; color: var(--ink); cursor: pointer; }
  .card {
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    background: #fff; border: 2px solid var(--line); border-radius: 8px; padding: 8px 6px; font-size: 0.82rem;
  }
  /* The slim colour menu: small squares with their names beside them, and
     one line underneath saying why any of them are greyed. */
  .slim-sets { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 16px; }
  .slim-extra { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .why-line { color: var(--warn); font-size: 0.8rem; margin: 6px 0 0; }
  .head-left { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
  .save-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 10px; }
  .slim-label { font-size: 0.72rem; font-weight: bold; margin: 0 0 3px 6px; }
  .slim-row { display: flex; flex-wrap: wrap; gap: 2px 4px; border: 1.5px solid var(--muted); border-radius: 16px; padding: 3px 8px; }
  .slim { display: flex; align-items: center; gap: 6px; background: none; border: 2px solid transparent; border-radius: 8px; padding: 3px 6px; font-size: 0.82rem; text-align: center; }
  .slim svg { width: 28px; height: 28px; flex: none; }
  .slim span { display: flex; flex-direction: column; line-height: 1.15; }
  .slim small { font-size: 0.68rem; color: var(--muted); font-weight: normal; }
  .slim[aria-pressed="true"] { border-color: var(--accent); background: #f3f0fa; }
  .card small { color: var(--muted); font-size: 0.72rem; text-align: center; }
  .card { width: 108px; }
  .card svg { width: 72px; height: auto; }
  [aria-pressed="true"] { border-color: var(--accent); background: #f3f0fa; font-weight: bold; }
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .plain-btn { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 5px 11px; font-size: 0.82rem; }
  .text-card { justify-content: center; min-height: 118px; font-style: italic; }
  .name-btn { background: #fff; border: 2px solid var(--line); border-radius: 16px; padding: 4px 11px; font-size: 0.82rem; }

  /* An option the rules do not allow: shown, but greyed, with the reason. */
  .waiting svg { opacity: 0.35; }
  .greyed svg { opacity: 0.3; filter: grayscale(0.7); }
  .greyed { color: var(--muted); }
  .greyed[aria-disabled="true"] { cursor: not-allowed; }
  .why { color: var(--warn); font-size: 0.68rem; font-style: normal; font-weight: normal; text-align: center; line-height: 1.2; }

  /* One block per charge chosen: its name, how many, what colour. */
  .selected-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; margin-top: 12px; }
  .slot { border: 1.5px solid var(--ink); border-radius: 6px; padding: 8px 10px; min-width: 0; }
  .slot-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 10px; font-size: 0.9rem; font-weight: bold; }
  .slot > svg { display: block; width: 72px; height: auto; margin: 6px auto; }
  .pick-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 0.85rem; }
  .pick-label { font-weight: bold; flex: none; }
  .pick-row select { flex: 1; min-width: 0; padding: 3px 6px; }
  .pick-more { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px 6px; margin-top: 4px; }
  .pick-more .link-btn { font-size: 0.75rem; text-decoration: none; border: 1px solid transparent; border-radius: 5px; padding: 0 5px; }
  .pick-more .link-btn[aria-pressed="true"] { border-color: var(--accent); background: #f3f0fa; }
  .name-btn.small { font-size: 0.75rem; padding: 2px 8px; border-width: 1.5px; }
  /* "More complex options": a kind of fur or treatment, two colours, and a button. */
  .maker { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin: 8px 0 4px; }
  .maker svg { width: 30px; height: 30px; flex: none; }
  .maker select { padding: 4px 6px; }
  /* "expand": the bigger box under the cards for one charge's postures, drawings and orientations. */
  .explorer { border: 1.5px solid var(--ink); border-radius: 6px; padding: 8px 12px 12px; margin-top: 10px; }
  .explorer .row-label { font-weight: bold; color: var(--ink); }
  /* How many: stops along a line, like a slider that can show what is not allowed. */
  .track { flex: 1; display: flex; justify-content: space-between; position: relative; min-width: 0; }
  .track::before { content: ''; position: absolute; left: 6px; right: 6px; top: 7px; border-top: 2px solid var(--ink); }
  .stop { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: none; padding: 0 1px; font-size: 0.72rem; min-width: 14px; }
  .stop i { width: 2px; height: 12px; margin-top: 2px; background: var(--ink); border-radius: 1px; }
  .stop[aria-pressed="true"] { background: none; }
  .stop[aria-pressed="true"] i { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
  .stop.greyed i { background: var(--line); }
  /* What colour: the menu above, and every colour as a small square to click. */
  .strip { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 6px; }
  .sq { background: none; border: 2px solid transparent; border-radius: 5px; padding: 0; line-height: 0; }
  .sq svg { width: 20px; height: 20px; }
  .sq[aria-pressed="true"] { border-color: var(--accent); }

  /* The list of charges: a menu on the left, the pictures on the right. */
  .picker { display: grid; grid-template-columns: 132px minmax(0, 1fr); border: 1.5px solid var(--ink); border-radius: 6px; height: 440px; overflow: hidden; }
  .views { overflow-y: auto; background: #e9e1cf; padding: 6px 4px; display: flex; flex-direction: column; }
  .view { background: none; border: 2px solid transparent; border-radius: 5px; padding: 2px 6px; text-align: left; font-size: 0.82rem; font-weight: bold; }
  .view.sub { padding-left: 20px; font-weight: normal; }
  .view-head { font-size: 0.82rem; font-weight: bold; padding: 6px 6px 1px; }
  .picker-grid { overflow-y: auto; padding: 8px; }
  @media (max-width: 560px) { .picker { grid-template-columns: 1fr; height: auto; } .views { max-height: 130px; } .picker-grid { max-height: 420px; } }
  .mode-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 12px; font-size: 0.88rem; font-weight: bold; }
  .switch { width: 46px; height: 22px; border-radius: 12px; border: 1.5px solid var(--ink); background: #e9e1cf; padding: 1px; display: flex; justify-content: flex-start; }
  .switch i { width: 17px; height: 17px; border-radius: 50%; background: var(--ink); }
  .switch[aria-checked="true"] { justify-content: flex-end; }
  .credits { font-size: 0.82rem; margin: 10px 0 0; }
  .credits a { color: var(--accent); }
  .roles { display: grid; gap: 8px; margin-top: 14px; }
  .roles label { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 0.9rem; }

  .builder { display: grid; gap: 10px; margin-top: 14px; }
  .builder label { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 0.9rem; }
  select, input[type="search"] { font-family: inherit; font-size: 0.9rem; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); max-width: 100%; }
  input[type="search"] { width: 100%; margin: 12px 0; }

  .current svg { display: block; width: 100%; max-width: 250px; height: auto; margin: 0 auto 12px; }
  .blazon { font-size: 1.05rem; font-style: italic; margin: 0 0 12px; text-align: center; overflow-wrap: anywhere; }
  .search-link { display: block; text-align: center; background: var(--accent); color: #fff; text-decoration: none; padding: 10px 14px; border-radius: 6px; font-size: 0.95rem; }
  .search-link:hover { background: #453a6b; }
  .note { font-size: 0.82rem; color: var(--muted); margin: 10px 0 0; }
  .palette-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-top: 14px; font-size: 0.95rem; }
  .chips { display: inline-flex; align-items: center; gap: 3px; }
  .chip { display: inline-block; width: 16px; height: 16px; border: 1px solid #3a3226; border-radius: 2px; }
  .chip-gap { display: inline-block; width: 1px; height: 18px; background: #3a3226; margin: 0 4px; }
  .palette-source { font-size: 0.82rem; color: var(--accent); }
  .link-btn { background: none; border: none; padding: 2px 0; color: var(--accent); text-decoration: underline; cursor: pointer; font: inherit; font-size: 0.92rem; text-align: left; }
  .palette-list { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; }
  .palette-option { display: inline-flex; align-items: center; gap: 8px; }
  .collapse-btn { margin-left: 10px; background: none; border: 1px solid var(--line); border-radius: 5px; padding: 1px 8px; font: inherit; font-size: 0.75rem; font-weight: normal; color: var(--muted); cursor: pointer; vertical-align: middle; }
  .panel.collapsed > :not(h2):not(.suggestions-head) { display: none; }
  .panel.collapsed .suggestions-head > :not(h2) { display: none; }
  .help { font-size: 0.88rem; color: var(--muted); margin: -4px 0 12px; }
  .problems { margin: 0 0 12px; padding: 8px 10px 8px 26px; border: 1px solid #e3c4b8; background: #fbf1ec; border-radius: 6px; color: var(--warn); font-size: 0.82rem; }
  details { margin-top: 12px; font-size: 0.8rem; color: var(--muted); }
  code { display: block; white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 6px; color: var(--ink); }

  .suggestions { padding-bottom: 8px; }
  .suggestions-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 8px; }
  .suggestions-head h2 { margin: 0; }
  .suggestion-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; }
  .suggestion-row.waiting { opacity: 0.4; pointer-events: none; }
  .suggestion { flex: none; width: 132px; display: flex; flex-direction: column; align-items: center; gap: 4px; border: 2px solid var(--line); border-radius: 8px; padding: 6px; background: #fff; }
  .suggestion.pinned { border-color: var(--accent); background: #f3f0fa; }
  .suggestion svg { width: 70px; height: auto; }
  /* (The whole blazon shows, however long: its last words are the colours.) */
  .suggestion p { margin: 0; font-size: 0.66rem; font-style: italic; text-align: center; line-height: 1.2; min-height: 3.6em; }
  .suggestion button { width: 100%; background: #fff; border: 1px solid var(--line); border-radius: 5px; padding: 3px 4px; font-size: 0.68rem; }
  .suggestion p + button { margin-top: auto; }
</style>
</head>
<body>
<main class="app">
  <header>
    <div class="head-left">
      <div><h1 id="title"></h1><a class="mode-link" id="modeLink" href="../searchonly/"></a></div>
      <button class="plain-btn" type="button" id="clearAll" data-clear></button>
    </div>
    <div class="head-right">
      <label class="herald"><input type="checkbox" id="herald"> <span id="heraldLabel"></span></label>
      <button class="link-btn ai-link" type="button" id="aiOpen"></button>
    </div>
  </header>
  <div class="top">
    <div class="questions">
      <section class="panel" id="shieldColoursPanel"></section>
      <section class="panel" id="divisionPanel"></section>
      <section class="panel" id="fieldColoursPanel"></section>
      <section class="panel" id="chargePanel"></section>
      <section class="panel" id="arrangePanel"></section>
    </div>
    <aside class="panel current" id="currentPanel" aria-live="polite"></aside>
  </div>
  <section class="panel suggestions" id="suggestionsPanel"></section>
</main>
<dialog id="aiBox" class="ai-box" aria-labelledby="aiTitle">
  <button class="ai-close" type="button" id="aiClose">×</button>
  <h2 id="aiTitle"></h2>
  <div id="aiBody"></div>
</dialog>

<script type="module">

         ARRANGEMENTS, USUAL_ARRANGEMENT, SEMY, arrangementsFor, ORIENTATIONS, isLying, postureCode, ordinaryLabel,
         PATTERNS, tinctureFrom, divisionsTogether } from '../../core/catalog.js';
import { plain, divided, isComplete, isNested, leafTinctures, shieldTinctures, blazon, ordinaryGroup,
         chargeGroupFromLibrary, allGroups, COUNTERCHANGED } from '../../core/shield.js';
import { layoutShield } from '../../core/layout.js';
import { shieldSVG, swatchSVG, counterchangedSwatchSVG } from '../../core/draw.js';
import { shieldPNG } from '../../core/export.js';
import { shieldPatterns, complexSearchURL } from '../../core/oanda.js';
import { loadLibrary, loadPicture, loadPictures, getPicture } from '../../core/art.js';
import { fetchCSV } from '../../core/csv.js';
import { PALETTES, DEFAULT_PALETTE, usePalette, paletteById } from '../../core/palettes.js';
import { checkShield, checkArrangement, paletteLacks } from '../../core/rules.js';
import { randomShield, randomShields, whyNot, whichWork, randomFrom, shuffled, stanceOf } from '../../core/generate.js';
import { arrangements, arrange, unarrange, sameArrangement } from '../../core/arrange.js';

// ---------------------------------------------------------------------------
// ALL THE WORDS ON THE PAGE live here, so they can be rewritten in one place.
// Lines marked DRAFT were placeholders written while building: please rewrite.
// ---------------------------------------------------------------------------

const SUGGESTION_COUNT = 12;   // how many suggestions along the bottom
const MAX_CARDS = 18;          // most option pictures in one group (3 rows of 6)
const MAX_NAMES_SHOWN = 40;
// Every tincture on offer: the plain ones, the furs always shown, and any fur
// or field treatment made under "More complex options" (state.extraTinctures).
const furOrder = () => [...FUR_ORDER, ...state.extraTinctures];
const allTinctures = () => [...COLOUR_ORDER, ...METAL_ORDER, ...furOrder()];
const TWO_TINCTURE = Object.keys(DIVISIONS).filter(d => DIVISIONS[d].parts === 2);
const THREE_TINCTURE = Object.keys(DIVISIONS).filter(d => DIVISIONS[d].parts === 3);
// A fresh starting point for the random pictures each time the page is opened.
const SEED = String(Math.floor(Math.random() * 1e9));

const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const $ = id => document.getElementById(id);
const toggle = (list, x) => (list.includes(x) ? list.filter(y => y !== x) : [...list, x]);
const words = TEXT.placeholders;
// The charge colour "don't specify": search without a colour, and assume none.
const UNSPECIFIED = 'unspecified';
const tinctureOf = item => (item.tincture === UNSPECIFIED ? null : item.tincture);
const MAX_ITEMS = 3;           // how many different charges can be chosen
const NUMBERS = [1, 2, 3, 4, 5, 6, SEMY];  // the "How many?" buttons

// ---- What the user has chosen ------------------------------------------------
// Anything left empty is "not chosen yet": the shield on the right shows it in
// grey, and the suggestions fill it in at random.
const state = {
  herald: false,
  shieldColours: [],     // question 1: tinctures that may be used anywhere
  fieldColours: [],      // question 2: the background's tinctures, in order
  division: null,        // null | 'plain' | a division id | 'complex'
  builder: null,         // the "more complex background" form
  // What is on the field: one entry per charge chosen (up to MAX_ITEMS).
  // The first entry is always there, so "how many" and "what colour" can be
  // answered before a charge is picked.
  //   choice:   null | { kind: 'ordinary', id } | { kind: 'charge', id, file }
  //             A charge's choice may also say how it is turned: `turned`
  //             (an id from ORIENTATIONS in core/catalog.js), `inverted`,
  //             `mirror` (facing sinister) and `noPosture` ("don't specify"
  //             for its posture): see stanceOf in core/generate.js.
  //   number:   null | 1, 2, 3...
  //   anyNumber: true = "don't specify" for how many (otherwise the shield
  //             top right takes it to be as many as it draws)
  //   tincture: null | a tincture id | COUNTERCHANGED | UNSPECIFIED
  //   arranged: how its own charges are set out: undefined or null (not
  //             chosen) | 'usual' | an id from ARRANGEMENTS in core/catalog.js
  items: [{ choice: null, number: null, tincture: null }],
  noCharge: false,       // "no charge" chosen
  arrangement: null,     // how the chosen charges go together (core/arrange.js), or null
  arrangementUnspecified: false,   // "don't specify" ticked for the arrangement
  chargeFilter: '',
  view: 'default',       // which charges the list shows: 'default' | 'all' | 'type:...' | 'theme:...' | 'need:...'
  any: false,            // suggestions may use any of the charges chosen (true) or must use all of them (false)
  showParts: { one: false, two: false },   // "Show one-part backgrounds" / "Show two-part backgrounds" pressed?
  extraTinctures: [],    // furs and field treatments made under "More complex options" (ids from tinctureFrom in core/catalog.js)
  moreOptions: false,    // is "More complex options" open?
  maker: { pattern: 'ermined', first: 'vert', second: 'or' },   // what it is set to make
  explore: null,         // which chosen charge's bigger box of postures and orientations is open ("expand"), or null
  pinned: [],            // suggestions the user has pinned
  epoch: 0,
  palette: DEFAULT_PALETTE, // the colour scheme shields are drawn in
  showPalettes: false,
  fieldUnspecified: false,  // "don't specify" ticked for the background's colours
  collapsed: new Set(),     // ids of question sections the user has collapsed      // is the list of other palettes open?              // goes up when the user asks for different suggestions
};
let library = { charges: [], pictures: [], all: [] };   // filled in once charges/ has loaded (core/art.js)
let shown = [];                                // the suggestions on screen, by position
let shownArrangements = [];                    // the arrangement pictures on screen, by position

// Question 1 says which tinctures may be used. With two or more ticked, only
// those are used. With just one ticked it must appear, but others may too
// (otherwise the only possible shield would be one plain colour).
const palette = () => (state.shieldColours.length >= 2 ? state.shieldColours : null);
const mustInclude = () => (state.shieldColours.length === 1 ? state.shieldColours[0] : null);
const offered = () => palette() || allTinctures();

// Keep the answers consistent with each other after any change.
function tidy() {
  // A colour used for the background or the charge is used in the shield
  // (once any shield colour is ticked: then they are all in the palette).
  if (state.shieldColours.length >= 1) {
    for (const t of [...state.fieldColours, ...state.items.map(tinctureOf)]) {
      if (t && t !== COUNTERCHANGED && !state.shieldColours.includes(t)) state.shieldColours.push(t);
    }
  }
  // How a charge's own charges are set out only lasts while it suits how many there are.
  // (It may be chosen before how many: then any number that suits it is offered.)
  for (const item of state.items) {
    const fits = item.number === null || (item.arranged === 'usual' ? !!USUAL_ARRANGEMENT[item.number] : arrangementsFor(item.number).includes(item.arranged));
    if (item.arranged && !fits) item.arranged = null;
  }
  // An arrangement only lasts while it suits the charges chosen.
  if (state.arrangement) {
    const groups = chosen().map(x => x.group);
    if (!arrangements(groups).some(a => sameArrangement(a, state.arrangement)) && !state.herald) state.arrangement = null;
    else if (state.arrangement.length !== groups.length) state.arrangement = null;
  }
  // The bigger box of postures and orientations is for a charge with a picture.
  const explored = state.explore === null ? null : state.items[state.explore];
  if (state.noCharge || (state.explore !== null && !(explored && explored.choice && explored.choice.kind === 'charge' && explored.choice.file))) state.explore = null;
  // With a "more complex background", the background's colours are whatever
  // the form uses.
  if (state.division === 'complex') state.fieldColours = [...new Set(leafTinctures(builderField()))];
  // A division that cannot hold this many background colours is dropped.
  const d = state.division, k = state.fieldColours.length;
  if (d === 'plain' && k > 1) state.division = null;
  else if (d && d !== 'plain' && d !== 'complex' && k > DIVISIONS[d].parts) state.division = null;
}

// ---- The shield described so far (parts not chosen are null) -----------------
function currentField() {
  const fc = state.fieldColours, d = state.division;
  if (d === 'complex') return builderField();
  if (d === 'plain') return plain(fc[0] ?? null);
  if (d) return divided(d, Array.from({ length: DIVISIONS[d].parts }, (_, i) => plain(fc[i] ?? null)));
  if (fc.length === 1) return plain(fc[0]);     // one background colour and no division: plain
  return null;
}

function groupFor(choice, tincture, number, arranged = null) {
  if (choice.kind === 'ordinary') return ordinaryGroup(choice.id, tincture);
  const charge = library.charges.find(c => c.id === choice.id);
  if (!charge) return null;
  return chargeGroupFromLibrary(charge, pictureRow(choice.file),
    { tincture, number, arranged: arranged === 'usual' ? null : arranged || null, ...stanceOf(choice) });
}

// The charges chosen so far that can be drawn (a charge from the library has
// to wait for the library to load): [{ item, group }], in the order chosen.
function chosen() {
  return state.items.filter(item => item.choice)
    .map(item => ({ item, group: groupFor(item.choice, tinctureOf(item), item.number, item.arranged) }))
    .filter(x => x.group)
    .map(x => ({ ...x, group: x.item.anyNumber ? { ...x.group, anyNumber: true } : x.group }));
}

// How many of a charge, when nobody has said: the shield top right shows
// some number of it (one in the middle, three around a chevron...), so that
// is what the blazon and the search say too (the maintainer, November 2026:
// the search should code "the image displayed"). "don't specify" under the
// number keeps it open.
function assumeNumbers(field, groups) {
  const open = g => g.kind === 'charge' && g.number === null && !g.anyNumber;
  if (!allGroups(groups).some(open)) return groups;
  const layout = layoutShield(field, groups);
  const seen = (g, e, each = 1) => (open(g) && e && e.ok && e.places && e.places.length && e.places.length % each === 0
    ? { ...g, number: e.places.length / each } : g);
  return groups.map((g, i) => {
    const host = seen(g, layout.entries[i]);
    if (!g.charged) return host;
    const each = host.kind === 'charge' && typeof host.number === 'number' ? host.number : 1;
    return { ...host, charged: seen(g.charged, layout.entries[i].tertiary, each) };
  });
}

// The arrangement chosen, if it still fits the charges.
const chosenArrangement = count => (state.arrangement && state.arrangement.length === count ? state.arrangement : null);
// Charge groups put together: as arranged, or (nothing chosen) side by side
// for the core to guess at (shield.js: roles).
const together = (groups, arrangement) => (arrangement ? arrange(groups, arrangement) : groups);

function currentShield() {
  const groups = chosen().map(x => x.group);
  return { field: currentField(), groups: together(groups, chosenArrangement(groups.length)), noCharge: state.noCharge };
}

// The shield shown top right: as chosen, but where what has been chosen
// leaves only ONE legal possibility for something not yet chosen (a part of
// the background, a charge's colour, how the charges are arranged), that one
// is assumed. The user can still choose otherwise, or tick "don't specify"
// to keep it open.
function shownShield() {
  const p = palette();
  let field = currentField();
  if (p && field && !state.fieldUnspecified && !isComplete(field)) field = onlyWay(field, p) || field;
  const picked = chosen();
  let groups = picked.map(x => x.group);
  let arrangement = chosenArrangement(groups.length);
  const legal = (gs, a) => !checkShield({ field, groups: together(gs, a) }).length;
  if (!arrangement && groups.length >= 2 && !state.arrangementUnspecified) {
    const ways = arrangements(groups).filter(a => legal(groups, a));
    if (ways.length === 1) arrangement = ways[0];
  }
  if (p && field && isComplete(field)) {
    picked.forEach(({ item }, i) => {
      if (item.tincture !== null) return;            // chosen, or "don't specify"
      const withTincture = t => groups.map((g, k) => (k === i ? { ...g, tincture: t } : g));
      const ok = [...p, COUNTERCHANGED].filter(t => legal(withTincture(t), arrangement));
      if (ok.length === 1) groups = withTincture(ok[0]);
    });
  }
  return { field, groups: assumeNumbers(field, together(groups, arrangement)), noCharge: state.noCharge };
}

// The one way to fill a field's unchosen colours from `palette` that the
// rules allow, or null if there are none or several.
function onlyWay(field, palette) {
  const ways = fillings(field, palette, 2);
  return ways.length === 1 ? ways[0] : null;
}

// Every way to fill a field's unchosen colours from `palette` that the rules
// allow, up to `most` of them (none if nothing is unchosen, or too much is).
function fillings(field, palette, most = 60) {
  let slots = 0;
  const count = f => { if (f.type === 'plain') slots += f.tincture === null ? 1 : 0; else f.parts.forEach(count); };
  count(field);
  const found = [];
  if (!slots || slots > 3) return found;
  const fill = (f, values) => f.type === 'plain'
    ? (f.tincture === null ? plain(values.shift()) : f)
    : { ...f, parts: f.parts.map(part => fill(part, values)) };
  const tryAll = (chosen) => {
    if (found.length >= most) return;
    if (chosen.length === slots) {
      const f = fill(field, [...chosen]);
      if (!checkShield({ field: f }).length) found.push(f);
      return;
    }
    for (const t of palette) tryAll([...chosen, t]);
  };
  tryAll([]);
  return found;
}

// When the colours ticked for the shield leave the background only one set
// of colours (azure and Or are ticked and the background is per pale), they
// are chosen in "What colours are used in the background?" there and then,
// in the order they were ticked; "Swap the two colours" turns them round
// (the maintainer, November 2026). Done when a division is picked or the
// shield's colours change, not all the time, so that a colour can still be
// taken off the background by hand.
function assumeFieldColours() {
  const p = palette(), d = state.division;
  if (!p || p.length > 4 || !d || d === 'complex' || state.fieldUnspecified) return;
  const field = currentField();
  if (!field || isComplete(field)) return;
  const ways = fillings(field, p);
  const sets = new Set(ways.map(f => [...leafTinctures(f)].sort().join()));
  if (sets.size === 1) state.fieldColours = leafTinctures(ways[0]);
}

// The same for a charge's colour (the maintainer, November 2026): with
// purpure, sable and Or ticked and the background per pale sable and
// purpure, a charge on it can only be Or, so Or is chosen on its card there
// and then. Only where the rules can judge it (a charge alone, or one whose
// place among the others has been chosen), and only when something that
// decides it has just changed, so the colour can still be taken off by hand.
function assumeChargeColours() {
  const p = palette();
  let field = currentField();
  if (p && field && !state.fieldUnspecified && !isComplete(field)) field = onlyWay(field, p) || field;
  if (!p || !field || !isComplete(field)) return;
  const picked = chosen();
  let groups = picked.map(x => x.group);
  const arrangement = chosenArrangement(groups.length);
  const legal = gs => !checkShield({ field, groups: together(gs, arrangement) }).length;
  picked.forEach(({ item }, i) => {
    if (item.tincture !== null) return;                // chosen, or "don't specify"
    const withTincture = t => groups.map((g, k) => (k === i ? { ...g, tincture: t } : g));
    const ok = [...p, COUNTERCHANGED].filter(t => legal(withTincture(t)));
    if (ok.length === 1) { item.tincture = ok[0]; groups = withTincture(ok[0]); }
  });
}

// The charges chosen, in the form generate.js wants: 'none', null (nothing
// chosen about them) or a list. `change` (optional) alters one entry: used to
// ask "what if this charge were this colour?".
function wantedItems(change = null) {
  if (state.noCharge && !change) return 'none';
  const { list, at } = itemList(change ? change.slot : -1);
  if (change) Object.assign(list[at[change.slot]], change.set);
  return list.length ? list : null;
}

// The entries of state.items that say something, as a list for generate.js,
// and where each ended up in it (`at`). Left out: a charge whose library has
// not loaded yet, and a first entry with nothing chosen. `keep` names an
// entry to include whatever it holds.
function itemList(keep = -1) {
  const live = item => !!item.choice && (item.choice.kind === 'ordinary' || library.charges.some(c => c.id === item.choice.id));
  const list = [], at = [];
  state.items.forEach((item, i) => {
    if (!(live(item) || i === keep || (!item.choice && (item.number || tinctureOf(item) || item.arranged)))) return;
    at[i] = list.length;
    list.push({ charge: live(item) ? item.choice : null, number: item.number, tincture: tinctureOf(item), arranged: item.arranged || null });
  });
  return { list, at };
}

// What is fixed, in the form generate.js wants.
function constraints() {
  const field = currentField();
  const items = wantedItems();
  return {
    palette: palette(),
    mustInclude: mustInclude(),
    fieldTinctures: state.fieldColours.length ? state.fieldColours : null,
    division: state.division === 'complex' ? null : state.division,
    field: isComplete(field) ? field : undefined,
    items,
    arrangement: Array.isArray(items) ? chosenArrangement(items.filter(x => x.charge).length) : null,
  };
}

// ---- Random options that stay put --------------------------------------------
// Every random picture is worked out from the page's seed plus exactly what it
// depends on, and remembered, so pictures only change when a relevant choice does.
const remembered = new Map();
function remember(key, make) {
  if (remembered.size > 20000) remembered.clear();
  if (!remembered.has(key)) remembered.set(key, make());
  return remembered.get(key);
}

// An option to show: a random legal shield fitting `c`, or, if there is none,
// an illegal example with the reason. Returns { shield, problems } or null.
const optionKey = (tag, c) => `${SEED}|${tag}|${library.pictures.length}|${JSON.stringify(c)}`;
function option(tag, c) {
  const key = optionKey(tag, c);
  return remember(key, () => {
    const shield = randomShield(c, key, library);
    return shield ? { shield, problems: [] } : whyNot(c, key, library);
  });
}

// ---- Pictures that take a moment -----------------------------------------------
// Working out an option's picture can take a while the first time (several
// charges have to be fitted around each other). So that a click is answered
// at once, a picture not worked out before is first shown as an empty shield
// and filled in a moment later, one at a time, without holding the page up.
let later = [];          // [{ panel, run }] what is still to be worked out, for the page as it stands
let laterTimer = null;
let waitingCards = 0;    // gives each empty card a name of its own
function fillLater() {
  clearTimeout(laterTimer);
  const step = () => {
    const start = performance.now();
    while (later.length && performance.now() - start < 30) later.shift().run();
    if (later.length) laterTimer = setTimeout(step, 0);
  };
  if (later.length) laterTimer = setTimeout(step, 0);
}
// Forget what was waiting for one panel (it is about to be drawn afresh).
const forgetLater = panel => { later = later.filter(x => x.panel !== panel); };

// An option card that may be filled in later. `args(found)` gives what card()
// needs; `found` is what option() returns, or undefined while waiting.
function lazyCard(panel, tag, c, args) {
  const key = optionKey(tag, c);
  if (remembered.has(key)) return card(args(remembered.get(key)));
  const id = `w${waitingCards++}`;
  later.push({ panel, run: () => {
    const waiting = document.querySelector(`[data-waiting="${id}"]`);
    if (!waiting) return;
    const holder = document.createElement('div');
    holder.innerHTML = card(args(option(tag, c)));
    const fresh = holder.firstElementChild, focused = document.activeElement === waiting;
    waiting.replaceWith(fresh);
    if (focused) cardButton(fresh).focus({ preventScroll: true });
  } });
  return card({ ...args(undefined), waiting: id });
}

// ---- Explaining the rules -----------------------------------------------------
function ruleText(problem) {
  if (!problem) return TEXT.rules['not-possible'];
  if (problem.hint) return problem.hint === 'metal' ? TEXT.lowContrastMetal : TEXT.lowContrastColour;
  return TEXT.rules[problem.id] || problem.id;
}
// The same reason as the end of a sentence: "Azure is not available because ...".
function becauseText(problem) {
  const known = TEXT.because[!problem ? 'not-possible' : problem.hint ? (problem.hint === 'metal' ? 'needsMetal' : 'needsColour') : problem.id];
  if (known) return known;
  const whole = ruleText(problem);
  return whole.charAt(0).toLowerCase() + whole.slice(1);
}
// In herald mode nothing is blocked; the reason is still shown.
const blocked = problems => problems.length > 0 && !state.herald;

// ---- Drawing the page ---------------------------------------------------------
// "palette: <name>" with little colour chips, and a list of the others.
const CHIP_METALS = ['argent', 'or'];
const CHIP_COLOURS = ['gules', 'vert', 'azure', 'purpure', 'sable'];
function paletteChips(p) {
  const chip = t => `<span class="chip" style="background:${p.colours[t]}"></span>`;
  return `<span class="chips">${CHIP_METALS.map(chip).join('')}<span class="chip-gap"></span>${CHIP_COLOURS.map(chip).join('')}</span>`;
}
function paletteChooser() {
  const current = paletteById(state.palette);
  let html = `<div class="palette-row"><span>${esc(TEXT.paletteLabel)} <strong>${esc(current.name)}</strong></span>${paletteChips(current)}` +
    `<a class="palette-source" href="${esc(current.source)}" target="_blank" rel="noopener">${esc(TEXT.paletteSource)}</a></div>` +
    `<button class="link-btn" type="button" data-palettes aria-expanded="${state.showPalettes}">${esc(state.showPalettes ? TEXT.fewerPalettes : TEXT.morePalettes)}</button>`;
  if (state.showPalettes) {
    html += `<div class="palette-list">` + PALETTES.filter(p => p.id !== current.id).map(p =>
      `<button class="link-btn palette-option" type="button" data-palette="${p.id}">${esc(p.name)} ${paletteChips(p)}</button>`).join('') + `</div>`;
  }
  return html;
}

// The slim colour menu (the maintainer's sketch, November 2026): a small
// square of each colour with its heraldic name beside it and the everyday
// word underneath in brackets, each set inside its own outline. Used for
// every colour question.
//   ids:   the tinctures to offer         attr: the button's data attribute
//   on:    id => is it chosen?            why:  id => the problems that grey it (a list), or nothing
//   also:  extra buttons for the last row ("don't specify")
// A greyed colour says why in ONE line under the menu, not on the button:
// "Azure is not available because ..." (the maintainer, November 2026).
// Colours greyed for the same reason share a sentence.
function slimSets(ids, { attr, on, why = () => null, counterchanged = false, also = '' }) {
  const reasons = new Map();                    // the end of the sentence -> the names of the colours it rules out
  const one = id => {
    const counter = id === COUNTERCHANGED, t = counter ? null : TINCTURES[id];
    const name = counter ? TEXT.counterchanged : t.name;
    const faults = why(id);
    if (faults) {
      const because = becauseText(faults[0]);
      reasons.set(because, [...(reasons.get(because) || []), name]);
    }
    return `<button class="slim${faults ? ` greyed" aria-disabled="${!state.herald}" title="${esc(ruleText(faults[0]))}` : ''}" type="button" ${attr}="${id}" aria-pressed="${!!on(id)}">` +
      `${counter ? counterchangedSwatchSVG() : swatchSVG(id)}<span><b>${esc(name)}</b>` +
      `${counter || (t.kind !== 'colour' && t.kind !== 'metal') ? '' : `<small>(${esc(t.plain)})</small>`}</span></button>`;
  };
  const set = (label, order) => {
    const list = order.filter(id => ids.includes(id));
    return list.length ? `<div class="slim-set"><div class="slim-label">${esc(label)}</div><div class="slim-row">${list.map(one).join('')}</div></div>` : '';
  };
  const sets = set(TEXT.coloursLabel, COLOUR_ORDER) + set(TEXT.metalsLabel, METAL_ORDER) + set(TEXT.fursLabel, furOrder());
  const last = counterchanged || also
    ? `<div class="slim-set slim-extra">${counterchanged ? `<div class="slim-row">${one(COUNTERCHANGED)}</div>` : ''}${also}</div>` : '';
  const listed = names => cap(names.length > 1 ? names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1] : names[0]);
  const line = [...reasons].map(([because, names]) => TEXT.notAvailable(listed(names), names.length > 1, because)).join('. ');
  return `<div class="slim-sets">${sets}${last}</div>` + (line ? `<p class="why-line">${esc(line)}</p>` : '');
}

// "More complex options" (the maintainer's words, November 2026): the furs
// and field treatments that are made from two colours ("vert ermined Or",
// "vairy purpure and argent", "azure masoned Or"). Choosing a kind and two
// colours and pressing the button adds it to the furs in every colour menu.
// What can be made, and the names, come from PATTERNS in core/catalog.js.
function tinctureMaker() {
  let html = `<button class="link-btn" type="button" data-more-options aria-expanded="${state.moreOptions}">${esc(TEXT.moreOptions)}</button>`;
  if (!state.moreOptions) return html;
  const m = state.maker, id = tinctureFrom(m.pattern, m.first, m.second);
  const opt = (value, label, selected) => `<option value="${value}"${selected ? ' selected' : ''}>${esc(label)}</option>`;
  const colours = which => `<select data-maker="${which}" aria-label="${esc(TEXT.makerColour)}">` +
    [...COLOUR_ORDER, ...METAL_ORDER].map(t => opt(t, TINCTURES[t].name, m[which] === t)).join('') + `</select>`;
  html += `<div class="maker"><select data-maker="pattern" aria-label="${esc(TEXT.makerKind)}">` +
    Object.keys(PATTERNS).map(p => opt(p, PATTERNS[p].name('…', '…'), m.pattern === p)).join('') + `</select>` +
    `${colours('first')} ${colours('second')}` + (id ? swatchSVG(id) : '') +
    `<button class="plain-btn" type="button" data-maker-add${id && !allTinctures().includes(id) ? '' : ' disabled'}>${esc(TEXT.makerAdd(id ? TINCTURES[id].name : ''))}</button>` +
    (id ? '' : `<span class="why">${esc(TEXT.makerNeeds)}</span>`) + `</div>`;
  return html;
}

function renderColourPanels() {
  $('shieldColoursPanel').innerHTML = `<h2>${esc(TEXT.shieldColours)}</h2><p class="help">${esc(TEXT.shieldColoursHelp)}</p>` +
    slimSets(allTinctures(), { attr: 'data-q1', on: id => state.shieldColours.includes(id) }) + tinctureMaker() + paletteChooser();
  $('fieldColoursPanel').innerHTML = `<h2>${esc(TEXT.fieldColours)}</h2><p class="help">${esc(TEXT.fieldColoursHelp)}</p>` +
    slimSets(offered(), { attr: 'data-q2', on: id => state.fieldColours.includes(id),
      also: `<button class="name-btn" type="button" data-field-unspecified aria-pressed="${state.fieldUnspecified}">${esc(TEXT.dontSpecify)}</button>` });
}

// `waiting`: the card's picture is still being worked out (see lazyCard); it
// is shown as an empty shield for now (the same one every time: the list of
// charges has hundreds of them).
let blank = null;
const blankShield = () => blank || (blank = shieldSVG(null));
function card({ attrs, shield, label, on, problems = [], why = null, waiting = null }) {
  const reason = why || (problems.length ? ruleText(problems[0]) : '');
  const greyed = reason ? ` greyed" aria-disabled="${!state.herald}` : '';
  const title = shield ? blazon(shield.field, shield.groups, words) : '';
  const button = `<button class="card${waiting ? ' waiting' : ''}${greyed}" type="button" ${attrs}${waiting ? ` data-waiting="${waiting}"` : ''} aria-pressed="${!!on}">` +
    (shield ? shieldSVG(shield.field, { charges: shield.groups, title }) : waiting ? blankShield() : '') +
    `<span>${esc(label)}</span>${reason ? `<span class="why">${esc(reason)}</span>` : ''}</button>`;
  // "make suggestion" under the picture: somebody who likes the whole design
  // shown (not only the one thing the option is about) can put it among the
  // suggestions, pinned, and take it from there (the maintainer, November
  // 2026). Not under a design the rules forbid.
  if (!shield || reason) return button;
  const pin = `p${pinCount++}`;
  pins.set(pin, shield);
  return `<div class="opt">${button}<button class="link-btn" type="button" data-make-suggestion="${pin}">${esc(TEXT.makeSuggestion)}</button></div>`;
}
// The designs "make suggestion" can add, by the name on their button (begun
// afresh each time the whole page is drawn).
const pins = new Map();
let pinCount = 0;
// The button of an option made by card(), whether or not it has "make suggestion" under it.
const cardButton = made => (made.matches('button') ? made : made.querySelector('button'));

function permutations(list) {
  if (list.length <= 1) return [list];
  return list.flatMap((x, i) => permutations([...list.slice(0, i), ...list.slice(i + 1)]).map(p => [x, ...p]));
}

// "How is the background divided?": one picture per division. When the
// background's colours are not all chosen, the colours shown are random ones
// that the rules allow.
function renderDivisionPanel() {
  const fc = state.fieldColours, k = fc.length;
  const base = { palette: palette(), mustInclude: mustInclude(), charge: 'none', allowBare: true };
  const cards = [];

  const randomCard = id => {
    const found = option('division', { ...base, division: id, fieldTinctures: k ? fc : null });
    const label = id === 'plain' ? (k ? plainLabel(fc[0]) : TEXT.plainBackgroundAny) : DIVISIONS[id].name;
    const on = state.division === id || (id === 'plain' && !state.division && k === 1);
    return card({ attrs: `data-division="${id}"`, shield: found && found.shield, label, on,
                  problems: found ? found.problems : [], why: found ? null : TEXT.rules['not-possible'] });
  };
  const exactCard = (id, order) => {
    const field = divided(id, order.map(plain));
    const problems = checkShield({ field, groups: [] });
    const on = state.division === id && fc.join() === order.join();
    return card({ attrs: `data-division="${id}" data-order="${order.join(',')}"`, shield: { field, groups: [] },
                  label: DIVISIONS[id].name, on, problems });
  };

  const plainCard = t => card({ attrs: `data-division="plain" data-order="${t}"`, shield: { field: plain(t), groups: [] },
                                label: plainLabel(t), on: state.division === 'plain' && fc.join() === t });

  if (k <= 1) {
    cards.push(randomCard('plain'), ...TWO_TINCTURE.map(randomCard), ...THREE_TINCTURE.map(randomCard));
  } else if (k === 2) {
    cards.push(...TWO_TINCTURE.map(id => exactCard(id, fc)));
  } else if (k === 3) {
    cards.push(...THREE_TINCTURE.flatMap(id => permutations(fc).map(order => exactCard(id, order))));
  }
  cards.push(`<button class="card text-card" type="button" data-complex aria-pressed="${state.division === 'complex'}">${esc(TEXT.complexOption)}</button>`);

  // With two or more colours chosen, the backgrounds that use fewer of them
  // are not shown at first, but they are not hidden either (the maintainer,
  // November 2026): "Show one-part backgrounds" and "Show two-part
  // backgrounds" bring them out. And with three or four colours, a few
  // backgrounds that use ALL of them by dividing one part again ("per pale
  // argent and barry sable and Or"); picking one opens it in "more complex
  // background".
  let more = '';
  shownNested = [];
  if (k >= 3) {
    const key = `${SEED}|nested|${fc.join()}`;
    shownNested = remember(key, () => randomShields({ fieldTinctures: fc, charge: 'none', allowBare: true }, key, library, 14)
      .filter(s => isNested(s.field)).slice(0, 6));
    if (shownNested.length) {
      more += `<div class="row-label">${esc(TEXT.nestedLabel)}</div><div class="row">` + shownNested.map((s, i) =>
        card({ attrs: `data-nested="${i}"`, shield: s, label: blazon(s.field, [], words).toLowerCase(), on: false })).join('') + `</div>`;
    }
  }
  if (k >= 2) {
    const toggleBtn = (which, show, hide) => `<button class="link-btn" type="button" data-show="${which}" aria-expanded="${state.showParts[which]}">` +
      `${esc(state.showParts[which] ? hide : show)}</button>`;
    more += `<div class="show-row">${toggleBtn('one', TEXT.showOnePart, TEXT.hideOnePart)}${k >= 3 ? toggleBtn('two', TEXT.showTwoPart, TEXT.hideTwoPart) : ''}</div>`;
    if (state.showParts.one) more += `<div class="row" style="margin-top:8px">${fc.map(plainCard).join('')}</div>`;
    if (state.showParts.two && k >= 3) {
      const pairs = fc.flatMap((a, i) => fc.slice(i + 1).map(b => [a, b]));
      more += pairs.map(pair => `<div class="row-label">${esc(pair.map(t => TINCTURES[t].name).join(' ' + TEXT.builderAnd + ' '))}</div>` +
        `<div class="row">${TWO_TINCTURE.map(id => exactCard(id, pair)).join('')}</div>`).join('');
    }
  }

  $('divisionPanel').innerHTML = `<h2>${esc(TEXT.dividedHeading)}</h2>` +
    (k === 2 ? `<p style="margin:0 0 12px"><button class="plain-btn" type="button" data-swap>⇄ ${esc(TEXT.swap)}</button></p>` : '') +
    `<div class="row">${cards.join('')}</div>` + more +
    (state.division === 'complex' ? renderBuilder() : '');
}
let shownNested = [];                          // the backgrounds with a part divided again, as shown, by position

function plainLabel(tincture) {
  const t = TINCTURES[tincture];
  return TEXT.plainBackground(t.kind !== 'colour' && t.kind !== 'metal' ? t.name : cap(t.plain));
}

// ---- The "more complex background" form ---------------------------------------
function builderToField(b) {
  const parts = b.parts.slice(0, DIVISIONS[b.division].parts).map(p =>
    p.kind === 'plain' ? plain(p.tincture) : divided(p.kind, [plain(p.a), plain(p.b)]));
  // Two divisions counterchanged over each other ("orly and chevronelly"):
  // both parts are plain, and the second division is laid over the first.
  const both = b.over && parts.every(p => p.type === 'plain') ? divisionsTogether(b.division, b.over) : null;
  return divided(both || b.division, parts);
}

function builderFromField(field) {
  if (field.division.includes('+')) {
    const [division, over] = field.division.split('+');
    return { ...builderFromField({ ...field, division }), over };
  }
  const parts = field.parts.map(p => (p.type === 'plain'
    ? { kind: 'plain', tincture: p.tincture, a: p.tincture, b: p.tincture }
    : { kind: p.division, tincture: p.parts[0].tincture, a: p.parts[0].tincture, b: p.parts[1].tincture }));
  while (parts.length < 3) parts.push({ ...parts[0] });
  return { division: field.division, parts };
}

// Any tincture allowed in the shield can be used in the form; whatever the
// form ends up using becomes the answer to "colours used in the background".
const builderTinctures = offered;

// Start the form on a random background the rules allow, using the
// background colours already chosen (and adding others if more are needed).
function defaultBuilder() {
  const chosen = [...state.fieldColours];
  // Two colours: two divisions counterchanged over each other ("lozengy and
  // barry argent and sable": the maintainer, November 2026), if the rules
  // allow those two colours together.
  if (chosen.length === 2) {
    for (let i = 0; i < 40; i++) {
      const [a, b] = shuffled(randomFrom(`${SEED}|builder two|${i}|${chosen.join()}`), TWO_TINCTURE);
      const id = divisionsTogether(a, b);
      const field = id ? divided(id, chosen.map(plain)) : null;
      if (field && !checkShield({ field, groups: [] }).length) return builderFromField(field);
    }
  }
  const pool = offered().filter(t => !chosen.includes(t) && TINCTURES[t].kind !== 'fur');
  for (let i = 0; i < 40; i++) {
    const key = `${SEED}|builder|${i}|${chosen.join()}`;
    const extra = shuffled(randomFrom(key), pool);
    const set = [...chosen, ...extra].slice(0, Math.max(3, Math.min(chosen.length, 4)));
    const found = set.length >= 3 && randomShield({ fieldTinctures: set, charge: 'none', allowBare: true }, key, library);
    if (found && isNested(found.field)) return builderFromField(found.field);
  }
  const t = [...chosen, ...pool, ...allTinctures()];
  return builderFromField(divided('perPale', [plain(t[0]), divided('checky', [plain(t[1]), plain(t[2])])]));
}

function builderField() {
  return builderToField(state.builder || (state.builder = defaultBuilder()));
}

function renderBuilder() {
  const b = state.builder || (state.builder = defaultBuilder());
  const parts = DIVISIONS[b.division].parts;
  // Would this change leave a background the rules allow?
  const allowed = change => {
    if (state.herald) return true;
    const trial = { division: b.division, over: b.over || null, parts: b.parts.map(p => ({ ...p })) };
    change(trial);
    return checkShield({ field: builderToField(trial), groups: [] }).length === 0;
  };
  const opt = (value, label, selected, ok) =>
    `<option value="${value}"${selected ? ' selected' : ''}${ok || selected ? '' : ' disabled'}>${esc(label)}</option>`;
  const tinctureLabel = id => `${TINCTURES[id].plain} (${TINCTURES[id].name})`;

  // Every division may be the first choice: SENA allows a pattern of many
  // pieces with a divided part ("Barry azure and checky gules and argent").
  const tops = Object.keys(DIVISIONS);
  let html = `<div class="builder"><label>${esc(TEXT.builderDivision)} <select data-b="division">` +
    tops.map(id => opt(id, DIVISIONS[id].name, id === b.division, allowed(t => { t.division = id; }))).join('') + `</select></label>`;
  // A second division counterchanged over the first: "orly and chevronelly"
  // (the maintainer, November 2026). Only when each part is one plain colour.
  if (parts === 2 && b.parts.slice(0, 2).every(p => p.kind === 'plain')) {
    html += `<label>${esc(TEXT.builderOver)} <select data-b="over">` + opt('', TEXT.builderNoOver, !b.over, true) +
      TWO_TINCTURE.filter(id => id !== b.division).map(id => opt(id, DIVISIONS[id].name, id === b.over, allowed(t => { t.over = id; }))).join('') + `</select></label>`;
  }
  for (let i = 0; i < parts; i++) {
    const p = b.parts[i];
    const kinds =
      builderTinctures().map(id => opt('plain:' + id, tinctureLabel(id), p.kind === 'plain' && p.tincture === id,
        allowed(t => { t.parts[i].kind = 'plain'; t.parts[i].tincture = id; }))).join('') +
      TWO_TINCTURE.map(id => opt(id, DIVISIONS[id].name + '…', p.kind === id, allowed(t => { t.parts[i].kind = id; }))).join('');
    html += `<label>${esc(TEXT.builderPart(i + 1))} <select data-b="kind" data-i="${i}">${kinds}</select>`;
    if (p.kind !== 'plain') {
      const side = which => `<select data-b="${which}" data-i="${i}">` + builderTinctures().map(id =>
        opt(id, tinctureLabel(id), p[which] === id, allowed(t => { t.parts[i][which] = id; }))).join('') + `</select>`;
      html += `${side('a')} ${esc(TEXT.builderAnd)} ${side('b')}`;
    }
    html += `</label>`;
  }
  return html + `</div>`;
}

// ---- "What charges are on the field?" ------------------------------------------
const sameCharge = (a, b) => !!a && !!b && a.kind === b.kind && a.id === b.id;
const samePicture = (a, b) => sameCharge(a, b) && (a.file || '') === (b.file || '');
// A picture's row in the library (ours, or one from Traceable Heraldic Art).
const pictureRow = file => (file ? library.all.find(p => p.file === file) || null : null);
// Every picture of one charge, its usual one first: the one marked as the
// default (charges/art.csv, or failing that charges/tha.csv), then our own,
// then the rest from Traceable Heraldic Art in the order they were imported.
function picturesOf(id) {
  const byCharge = remember(`pictures-of|${library.all.length}`, () => {
    const map = new Map();
    for (const p of library.all) map.set(p.charge_id, [...(map.get(p.charge_id) || []), p]);
    const rank = p => (p.default === 'TRUE' ? (p.from === 'own' ? 0 : 1) : p.from === 'own' ? 2 : 3);
    for (const list of map.values()) list.sort((a, b) => rank(a) - rank(b));
    return map;
  });
  return byCharge.get(id) || [];
}
const usualPicture = id => picturesOf(id)[0] || null;
// Has this charge a posture at all (one the Ordinary & Armorial records)?
const posable = id => picturesOf(id).some(p => postureCode(p.posture));
// A charge's name in plain words, for labels: "lion rampant", "chevron".
function choiceName(choice, plural = false) {
  if (choice.kind === 'ordinary') return ORDINARIES[choice.id].count === 2 ? ordinaryLabel(choice.id) : ORDINARIES[choice.id].name + (plural ? 's' : '');
  const charge = library.charges.find(c => c.id === choice.id);
  const picture = pictureRow(choice.file);
  const name = charge ? (plural ? (charge.plural || charge.name + 's') : charge.name).toLowerCase() : choice.id;
  return [name, picture && !choice.noPosture && picture.posture].filter(Boolean).join(' ');
}

// ---- The list of charges to pick from ---------------------------------------------
// Everything that can be picked, each as { choice, label, ... }: the
// ordinaries, then one entry per charge that has a picture (shown as its
// usual picture; its other pictures and postures are chosen on its card once
// it is picked), then the charges with no picture.
function everyChoice() {
  return remember(`choices|${library.all.length}|${library.charges.length}`, () => {
    const byName = (a, b) => a.label.localeCompare(b.label);
    const ordinaries = Object.keys(ORDINARIES).map(id => ({ choice: { kind: 'ordinary', id, file: null }, label: ordinaryLabel(id), ordinary: true }));
    const pictures = [...new Set(library.all.map(p => p.charge_id))].map(usualPicture).map(p => ({
      choice: { kind: 'charge', id: p.charge_id, file: p.file }, charge: p.charge, picture: p,
      label: p.charge.name.toLowerCase(), easy: p.complexity === 'Easy to Draw',
    })).sort(byName);
    const drawn = new Set(library.all.map(p => p.charge_id));
    const ordinaryNames = new Set(Object.values(ORDINARIES).map(o => o.name));
    const names = library.charges.filter(ch => !drawn.has(ch.id) && !ordinaryNames.has(ch.name.toLowerCase()))
      .map(ch => ({ choice: { kind: 'charge', id: ch.id, file: null }, charge: ch, label: ch.name.toLowerCase(), blob: true })).sort(byName);
    return { ordinaries, pictures, names };
  });
}

// The maintainer's labels (data/taxonomy.csv): a type and the type it
// belongs under ("Mammal" is under "Animal"), and the topics.
let taxonomy = [];
const parentOf = type => (taxonomy.find(t => t.mode === 'type' && t.value === type) || {}).parent || '';
const topType = type => { let t = type; for (let i = 0; i < 4 && parentOf(t); i++) t = parentOf(t); return t; };
const splitList = text => String(text || '').split(/[;,]/).map(s => s.trim()).filter(Boolean);
// The headings of the list on the left: what there is to filter by.
function viewLists() {
  return remember(`views|${library.charges.length}|${taxonomy.length}`, () => {
    const inOrder = (mode, found) => {
      const listed = taxonomy.filter(t => t.mode === mode && !t.parent).map(t => t.value).filter(v => found.has(v));
      return [...listed, ...[...found].filter(v => !listed.includes(v)).sort()];
    };
    return {
      types: inOrder('type', new Set(library.charges.flatMap(ch => splitList(ch.type).map(topType)))),
      topics: inOrder('theme', new Set(library.charges.flatMap(ch => splitList(ch.themes)))),
    };
  });
}

// Is a picture compact, or long and thin? From its width against its height.
const COMPACT = 1.35, LONG_AND_THIN = 2.4;
const proportion = p => { const s = p && (p.shape || (getPicture(p.file) || {}).aspect); return s ? Math.max(s, 1 / s) : null; };

// The entries shown for a view (state.view), in order. The "default view"
// is everything that can still be chosen: ordinaries first, then the charges
// that are easy to draw, then the rest, each lot in alphabetical order (the
// maintainer, November 2026).
function choicesFor(view) {
  const { ordinaries, pictures, names } = everyChoice();
  if (view === 'default') return [...ordinaries, ...pictures.filter(x => x.easy), ...pictures.filter(x => !x.easy)];
  if (view === 'all') return [...ordinaries, ...pictures, ...names];
  const [kind, value] = [view.slice(0, view.indexOf(':')), view.slice(view.indexOf(':') + 1)];
  if (kind === 'type') return value === 'ordinary' ? ordinaries : [...pictures, ...names].filter(x => splitList(x.charge.type).some(t => topType(t) === value));
  if (kind === 'theme') return [...pictures, ...names].filter(x => splitList(x.charge.themes).includes(value));
  if (view === 'need:easy') return pictures.filter(x => x.easy);
  if (view === 'need:compact') return pictures.filter(x => { const s = proportion(x.picture); return s !== null && s <= COMPACT; });
  if (view === 'need:long') return pictures.filter(x => { const s = proportion(x.picture); return s !== null && s >= LONG_AND_THIN; });
  return [];
}

function viewMenu() {
  const { types, topics } = viewLists();
  const item = (view, label, sub = false) =>
    `<button class="view${sub ? ' sub' : ''}" type="button" data-view="${esc(view)}" aria-pressed="${state.view === view}">${esc(label)}</button>`;
  const head = label => `<div class="view-head">${esc(label)}</div>`;
  return `<nav class="views" aria-label="${esc(TEXT.viewsLabel)}">` + item('default', TEXT.viewDefault) + item('all', TEXT.viewAll) +
    head(TEXT.viewTopic) + topics.map(t => item('theme:' + t, t.toLowerCase(), true)).join('') +
    head(TEXT.viewType) + item('type:ordinary', TEXT.viewOrdinaries, true) + types.map(t => item('type:' + t, t.toLowerCase(), true)).join('') +
    head(TEXT.viewNeed) + item('need:easy', TEXT.viewEasy, true) + item('need:compact', TEXT.viewCompact, true) + item('need:long', TEXT.viewLong, true) +
    `</nav>`;
}

// ---- One chosen charge: its number and colour --------------------------------------
// The line under a colour menu: why some colours are greyed. `greyed` is a
// list of [name, problems]; colours greyed for the same reason share a sentence.
function whyLine(greyed) {
  const reasons = new Map();
  for (const [name, faults] of greyed) {
    const because = becauseText(faults[0]);
    reasons.set(because, [...(reasons.get(because) || []), name]);
  }
  const listed = names => cap(names.length > 1 ? names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1] : names[0]);
  const line = [...reasons].map(([because, names]) => TEXT.notAvailable(listed(names), names.length > 1, because)).join('. ');
  return line ? `<p class="why-line">${esc(line)}</p>` : '';
}

// One chosen charge's card (the maintainer's sketch, November 2026): "you
// selected: lion", a picture of it, its number on a line of stops from 1 to
// semy, and its colour as a menu with a strip of small squares underneath.
// A number or colour is greyed if no shield fitting the other choices could
// have it. Finding that out takes a moment, so it is done after the click
// has been answered (see "Pictures that take a moment"); until then the card
// shows what was greyed before.
const lastTried = new Map();
function slotBlock(slot, c) {
  const item = state.items[slot];
  const { list, at } = itemList(slot);
  const jobs = [];
  const tried = (key, values) => {
    // (A number is judged with the charges set out any way: choosing
    // another number drops a way of setting them out that no longer fits.)
    const items = key === 'number' ? list.map((x, k) => (k === at[slot] ? { ...x, arranged: null } : x)) : list;
    const about = { ...c, items, arrangement: chosenArrangement(list.filter(x => x.charge).length) };
    const memo = `${SEED}|${key}|${at[slot]}|${library.pictures.length}|${JSON.stringify(about)}`;
    const work = () => { lastTried.set(`${slot}|${key}`, remember(memo, () => whichWork(about, at[slot], key, values, memo, library))); };
    if (remembered.has(memo)) work(); else jobs.push(work);
    return lastTried.get(`${slot}|${key}`) || new Map();
  };
  const offer = [...offered(), COUNTERCHANGED];
  const numbers = tried('number', NUMBERS), colours = tried('tincture', offer);
  if (jobs.length) {
    later.push({ panel: 'charge', run: () => {
      jobs.forEach(job => job());
      const block = document.querySelector(`[data-block="${slot}"]`);
      if (!block) return;
      // redraw the card, keeping the keyboard's place in it
      const controls = 'button, select';
      const focused = [...block.querySelectorAll(controls)].indexOf(document.activeElement);
      block.innerHTML = slotBlock(slot, c);
      if (focused >= 0) block.querySelectorAll(controls)[focused]?.focus({ preventScroll: true });
    } });
  }
  const greyedAttr = why => (why ? ` greyed" aria-disabled="${!state.herald}" title="${esc(why)}` : '');
  const tinctureName = id => (id === COUNTERCHANGED ? TEXT.counterchanged : TINCTURES[id].name);

  // The picture: this charge on its own, as chosen so far.
  const group = item.choice ? groupFor(item.choice, tinctureOf(item), item.number, item.arranged) : null;
  let html = `<div class="slot-head">${item.choice
    ? `<span>${esc(TEXT.youSelected(choiceName(item.choice)))}</span><button class="link-btn" type="button" data-remove="${slot}">${esc(TEXT.chargeRemove)}</button>`
    : `<span>${esc(TEXT.noneSelected)}</span>`}</div>` +
    shieldSVG(currentField(), { charges: group ? [group] : [] });

  if (!item.choice || item.choice.kind === 'charge') {
    const stop = n => {
      const faults = numbers.get(n);
      return `<button class="stop${greyedAttr(faults ? ruleText(faults[0]) : '')}" type="button" data-number="${n}" data-slot="${slot}" ` +
        `aria-pressed="${item.number === n}"><i></i><span>${n === SEMY ? esc(TEXT.semy) : n}</span></button>`;
    };
    html += `<div class="pick-row"><span class="pick-label">${esc(TEXT.numberLabel)}</span><div class="track">${NUMBERS.map(stop).join('')}</div></div>` +
      `<div class="pick-more"><button class="link-btn" type="button" data-any-number data-slot="${slot}" aria-pressed="${!!item.anyNumber}">${esc(TEXT.dontSpecify)}</button></div>`;
  }

  const option = (value, label, faults) =>
    `<option value="${value}"${item.tincture === value ? ' selected' : ''}${faults && !state.herald && item.tincture !== value ? ' disabled' : ''}>${esc(label)}</option>`;
  const square = id => `<button class="sq${greyedAttr(colours.get(id) ? ruleText(colours.get(id)[0]) : '')}" type="button" data-slot="${slot}" ` +
    `data-charge-tincture="${id}" aria-pressed="${item.tincture === id}" aria-label="${esc(tinctureName(id))}"` +
    `${colours.get(id) ? '' : ` title="${esc(tinctureName(id))}"`}>${id === COUNTERCHANGED ? counterchangedSwatchSVG() : swatchSVG(id)}</button>`;
  const inOrder = allTinctures().filter(id => offer.includes(id));
  html += `<div class="pick-row"><label class="pick-label" for="colour${slot}">${esc(TEXT.colourLabel)}</label>` +
    `<select id="colour${slot}" data-colour-select="${slot}"><option value="">${esc(TEXT.roleUnset)}</option>` +
    inOrder.map(id => option(id, TINCTURES[id].name, colours.get(id))).join('') +
    option(COUNTERCHANGED, TEXT.counterchanged, colours.get(COUNTERCHANGED)) + option(UNSPECIFIED, TEXT.dontSpecify, null) + `</select></div>` +
    `<div class="strip">${[...inOrder, COUNTERCHANGED].map(square).join('')}</div>`;
  html += whyLine(offer.filter(id => colours.get(id)).map(id => [tinctureName(id), colours.get(id)]));
  if (item.choice && item.choice.kind === 'charge' && item.choice.file) {
    html += stanceRows(slot, item) + `<div class="pick-more"><button class="plain-btn" type="button" data-explore="${slot}" ` +
      `aria-expanded="${state.explore === slot}">${esc(state.explore === slot ? TEXT.collapse : TEXT.expand)}</button></div>`;
  }
  return html;
}

// ---- One chosen charge: its posture, which drawing, and which way it is turned ---------
// (The maintainer, November 2026: "posture", "orientation" and "art" beside
// colour and number.) A posture is one of the charge's pictures, and so is
// another artist's drawing of it; an orientation turns whichever picture is
// chosen (core/catalog.js: ORIENTATIONS).
const postureOf = row => (row && row.posture) || '';
// The orientations a picture can be given: all but the one it is drawn in.
const turnsFor = row => Object.keys(ORIENTATIONS).filter(id => ORIENTATIONS[id][row && isLying(row.shape, row.posture) ? 'wide' : 'tall'] !== 0);
function artName(row) {
  const name = row.name || [row.charge.name, row.posture].filter(Boolean).join(' ');
  return row.from === 'own' ? TEXT.artOurs(name) : row.artist ? TEXT.artBy(name, row.artist) : name;
}
// The first picture of a charge in each posture it has pictures of.
function posturesOf(id) {
  const first = new Map();
  for (const p of picturesOf(id)) if (!first.has(postureOf(p))) first.set(postureOf(p), p);
  return first;
}

function stanceRows(slot, item) {
  const choice = item.choice, now = pictureRow(choice.file);
  if (!now) return '';
  const opt = (value, label, selected) => `<option value="${esc(value)}"${selected ? ' selected' : ''}>${esc(label)}</option>`;
  const row = (id, label, control) => `<div class="pick-row"><label class="pick-label" for="${id}${slot}">${esc(label)}</label>${control}</div>`;
  let html = '';
  const postures = posturesOf(choice.id);
  if (postures.size > 1 || postureOf(now)) {
    html += row('posture', TEXT.postureLabel, `<select id="posture${slot}" data-posture-select="${slot}">` +
      [...postures].map(([posture, p]) => opt(p.file, posture || TEXT.asDrawn, !choice.noPosture && postureOf(now) === posture)).join('') +
      opt('', TEXT.dontSpecify, !!choice.noPosture) + `</select>`);
  }
  const drawings = picturesOf(choice.id).filter(p => postureOf(p) === postureOf(now));
  if (drawings.length > 1) {
    html += row('art', TEXT.artLabel, `<select id="art${slot}" data-art-select="${slot}">` +
      drawings.map(p => opt(p.file, artName(p), p.file === now.file)).join('') + `</select>`);
  }
  html += row('turn', TEXT.orientationLabel, `<select id="turn${slot}" data-turn-select="${slot}">` + opt('', TEXT.asDrawn, !choice.turned) +
    turnsFor(now).map(id => opt(id, ORIENTATIONS[id].name, choice.turned === id)).join('') + `</select>`);
  const flip = (key, label) => `<button class="name-btn small" type="button" data-flip="${key}" data-slot="${slot}" aria-pressed="${!!choice[key]}">${esc(label)}</button>`;
  return html + `<div class="pick-more">${flip('inverted', TEXT.inverted)} ${flip('mirror', TEXT.contourny)}</div>`;
}

// "expand": a bigger box under the cards, the full width of the question, to
// look through a chosen charge's postures, the other drawings of it, and the
// ways it can be turned, each as a picture to click. A picture that has not
// been fetched yet is shown as an empty shield and filled in (fillExplorer).
function explorerBox(slot) {
  const item = state.items[slot];
  if (!item || !item.choice || item.choice.kind !== 'charge' || !item.choice.file) return '';
  const choice = item.choice, now = pictureRow(choice.file), field = currentField();
  if (!now) return '';
  const pictured = (c, attrs, label, on) => {
    const ready = !!getPicture(c.file);
    const group = ready ? groupFor(c, tinctureOf(item), 1) : null;
    return `<button class="card${ready ? '' : ' waiting'}" type="button" ${attrs} data-slot="${slot}" aria-pressed="${!!on}">` +
      (group ? shieldSVG(field, { charges: [group] }) : blankShield()) + `<span>${esc(label)}</span></button>`;
  };
  const section = (label, cards) => (cards.length ? `<div class="row-label">${esc(label)}</div><div class="row">${cards.join('')}</div>` : '');
  const postures = [...posturesOf(choice.id)];
  const drawings = picturesOf(choice.id).filter(p => postureOf(p) === postureOf(now));
  const turn = id => pictured({ ...choice, turned: id }, `data-turn="${id || ''}"`, id ? ORIENTATIONS[id].name : TEXT.asDrawn, (choice.turned || null) === id);
  return `<div class="explorer" id="explorer"><div class="slot-head"><span>${esc(TEXT.exploreHeading(choiceName(choice)))}</span>` +
    `<button class="link-btn" type="button" data-explore="${slot}">${esc(TEXT.exploreClose)}</button></div>` +
    section(TEXT.explorePosture, postures.length > 1 ? postures.map(([posture, p]) =>
      pictured({ ...choice, file: p.file, noPosture: false }, `data-pick-file="${esc(p.file)}"`, posture || TEXT.asDrawn, !choice.noPosture && postureOf(now) === posture)) : []) +
    section(TEXT.exploreArt, drawings.length > 1 ? drawings.map(p =>
      pictured({ ...choice, file: p.file }, `data-pick-file="${esc(p.file)}"`, p.from === 'own' ? TEXT.artOurs('').trim() : p.artist || p.name || '', p.file === now.file)) : []) +
    section(TEXT.exploreOrientation, [turn(null), ...turnsFor(now).map(turn),
      pictured({ ...choice, inverted: !choice.inverted }, `data-flip="inverted"`, TEXT.inverted, choice.inverted),
      pictured({ ...choice, mirror: !choice.mirror }, `data-flip="mirror"`, TEXT.contourny, choice.mirror)]) +
    `</div>`;
}
// Fetch whatever pictures the open box still needs, then draw it again.
function fillExplorer() {
  const slot = state.explore, item = slot === null ? null : state.items[slot];
  if (!item || !item.choice || item.choice.kind !== 'charge') return;
  const missing = picturesOf(item.choice.id).filter(p => !getPicture(p.file));
  if (!missing.length) return;
  loadPictures(missing).then(() => {
    const box = $('explorer');
    if (box && state.explore === slot && state.items[slot] === item) box.outerHTML = explorerBox(slot);
  });
}

// Give a chosen charge another of its pictures (another posture, or another
// drawing): fetched first, so that it is never drawn as a blob.
async function setPicture(slot, file) {
  await loadPicture(file).catch(() => null);
  const item = state.items[slot];
  if (!item || !item.choice || !getPicture(file)) return;
  item.choice = { ...item.choice, file, noPosture: false };
  // (a picture drawn lying down has no "fesswise" to be turned to, and so on)
  if (item.choice.turned && !turnsFor(pictureRow(file)).includes(item.choice.turned)) item.choice.turned = null;
  tidy();
  render();
}

// ---- "What charges are on the field?" -----------------------------------------------
// A list to pick from, with a menu on its left to narrow it down and a box
// to search it by name (the maintainer's sketch, November 2026). There are
// hundreds of charges, so a card is only worked out when it is scrolled into
// view, and a picture from Traceable Heraldic Art is only fetched then.
let gridJobs = new Map();     // a waiting card's name -> what works it out
let gridWatcher = null;
let gridShowing = '';         // the view and search the list was last drawn for
function renderChargePanel() {
  forgetLater('charge');
  gridJobs = new Map();
  if (gridWatcher) gridWatcher.disconnect();
  const c = constraints();
  const q = state.chargeFilter.trim().toLowerCase();
  const first = state.items[0];
  const count = state.items.filter(item => item.choice).length;
  const isPicked = choice => state.items.some(item => sameCharge(item.choice, choice));

  // The default view leaves out what cannot be chosen any more. Whether a
  // charge can is only known once its card has been worked out, so first one
  // charge with no picture is tried: if that cannot be chosen, nor can the rest.
  const hiding = state.view === 'default' && !q;
  const itemsWith = choice => {
    const mine = state.items.findIndex(item => sameCharge(item.choice, choice));
    if (mine >= 0) return { mine, items: wantedItems({ slot: mine, set: { charge: choice } }) };   // chosen (perhaps as another picture)
    if (!first.choice) return { mine, items: [{ charge: choice, number: choice.kind === 'ordinary' ? null : (first.number || 1), tincture: tinctureOf(first) }] };
    if (count >= MAX_ITEMS) return { mine, items: null };
    return { mine, items: [...(wantedItems() || []), { charge: choice, number: null, tincture: null }] };
  };
  const about = (choice, { mine, items }) => ({ ...c, items, arrangement: mine >= 0 ? c.arrangement : chosenArrangement(items.length - 1) });
  const greyed = found => found === null || (found && found.problems.length > 0);
  let anyCharge = true;
  if (hiding && library.charges.length) {
    const probe = { kind: 'charge', id: library.charges[0].id, file: null };
    const made = itemsWith(probe);
    anyCharge = !!made.items && !greyed(option('charge', about(probe, made)));
  }

  // Each option is drawn on a shield that fits everything else chosen so far:
  // with the charges already chosen, if it would be added to them.
  const chargeCard = ({ choice, label, ordinary }) => {
    const attrs = `data-charge="${choice.kind}:${esc(choice.id)}:${esc(choice.file || '')}"`;
    const picked = isPicked(choice);
    // (A charge already picked is shown as it was picked: that picture, turned that way.)
    if (picked) choice = state.items.find(item => sameCharge(item.choice, choice)).choice;
    const made = itemsWith(choice);
    if (!made.items) return hiding ? '' : card({ attrs, shield: null, label, on: false, why: TEXT.chargeFull });
    if (hiding && !ordinary && !anyCharge && !picked) return '';
    const what = about(choice, made), key = optionKey('charge', what);
    const args = found => ({ attrs, shield: found && found.shield, label, on: picked, problems: found ? found.problems : [],
                             why: found === null ? TEXT.rules['not-possible'] : null });
    const hidden = found => hiding && !picked && greyed(found);
    if (remembered.has(key) && (!choice.file || getPicture(choice.file))) {
      const found = remembered.get(key);
      return hidden(found) ? '' : card(args(found));
    }
    const id = `w${waitingCards++}`;
    gridJobs.set(id, async () => {
      if (choice.file) await loadPicture(choice.file).catch(() => null);
      const waiting = document.querySelector(`[data-waiting="${id}"]`);
      if (!waiting) return;
      const found = option('charge', what);
      if (hidden(found)) { waiting.remove(); return; }
      const holder = document.createElement('div');
      holder.innerHTML = card(args(found));
      const fresh = holder.firstElementChild, focused = document.activeElement === waiting;
      waiting.replaceWith(fresh);
      if (focused) cardButton(fresh).focus({ preventScroll: true });
    });
    return card({ ...args(undefined), waiting: id });
  };

  const every = everyChoice();
  const matching = list => list.filter(x => x.label.toLowerCase().includes(q));
  // Searching by name looks through everything, whatever the menu is set to.
  const list = q ? matching([...every.ordinaries, ...every.pictures, ...every.names]) : choicesFor(state.view);
  const cards = list.filter(x => !x.blob).map(chargeCard).join('');
  const names = list.filter(x => x.blob);
  const namesShown = names.slice(0, MAX_NAMES_SHOWN);

  let html = `<h2>${esc(TEXT.chargeHeading)}</h2><p class="help">${esc(TEXT.chargeHelp)} <strong>${esc(TEXT.chargeBelow)}</strong></p>`;
  html += `<input type="search" id="chargeFilter" value="${esc(state.chargeFilter)}" placeholder="${esc(TEXT.chargeSearch)}" aria-label="${esc(TEXT.chargeSearch)}">`;
  let grid = `<div class="row">` +
    `<button class="card text-card" type="button" data-charge="none" aria-pressed="${state.noCharge}">${esc(TEXT.chargeNone)}</button>${cards}</div>`;
  if (hiding && !anyCharge) grid += `<p class="note">${esc(TEXT.chargeNoneLeft)}</p>`;
  if (namesShown.length) {
    grid += `<div class="row-label">${esc(TEXT.chargeNoPicture)}</div><div class="row">` +
      namesShown.map(x => `<button class="name-btn" type="button" data-charge="charge:${esc(x.choice.id)}:" ` +
        `aria-pressed="${isPicked(x.choice)}">${esc(x.label)}</button>`).join('') + `</div>`;
