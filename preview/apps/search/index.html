    if (names.length > namesShown.length) grid += `<p class="note">${esc(TEXT.chargeMore(names.length - namesShown.length))}</p>`;
  }
  if (!list.length) grid += `<p class="note">${esc(TEXT.chargeNoMatch)}</p>`;
  html += `<div class="picker">${viewMenu()}<div class="picker-grid" id="chargeGrid">${grid}</div></div>`;

  // "Suggestions include any of my selections" or "Must include ALL".
  html += `<div class="mode-row"><span>${esc(TEXT.modeAny)}</span>` +
    `<button class="switch" type="button" role="switch" data-mode aria-checked="${!state.any}" aria-label="${esc(TEXT.modeAll)}"><i></i></button>` +
    `<span>${esc(TEXT.modeAll)}</span></div>`;

  // A card for each charge chosen: its number and colour. (The first is there
  // before any charge is chosen, so those can be answered first.)
  if (!state.noCharge) {
    html += `<div class="selected-row">` +
      state.items.map((item, slot) => `<div class="slot" data-block="${slot}">${slotBlock(slot, c)}</div>`).join('') + `</div>`;
    if (state.explore !== null) html += explorerBox(state.explore);
  }

  // Keep the list where it was scrolled to, unless it is now a different list.
  const showing = `${state.view}|${q}`, was = $('chargeGrid');
  const top = was && showing === gridShowing ? was.scrollTop : 0;
  gridShowing = showing;
  $('chargePanel').innerHTML = html;
  const box = $('chargeGrid');
  box.scrollTop = top;
  // Work out each waiting card when it comes into view.
  gridWatcher = new IntersectionObserver(seen => {
    for (const one of seen) {
      if (!one.isIntersecting) continue;
      gridWatcher.unobserve(one.target);
      const job = gridJobs.get(one.target.dataset.waiting);
      if (job) later.push({ panel: 'charge', run: job });
    }
    fillLater();
  }, { root: box, rootMargin: '250px' });
  box.querySelectorAll('[data-waiting]').forEach(el => gridWatcher.observe(el));
  fillExplorer();
}

// ---- "How are they arranged?" ----------------------------------------------------
// Two things, both as pictures, with the ways the rules forbid greyed and the
// reason given:
//   * how each charge's own charges are arranged (in pale, in bend...), which
//     needs only one kind of charge;
//   * with two or more kinds, every way they can go together, so that nobody
//     needs to know the words "primary", "secondary" and "tertiary".

// A row of pictures for each charge whose own charges can be arranged: the
// usual way for that many, then each named arrangement. Only charges that can
// be in the middle of the shield have a choice so far (ROADMAP item 7), and a
// single charge, or charges strewn (semy), have none. With nothing picked
// yet the row shows charges at random.
function arrangedRows(c, current) {
  if (state.noCharge) return '';
  const picked = state.items.filter(item => item.choice);
  if (picked.some(item => item.choice.kind === 'ordinary' && !ORDINARIES[item.choice.id].peripheral)) return '';
  const main = current ? current.findIndex(x => x.as === 'primary') : -1;
  // (Once one charge has been given an arrangement, only that one has a row:
  // it is the one in the middle, and the others have no choice yet.)
  const already = state.items.some(item => item.arranged);
  const slots = state.items.map((item, slot) => ({ item, slot })).filter(({ item, slot }) => {
    if (item.number === 1 || item.number === SEMY) return false;
    if (!item.choice) return slot === 0 && state.items.length === 1;
    if (already && !item.arranged) return false;
    return item.choice.kind === 'charge' && (!current || picked.indexOf(item) === main);
  }).slice(0, 2);
  return slots.map(({ item, slot }) => {
    const ways = ['usual', ...(item.number ? arrangementsFor(item.number) : Object.keys(ARRANGEMENTS))];
    return (picked.length > 1 ? `<div class="row-label">${esc(choiceName(item.choice, true))}</div>` : '') +
      `<div class="row">` + ways.map(id => {
        // (the usual way is shown with three if how many has not been chosen)
        const set = id === 'usual' ? { arranged: id, number: item.number || 3 } : { arranged: id };
        return lazyCard('arrange', 'charge-arranged', { ...c, items: wantedItems({ slot, set }) }, found => ({
          attrs: `data-slot="${slot}" data-arranged="${id}"`, shield: found && found.shield,
          label: id !== 'usual' ? ARRANGEMENTS[id].name : (USUAL_ARRANGEMENT[item.number] || TEXT.arrangedUsual), on: item.arranged === id,
          problems: found ? found.problems : [], why: found === null ? TEXT.rules['not-possible'] : null,
        }));
      }).join('') + `</div>`;
  }).join('');
}

function renderArrangePanel() {
  forgetLater('arrange');
  const c = constraints();
  const picked = chosen();
  const groups = picked.map(x => x.group);
  let html = `<h2>${esc(TEXT.arrangeHeading)}</h2>`;
  shownArrangements = [];
  const current = chosenArrangement(groups.length);
  const several = groups.length >= 2;
  // How each charge's own charges are arranged ("in pale", "in bend"...).
  const own = arrangedRows(c, current);
  if (!several && !own) {
    const strewn = state.items.some(item => item.number === SEMY);
    $('arrangePanel').innerHTML = html + `<p class="note" style="margin:0">${esc(strewn ? TEXT.arrangeSemy : TEXT.arrangeNothing)}</p>`;
    return;
  }
  // How different charges go together (with two or more kinds of charge).
  const ways = several ? arrangements(groups) : [];
  if (several && own) html += `<div class="row-label" style="margin-top:0">${esc(TEXT.arrangeTogether)}</div>`;
  if (several && !ways.length) html += `<p class="note" style="margin:0">${esc(TEXT.arrangeNone)}</p>`;
  else if (several) {
    // What goes under a picture: "lions around the chevron; mullets on the chief".
    const label = (way, example) => {
      const drawn = example ? unarrange(example.groups).groups : [];
      const several = i => {
        const choice = picked[i].item.choice;
        const g = drawn.find(x => (x.kind === 'ordinary' ? x.ordinary : x.charge) === choice.id && x.kind === choice.kind);
        return !!g && g.kind === 'charge' && g.number !== 1;
      };
      const name = (i, as) => choiceName(picked[i].item.choice, as === 'around' || several(i));
      const main = way.findIndex(x => x.as === 'primary');
      const bits = way.map((x, i) =>
        x.as === 'around' ? TEXT.arrAround(name(i, x.as), name(main)) : x.as === 'chief' ? TEXT.arrChief(name(i), name(main))
        : x.as === 'base' ? TEXT.arrBase(name(i), name(main)) : x.as === 'on' ? TEXT.arrOn(name(i), name(x.on))
        : x.as === 'edge' && main >= 0 && way.length === 2 ? TEXT.arrWith(name(main), name(i)) : null).filter(Boolean);
      return bits.join('; ') || picked.map((x, i) => name(i)).join(', ');
    };
    // The ways the rules have nothing against come first (as far as can be
    // told before the colours are looked at); no more than fit in three rows.
    const sound = way => !checkArrangement(arrange(groups, way)).length;
    shownArrangements = [...ways.filter(sound), ...ways.filter(way => !sound(way))].slice(0, MAX_CARDS);
    html += `<div class="row">` + shownArrangements.map((way, k) =>
      lazyCard('arrange', 'arrangement', { ...c, arrangement: way }, found => ({
        attrs: `data-arrangement="${k}"`, shield: found && found.shield, label: label(way, found && found.shield),
        on: sameArrangement(way, current), problems: found ? found.problems : [], why: found === null ? TEXT.rules['not-possible'] : null,
      }))).join('') + `</div>`;
  }
  if (several) {
    html += `<div class="row" style="margin-top:10px"><button class="name-btn" type="button" data-arrangement-unspecified ` +
      `aria-pressed="${state.arrangementUnspecified}">${esc(TEXT.dontSpecify)}</button></div>`;
  }
  html += own;

  // "I'm a herald": say directly what each charge is.
  if (state.herald && several) {
    const opt = (value, text, selected) => `<option value="${value}"${selected ? ' selected' : ''}>${esc(text)}</option>`;
    html += `<div class="roles">` + picked.map(({ item, group }, i) => {
      const now = current ? current[i] : null;
      const is = (as, on = null) => !!now && now.as === as && (now.on ?? null) === on;
      const edge = group.kind === 'ordinary' && ORDINARIES[group.ordinary].peripheral;
      const options = edge ? opt('edge', TEXT.roleEdge, true)
        : opt('', TEXT.roleUnset, !now) + opt('primary', TEXT.rolePrimary, is('primary')) + opt('around', TEXT.roleAround, is('around')) +
          opt('chief', TEXT.roleChief, is('chief')) + opt('base', TEXT.roleBase, is('base')) +
          picked.map((other, j) => (j === i ? '' : opt('on:' + j, TEXT.roleOn(choiceName(other.item.choice)), is('on', j)))).join('');
      return `<label>${esc(TEXT.rolesLabel(choiceName(item.choice)))} <select data-role="${i}"${edge ? ' disabled' : ''}>${options}</select></label>`;
    }).join('') + `</div>`;
  }
  $('arrangePanel').innerHTML = html;
}

// ---- The shield being built (top right) ----------------------------------------
// Who drew the pictures on the shield. The pictures from the Book of
// Traceable Heraldic Art are shared under a Creative Commons licence that
// asks for the artist to be named (charges/tha/README.md).
const LICENCE_URL = 'https://heraldicart.org/credits';
function creditsLine(groups) {
  const credits = new Map();
  for (const g of groups.flatMap(g => (g.charged ? [g, g.charged] : [g]))) {
    const row = g.kind === 'charge' ? pictureRow(g.art) : null;
    if (!row || row.from !== 'tha' || !(row.artist || row.link)) continue;
    const name = esc(row.charge.name.toLowerCase());
    // (A picture whose artist the collection's list does not give: the name
    // links to the charge's page there instead: the maintainer, November 2026.)
    const text = (row.artist ? TEXT.creditBy('\u0000', row.artist) : TEXT.creditPage('\u0000')).split('\u0000');
    credits.set(row.file, esc(text[0]) + (row.link ? `<a href="${esc(row.link)}" target="_blank" rel="noopener">${name}</a>` : name) + esc(text[1] || ''));
  }
  if (!credits.size) return '';
  return `<p class="credits"><strong>${esc(TEXT.credits)}</strong> ${[...credits.values()].join(', ')}<br>` +
    `<a href="${LICENCE_URL}" target="_blank" rel="noopener">${esc(TEXT.licence)}</a></p>`;
}

function renderCurrent() {
  const shield = shownShield();
  const text = blazon(shield.field, shield.groups, words);
  const patterns = shieldPatterns(shield.field, shield.groups, { noCharge: shield.noCharge });
  const problems = checkShield(shield);
  const f = shield.field;
  const noTinctures = f && f.type === 'divided' && DIVISIONS[f.division].tincturesIndexed === false;
  // The search is missing something about a charge: how many, or (for a
  // charge that has postures) which posture.
  // A charge on a canton: allowed here, with a warning (the maintainer, November 2026).
  const augmented = shield.groups.some(g => g.kind === 'ordinary' && g.ordinary === 'canton' && g.charged);
  const needs = allGroups(shield.groups).some(g => g.kind === 'charge' &&
    (g.number === null || (posable(g.charge) && !postureCode(g.posture))));
  $('currentPanel').innerHTML =
    shieldSVG(f, { charges: shield.groups, title: text }) +
    `<p class="blazon">${esc(text)}</p>` +
    (problems.length || augmented ? `<ul class="problems">${problems.map(p =>
      `<li>${esc(ruleText(p))}${p.sena ? ` (SENA ${esc(p.sena)})` : ''}</li>`).join('')}` +
      `${augmented ? `<li>${esc(TEXT.augmentation)}</li>` : ''}</ul>` : '') +
    (patterns.length ? `<a class="search-link" href="${esc(complexSearchURL(patterns))}" target="_blank" rel="noopener">${esc(TEXT.searchLink)} →</a>` : '') +
    (needs && patterns.length ? `<p class="why-line" style="text-align:center">${esc(TEXT.searchNeeds)}</p>` : '') +
    `<div class="save-row"><button class="plain-btn" type="button" data-save="colour">${esc(TEXT.savePng)}</button>` +
    `<button class="plain-btn" type="button" data-save="outlines">${esc(TEXT.saveOutlines)}</button></div>` +
    `<p class="note" id="saveNote" role="status" hidden></p>` + creditsLine(shield.groups) +
    (noTinctures ? `<p class="note">${esc(TEXT.tincturesNotIndexed)}</p>` : '') +
    (patterns.length ? `<details><summary>${esc(TEXT.patternsSummary)}</summary><code>${esc(patterns.join('\n'))}</code></details>` : '');
}

// ---- Suggestions (along the bottom) ---------------------------------------------
function renderSuggestions() {
  // Suggestions may add a charge or two that was not asked for (a bordure,
  // charges around an ordinary...): they are ideas, not only what was chosen.
  const c = { ...constraints(), extras: true };
  // "Suggestions include any of my selections": each suggestion has some of
  // the charges chosen (one, or two, or all), in turn; "Must include ALL of
  // my selections": every suggestion has them all.
  const picks = Array.isArray(c.items) ? c.items.filter(x => x.charge) : [];
  const anyOf = state.any && picks.length >= 2;
  const key = `${SEED}|suggest|${anyOf}|${state.epoch}|${library.pictures.length}|${JSON.stringify(c)}`;
  const wanted = SUGGESTION_COUNT + state.pinned.length;
  const make = () => {
    if (!anyOf) return randomShields(c, key, library, wanted);
    const some = [];
    for (let bits = 1; bits < (1 << picks.length); bits++) some.push(picks.filter((x, i) => bits & (1 << i)));
    some.sort((a, b) => a.length - b.length);
    const each = Math.ceil(wanted / some.length) + 1;
    const lists = some.map((items, i) => randomShields(
      { ...c, items, arrangement: items.length === picks.length ? c.arrangement : null }, `${key}|${i}`, library, each));
    const found = [], seen = new Set();
    for (let turn = 0; turn < each && found.length < wanted; turn++) {
      for (const list of lists) {
        const s = list[turn], text = s && blazon(s.field, s.groups);
        if (s && !seen.has(text) && found.length < wanted) { seen.add(text); found.push(s); }
      }
    }
    return found;
  };
  // New suggestions are worked out a moment later (see "Pictures that take a
  // moment"); until then the ones on screen stay, dimmed.
  forgetLater('suggestions');
  if (!remembered.has(key)) {
    later.push({ panel: 'suggestions', run: () => {
      remember(key, make);
      renderSuggestions();
      addCollapseButtons();
    } });
    const row = $('suggestionsPanel').querySelector('.suggestion-row');
    if (row) { row.classList.add('waiting'); return; }
  }
  const pinnedText = new Set(state.pinned.map(s => blazon(s.field, s.groups)));
  const fresh = (remembered.get(key) || [])
    .filter(s => !pinnedText.has(blazon(s.field, s.groups))).slice(0, SUGGESTION_COUNT);
  shown = [...state.pinned, ...fresh];

  const suggestion = (s, i) => {
    const text = blazon(s.field, s.groups);
    const pinned = i < state.pinned.length;
    return `<div class="suggestion${pinned ? ' pinned' : ''}">${shieldSVG(s.field, { charges: s.groups, title: text })}` +
      `<p title="${esc(text)}">${esc(text)}</p>` +
      `<button type="button" data-select="${i}">${esc(TEXT.select)}</button>` +
      `<button type="button" data-pin="${i}">${esc(pinned ? TEXT.unpin : TEXT.pin)}</button></div>`;
  };
  const note = !remembered.has(key) ? '' : !fresh.length ? TEXT.noSuggestions
    : fresh.length < SUGGESTION_COUNT / 2 || (palette() && paletteLacks(palette())) ? fewReason() : '';
  $('suggestionsPanel').innerHTML =
    `<div class="suggestions-head"><h2>${esc(TEXT.suggestions)}</h2>` +
    `<button class="plain-btn" type="button" data-reroll>↻ ${esc(TEXT.reroll)}</button>` +
    (note ? `<span class="note" style="margin:0">${esc(note)}</span>` : '') + `</div>` +
    `<div class="suggestion-row">${shown.map(suggestion).join('')}</div>`;
}

// Why only a few suggestions can be made: the most useful thing to change.
function fewReason() {
  const p = palette();
  if (p) {
    const lacks = paletteLacks(p);
    if (lacks === 'metal') return TEXT.fewNeedMetal;
    if (lacks === 'colour') return TEXT.fewNeedColour;
    if (p.length <= 3) return TEXT.fewMoreColours;
  }
  return TEXT.fewSuggestions;
}

function render() {
  // How long each part took, in milliseconds, is kept in window.renderTimes
  // (for whoever next needs to find out why the page feels slow).
  const times = {};
  pins.clear();
  for (const part of [renderColourPanels, renderDivisionPanel, renderChargePanel, renderArrangePanel, renderCurrent, renderSuggestions]) {
    const start = performance.now();
    part();
    times[part.name] = Math.round(performance.now() - start);
  }
  window.renderTimes = times;
  addCollapseButtons();
  fillLater();
}

// A "collapse" / "expand" button beside each section's heading.
const COLLAPSIBLE = ['shieldColoursPanel', 'fieldColoursPanel', 'divisionPanel', 'chargePanel', 'arrangePanel', 'suggestionsPanel'];
function addCollapseButtons() {
  for (const id of COLLAPSIBLE) {
    const panel = $(id), heading = panel.querySelector('h2');
    if (!heading) continue;
    const closed = state.collapsed.has(id);
    panel.classList.toggle('collapsed', closed);
    heading.querySelector('.collapse-btn')?.remove();     // (a panel may not have been redrawn)
    heading.insertAdjacentHTML('beforeend',
      ` <button class="collapse-btn" type="button" data-collapse="${id}" aria-expanded="${!closed}">${esc(closed ? TEXT.expand : TEXT.collapse)}</button>`);
  }
}

// ---- "select this shield": copy a suggestion into the questions ------------------
function adopt(shield) {
  const { field, groups } = shield;
  state.fieldColours = [...new Set(leafTinctures(field))];
  if (field.type === 'plain') { state.division = 'plain'; state.builder = null; }
  else if (isNested(field) || field.division.includes('+')) { state.division = 'complex'; state.builder = builderFromField(field); }
  else { state.division = field.division; state.builder = null; state.fieldColours = leafTinctures(field); }
  // The charges, one entry each, and how they go together.
  const made = unarrange(groups);
  state.items = made.groups.map(g => ({
    choice: g.kind === 'ordinary' ? { kind: 'ordinary', id: g.ordinary, file: null }
      : { kind: 'charge', id: g.charge, file: g.art, turned: g.turned || null, inverted: !!g.inverted, mirror: !!g.mirror },
    number: g.kind === 'ordinary' ? null : g.number,
    arranged: g.arranged || (g.kind !== 'ordinary' && USUAL_ARRANGEMENT[g.number] ? 'usual' : null),
    tincture: g.tincture,
  }));
  state.noCharge = !state.items.length;
  if (state.noCharge) state.items = [{ choice: null, number: null, tincture: null }];
  state.arrangement = made.groups.length > 1 ? made.arrangement : null;
  state.arrangementUnspecified = false;
  // Every colour the shield uses is ticked in the first question too.
  state.shieldColours = [...new Set([...state.shieldColours, ...shieldTinctures(field, groups)])];
}

// Take a charge off the shield. The first entry stays, emptied, with its
// number and colour (as it was before a charge was picked).
function removeItem(at) {
  // The arrangement chosen for the others is kept if it still makes sense
  // without this one (nothing lay on it, and it was not what they were around).
  const was = chosenArrangement(state.items.filter(item => item.choice).length);
  const needed = was && was.some((x, i) => i !== at && (x.on === at || (was[at].as === 'primary' && x.as !== 'edge' && x.as !== 'on')));
  state.arrangement = was && !needed && was.length > 2
    ? was.filter((x, i) => i !== at).map(x => (x.as === 'on' && x.on > at ? { ...x, on: x.on - 1 } : x)) : null;
  if (state.items.length === 1) state.items[0].choice = null;
  else state.items.splice(at, 1);
  state.explore = null;
}

// Put another charge on the shield. A chief, bordure, orle or base has only
// one place it can go, so an arrangement already chosen still stands.
function addItem(choice) {
  const was = chosenArrangement(state.items.filter(item => item.choice).length);
  state.items.push({ choice, number: null, tincture: null });
  state.arrangement = was && choice.kind === 'ordinary' && ORDINARIES[choice.id].peripheral ? [...was, { as: 'edge' }] : null;
}

// ---- "clear all" and saving the picture ----------------------------------------------
// "clear all" takes back every answer to the questions. It leaves alone what
// is not an answer: the palette, the "I'm a herald" tick, the suggestions
// pinned, and which sections are collapsed.
function clearAll() {
  Object.assign(state, {
    shieldColours: [], fieldColours: [], fieldUnspecified: false, division: null, builder: null,
    items: [{ choice: null, number: null, tincture: null }], noCharge: false,
    arrangement: null, arrangementUnspecified: false, chargeFilter: '', explore: null,
  });
}

// Save the shield shown top right as a PNG (core/export.js): coloured in, or
// its outlines alone. The file is named after the blazon.
async function savePicture(outlines) {
  const shield = shownShield();
  const name = blazon(shield.field, shield.groups, words).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 80) || 'shield';
  const note = $('saveNote');
  if (note) note.hidden = true;
  try {
    const blob = await shieldPNG(shield.field, shield.groups, { outlines });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `${name}${outlines ? '-outlines' : ''}.png`;
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(link.href), 60000);
  } catch (err) {
    console.error(err);
    const now = $('saveNote');
    if (now) { now.textContent = TEXT.saveFailed; now.hidden = false; }
  }
}

// ---- Reacting to clicks and typing -------------------------------------------------
document.addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  // Greyed options do nothing unless "I'm a herald" is ticked.
  if (btn.getAttribute('aria-disabled') === 'true') return;
  const d = btn.dataset;
  // (assume / assumeCharge: this click may leave only one possible set of
  // background colours, or one possible colour for a charge: see
  // assumeFieldColours and assumeChargeColours.)
  let refocus = null, assume = false, assumeCharge = false;
  if (d.save) { savePicture(d.save === 'outlines'); return; }
  if (d.makeSuggestion) {
    // "make suggestion": the whole design under that button joins the suggestions, pinned.
    const design = pins.get(d.makeSuggestion);
    if (!design) return;
    const text = blazon(design.field, design.groups);
    if (!state.pinned.some(s => blazon(s.field, s.groups) === text)) state.pinned.push(design);
    renderSuggestions();
    addCollapseButtons();
    fillLater();
    const row = document.querySelector('.suggestion-row');
    if (row) row.scrollLeft = 0;
    return;
  }
  if (d.show) {
    // "Show one-part backgrounds" / "Show two-part backgrounds"
    state.showParts = { ...state.showParts, [d.show]: !state.showParts[d.show] };
    refocus = `[data-show="${d.show}"]`;
  } else if (d.nested) {
    // A background with one part divided again, from the pictures: it opens
    // in "more complex background", where it can be changed.
    const picked = shownNested[Number(d.nested)];
    if (!picked) return;
    state.division = 'complex';
    state.builder = builderFromField(picked.field);
    assumeCharge = true;
    refocus = '[data-complex]';
  } else if ('clear' in d) {
    clearAll();
    refocus = '[data-clear]';
  } else if (d.view) {
    state.view = d.view;
    refocus = `[data-view="${d.view}"]`;
  } else if ('mode' in d) {
    state.any = !state.any;
    refocus = '[data-mode]';
  } else if (d.q1) {
    const removing = state.shieldColours.includes(d.q1);
    state.shieldColours = toggle(state.shieldColours, d.q1);
    if (removing) {
      // A colour no longer used in the shield cannot be in the background or on the charge.
      state.fieldColours = state.fieldColours.filter(t => t !== d.q1);
      for (const item of state.items) if (item.tincture === d.q1) item.tincture = null;
      state.builder = null;
    }
    assume = true;
    refocus = `[data-q1="${d.q1}"]`;
  } else if ('moreOptions' in d) {
    state.moreOptions = !state.moreOptions;
    refocus = '[data-more-options]';
  } else if ('makerAdd' in d) {
    // The fur or treatment made joins the furs on offer, and the shield's
    // colours if any are ticked.
    const id = tinctureFrom(state.maker.pattern, state.maker.first, state.maker.second);
    if (id && !allTinctures().includes(id)) state.extraTinctures.push(id);
    if (id && state.shieldColours.length && !state.shieldColours.includes(id)) state.shieldColours.push(id);
    refocus = `[data-q1="${id}"]`;
  } else if ('fieldUnspecified' in d) {
    state.fieldUnspecified = !state.fieldUnspecified;
    refocus = '[data-field-unspecified]';
  } else if ('collapse' in d) {
    if (state.collapsed.has(d.collapse)) state.collapsed.delete(d.collapse); else state.collapsed.add(d.collapse);
    refocus = `[data-collapse="${d.collapse}"]`;
  } else if (d.q2) {
    state.fieldUnspecified = false;
    state.fieldColours = toggle(state.fieldColours, d.q2);
    state.builder = null;
    // ("more complex background" needs two colours at least: with fewer it
    // would add colours of its own, and the one just taken off would seem
    // to come straight back.)
    if (state.division === 'complex' && state.fieldColours.length < 2) state.division = null;
    assumeCharge = true;
    refocus = `[data-q2="${d.q2}"]`;
  } else if (d.division) {
    // Clicking the chosen division again un-chooses it.
    const order = d.order ? d.order.split(',') : null;
    const same = state.division === d.division && (!order || order.join() === state.fieldColours.join());
    state.division = same ? null : d.division;
    if (order && !same) state.fieldColours = order;
    assume = !same;
    refocus = `[data-division="${d.division}"]` + (d.order ? `[data-order="${d.order}"]` : '');
  } else if ('complex' in d) {
    state.division = state.division === 'complex' ? null : 'complex';
    assumeCharge = true;
    refocus = '[data-complex]';
  } else if ('swap' in d) {
    state.fieldColours = [...state.fieldColours].reverse();
    assumeCharge = true;
    refocus = '[data-swap]';
  } else if (d.charge) {
    if (d.charge === 'none') {
      // "no charge": everything chosen about charges is dropped, except the
      // first entry's number and colour (as before a charge was picked).
      state.noCharge = !state.noCharge;
      if (state.noCharge) { state.items = [{ ...state.items[0], choice: null }]; state.arrangement = null; }
    } else {
      const [kind, id, file] = d.charge.split(':');
      const choice = { kind, id, file: file || null };
      const at = state.items.findIndex(item => sameCharge(item.choice, choice));
      state.noCharge = false;
      if (at >= 0) removeItem(at);                                                  // picked again: taken off
      else if (!state.items[0].choice) state.items[0].choice = choice;
      else if (state.items.length < MAX_ITEMS) addItem(choice);
      assumeCharge = true;
    }
    refocus = `[data-charge="${d.charge}"]`;
  } else if (d.remove) {
    removeItem(Number(d.remove));
  } else if (d.number) {
    const n = d.number === SEMY ? SEMY : Number(d.number), item = state.items[Number(d.slot)];
    item.number = item.number === n ? null : n;
    item.anyNumber = false;
    refocus = `[data-number="${d.number}"][data-slot="${d.slot}"]`;
  } else if ('anyNumber' in d) {
    const item = state.items[Number(d.slot)];
    item.anyNumber = !item.anyNumber;
    if (item.anyNumber) item.number = null;
    refocus = `[data-any-number][data-slot="${d.slot}"]`;
  } else if (d.explore) {
    // "expand" on a chosen charge's card: open (or shut) its bigger box.
    state.explore = state.explore === Number(d.explore) ? null : Number(d.explore);
    refocus = `.slot [data-explore="${d.explore}"]`;
  } else if (d.pickFile) {
    setPicture(Number(d.slot), d.pickFile).then(() => document.querySelector(`[data-pick-file="${CSS.escape(d.pickFile)}"]`)?.focus({ preventScroll: true }));
    return;
  } else if ('turn' in d) {
    const item = state.items[Number(d.slot)];
    item.choice = { ...item.choice, turned: d.turn || null };
    refocus = `[data-turn="${d.turn}"][data-slot="${d.slot}"]`;
  } else if (d.flip) {
    const item = state.items[Number(d.slot)];
    item.choice = { ...item.choice, [d.flip]: !item.choice[d.flip] };
    refocus = `[data-flip="${d.flip}"][data-slot="${d.slot}"]`;
  } else if (d.chargeTincture) {
    const item = state.items[Number(d.slot)];
    item.tincture = item.tincture === d.chargeTincture ? null : d.chargeTincture;
    refocus = `[data-charge-tincture="${d.chargeTincture}"][data-slot="${d.slot}"]`;
  } else if (d.arranged) {
    const item = state.items[Number(d.slot)];
    item.arranged = item.arranged === d.arranged ? null : d.arranged;
    refocus = `[data-arranged="${d.arranged}"][data-slot="${d.slot}"]`;
  } else if (d.arrangement) {
    // Clicking the chosen arrangement again un-chooses it.
    const way = shownArrangements[Number(d.arrangement)];
    state.arrangement = sameArrangement(way, state.arrangement) ? null : way;
    state.arrangementUnspecified = false;
    assumeCharge = true;
    refocus = `[data-arrangement="${d.arrangement}"]`;
  } else if ('arrangementUnspecified' in d) {
    state.arrangementUnspecified = !state.arrangementUnspecified;
    if (state.arrangementUnspecified) state.arrangement = null;
    refocus = '[data-arrangement-unspecified]';
  } else if (d.select) {
    adopt(shown[Number(d.select)]);
  } else if (d.pin) {
    const i = Number(d.pin);
    if (i < state.pinned.length) state.pinned.splice(i, 1);
    else state.pinned.push(shown[i]);
  } else if ('palettes' in d) {
    state.showPalettes = !state.showPalettes;
    refocus = '[data-palettes]';
  } else if (d.palette) {
    choosePalette(d.palette);
    state.showPalettes = false;
    refocus = '[data-palettes]';
  } else if ('reroll' in d) {
    state.epoch++;
    refocus = '[data-reroll]';
  } else return;
  tidy();
  if (assume) { assumeFieldColours(); tidy(); }
  if (assume || assumeCharge) { assumeChargeColours(); tidy(); }
  render();
  // preventScroll: keep the page where it is instead of jumping to the button.
  if (refocus) document.querySelector(refocus)?.focus({ preventScroll: true });
});

document.addEventListener('change', e => {
  if (e.target.id === 'herald') { state.herald = e.target.checked; render(); return; }
  // "I'm a herald": one charge's place in the design, said directly. The
  // others keep the places they have (as chosen, or as drawn).
  const role = e.target.closest('select[data-role]');
  if (role) {
    const groups = chosen().map(x => x.group), i = Number(role.dataset.role);
    const base = chosenArrangement(groups.length) || unarrange(groups).drawn;
    if (role.value === '') state.arrangement = null;
    else {
      const [as, on] = role.value.split(':');
      state.arrangement = base.map((x, k) => (k === i ? (as === 'on' ? { as, on: Number(on) } : { as }) : x));
      state.arrangementUnspecified = false;
    }
    tidy();
    render();
    document.querySelector(`select[data-role="${i}"]`)?.focus({ preventScroll: true });
    return;
  }
  // "More complex options": the kind of fur or treatment, and its two colours.
  const maker = e.target.closest('select[data-maker]');
  if (maker) {
    state.maker = { ...state.maker, [maker.dataset.maker]: maker.value };
    render();
    document.querySelector(`select[data-maker="${maker.dataset.maker}"]`)?.focus({ preventScroll: true });
    return;
  }
  // A chosen charge's posture, which drawing of it, and which way it is turned.
  const pose =e.target.closest('select[data-posture-select], select[data-art-select]');
  if (pose) {
    const slot = Number(pose.dataset.postureSelect ?? pose.dataset.artSelect), key = pose.id;
    const refocus = () => document.getElementById(key)?.focus({ preventScroll: true });
    if (pose.value) setPicture(slot, pose.value).then(refocus);
    else {                                            // "don't specify" for the posture
      state.items[slot].choice = { ...state.items[slot].choice, noPosture: true };
      tidy();
      render();
      refocus();
    }
    return;
  }
  const turn = e.target.closest('select[data-turn-select]');
  if (turn) {
    const slot = Number(turn.dataset.turnSelect);
    state.items[slot].choice = { ...state.items[slot].choice, turned: turn.value || null };
    tidy();
    render();
    document.getElementById(turn.id)?.focus({ preventScroll: true });
    return;
  }
  // A chosen charge's colour, from the menu on its card.
  const colour = e.target.closest('select[data-colour-select]');
  if (colour) {
    state.items[Number(colour.dataset.colourSelect)].tincture = colour.value || null;
    tidy();
    render();
    document.querySelector(`select[data-colour-select="${colour.dataset.colourSelect}"]`)?.focus({ preventScroll: true });
    return;
  }
  const sel = e.target.closest('select[data-b]');
  if (!sel) return;
  const b = state.builder, i = Number(sel.dataset.i);
  if (sel.dataset.b === 'division') { b.division = sel.value; if (b.over === b.division) b.over = null; }
  else if (sel.dataset.b === 'over') b.over = sel.value || null;
  else if (sel.dataset.b === 'kind') {
    if (sel.value.startsWith('plain:')) { b.parts[i].kind = 'plain'; b.parts[i].tincture = sel.value.slice(6); }
    else b.parts[i].kind = sel.value;
  } else b.parts[i][sel.dataset.b] = sel.value;
  const key = `select[data-b="${sel.dataset.b}"]` + (sel.dataset.i ? `[data-i="${sel.dataset.i}"]` : '');
  tidy();
  assumeChargeColours();
  tidy();
  render();
  document.querySelector(key)?.focus({ preventScroll: true });
});

// Typing in the charge search box: redraw the list, keep the cursor in place.
document.addEventListener('input', e => {
  if (e.target.id !== 'chargeFilter') return;
  state.chargeFilter = e.target.value;
  const at = e.target.selectionStart;
  renderChargePanel();
  addCollapseButtons();
  fillLater();
  const box = $('chargeFilter');
  box.focus({ preventScroll: true });
  box.setSelectionRange(at, at);
});

// The chosen palette is remembered in this browser for next time.
function choosePalette(id) {
  state.palette = usePalette(id).id;
  try { localStorage.setItem('heraldryPalette', state.palette); } catch (e) { /* private window: just not remembered */ }
}
let saved = null;
try { saved = localStorage.getItem('heraldryPalette'); } catch (e) { /* ignore */ }
choosePalette(saved || DEFAULT_PALETTE);

$('title').textContent = TEXT.title;
$('modeLink').textContent = TEXT.modeLink;
$('clearAll').textContent = TEXT.clearAll;
$('heraldLabel').textContent = TEXT.herald;

// "AI disclosure": a small link in the corner that opens a box over the page.
const marked = text => esc(text)
  .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
  .replace(/\*([^*]+)\*/g, '<em>$1</em>');
$('aiOpen').textContent = TEXT.aiDisclosure;
$('aiTitle').textContent = TEXT.aiDisclosure;
$('aiClose').setAttribute('aria-label', TEXT.aiClose);
$('aiBody').innerHTML = TEXT.aiText.map(p => `<p>${marked(p)}</p>`).join('');
$('aiOpen').addEventListener('click', () => $('aiBox').showModal());
$('aiClose').addEventListener('click', () => $('aiBox').close());
$('aiBox').addEventListener('click', e => {      // a click outside the box shuts it too
  const box = $('aiBox'), r = box.getBoundingClientRect();
  if (e.target === box && (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom)) box.close();
});
render();

// The charge library loads in the background; the page works before it arrives
// (ordinaries need no pictures) and fills in the rest when it does.
// The suggestions draw on our own pictures and a few of the commonest
// easy-to-draw ones from Traceable Heraldic Art (charges/priority.csv has
// the charges in order of how often blazons name them); every other picture
// is fetched when its card comes into view or it is chosen.
const STARTER_PICTURES = 12;
async function starterPictures(loaded) {
  const ranked = await fetchCSV(new URL('../../charges/priority.csv', import.meta.url).href).catch(() => []);
  const rank = new Map(ranked.map(r => [r.id, Number(r.rank)]));
  const easy = loaded.all.filter(p => p.from === 'tha' && p.complexity === 'Easy to Draw' && rank.has(p.charge_id))
    .sort((a, b) => rank.get(a.charge_id) - rank.get(b.charge_id));
  return loadPictures(easy.slice(0, STARTER_PICTURES));
}
loadLibrary().then(async loaded => {
  const [starter, labels] = await Promise.all([
    starterPictures(loaded).catch(() => []),
    fetchCSV(new URL('../../data/taxonomy.csv', import.meta.url).href).catch(() => []),
  ]);
  taxonomy = labels;
  // (Suggestions leave out a picture of ours where the maintainer prefers
  // the one from Traceable Heraldic Art: the crescent, November 2026.)
  const preferred = new Set(loaded.all.filter(p => p.from === 'tha' && p.default === 'TRUE').map(p => p.charge_id));
  library = { ...loaded, pictures: [...loaded.pictures.filter(p => !preferred.has(p.charge_id)), ...starter] };
  render();
}).catch(err => console.error(err));
</script>
</body>
